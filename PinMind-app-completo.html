<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PinMind — ARQUIVO ÚNICO PORTÁTIL. Basta abrir este arquivo no navegador. Nada para instalar. -->
<title>PinMind — Produção Pinterest com IA (grátis)</title>
<meta name="description" content="App de produção para Pinterest com IA gratuita: valida nicho e produto, gera os prompts, valida o visual e monta o pack de pins. Você só cola o link.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<style>
/* =========================================================================
   BLOGMASTER — PINMIND · Estilo
   Paleta: quente e clara (o que mais converte no Pinterest) com acento rosa/vinho
   ========================================================================= */
:root{
  --bg:#faf7f4; --bg2:#fffdfb; --card:#ffffff; --linha:#eadfd8; --linha2:#f5ece7;
  --tinta:#2b2320; --tinta2:#6d5d55; --tinta3:#9c8b83;
  --accent:#c2185b; --accent2:#e0507f; --accent-suave:#fdeef4;
  --ok:#137a4d; --ok-suave:#e8f7ef; --aviso:#a8700a; --aviso-suave:#fdf4e3;
  --erro:#b3261e; --erro-suave:#fdecea; --info:#1a5fb4; --info-suave:#eaf2fd;
  --sombra:0 1px 2px rgba(43,35,32,.05), 0 6px 20px rgba(43,35,32,.06);
  --sombra2:0 2px 6px rgba(43,35,32,.08), 0 14px 40px rgba(43,35,32,.10);
  --r:14px; --r2:20px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}h4{font-size:.95rem}
p{margin:0 0 .8rem}
small,.mini{font-size:.82rem;color:var(--tinta2)}
code,kbd{font-family:var(--mono);font-size:.85em;background:var(--linha2);padding:.1em .4em;border-radius:5px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.topo{grid-column:1/-1;display:flex;gap:.75rem;align-items:center;justify-content:space-between;
  padding:.7rem 1.1rem;background:var(--bg2);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:50}
.marca{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1rem;letter-spacing:-.02em}
.marca .bolinha{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff9a3d);display:grid;place-items:center;color:#fff;font-size:.8rem}
.topo-acoes{display:flex;gap:.5rem;flex-wrap:wrap}

.lateral{background:var(--bg2);border-right:1px solid var(--linha);padding:1rem .75rem 3rem;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
.lateral h4{color:var(--tinta3);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:1rem .5rem .4rem}
.passo{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;
  padding:.5rem .6rem;cursor:pointer;font:inherit;color:var(--tinta2);transition:.15s}
.passo:hover{background:var(--linha2);color:var(--tinta)}
.passo.on{background:var(--accent-suave);color:var(--accent);font-weight:650}
.passo .num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--linha);color:var(--tinta2);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.passo.on .num{background:var(--accent);color:#fff}
.passo .txt{font-size:.87rem;line-height:1.3}
.passo .sub{display:block;font-size:.72rem;color:var(--tinta3);font-weight:400}
.passo.feito .num{background:var(--ok);color:#fff}

.conteudo{padding:1.4rem 1.6rem 5rem;max-width:1080px}
.cabecalho-passo{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--linha)}
.cabecalho-passo .etapa{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:1.05rem 1.1rem;margin-bottom:1rem;box-shadow:var(--sombra)}
.card.tight{padding:.8rem .9rem}
.card h3{display:flex;align-items:center;gap:.5rem;justify-content:space-between}
.grid{display:grid;gap:1rem}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.linha{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.espaco{justify-content:space-between}

/* ---------- form ---------- */
label{display:block;font-size:.8rem;font-weight:650;margin:.6rem 0 .25rem;color:var(--tinta2)}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{
  width:100%;padding:.55rem .7rem;border:1px solid var(--linha);border-radius:10px;background:#fff;font:inherit;font-size:.9rem;color:var(--tinta)}
textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:.83rem;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:1px;border-color:var(--accent2)}
.ajuda{font-size:.76rem;color:var(--tinta3);margin-top:.2rem}

/* ---------- botões ---------- */
button.btn,.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--linha);background:#fff;color:var(--tinta);
  padding:.5rem .85rem;border-radius:10px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:.15s}
button.btn:hover,.btn:hover{border-color:var(--tinta3);background:var(--linha2)}
button.btn.primario{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primario:hover{background:#a3144c}
button.btn.suave{background:var(--accent-suave);border-color:#f6d5e3;color:var(--accent)}
button.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.btn.perigo{background:#fff;border-color:#f0c4c0;color:var(--erro)}
button.btn.mini{padding:.3rem .55rem;font-size:.78rem}
button:disabled{opacity:.5;cursor:not-allowed}

/* ---------- pills e tags ---------- */
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.16rem .55rem;border-radius:999px;font-size:.73rem;font-weight:650;background:var(--linha2);color:var(--tinta2)}
.pill.ok{background:var(--ok-suave);color:var(--ok)}
.pill.aviso{background:var(--aviso-suave);color:var(--aviso)}
.pill.erro{background:var(--erro-suave);color:var(--erro)}
.pill.info{background:var(--info-suave);color:var(--info)}
.pill.accent{background:var(--accent-suave);color:var(--accent)}

/* ---------- tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--linha2);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta3);font-weight:700;background:var(--bg2)}
tr:hover td{background:var(--bg2)}

/* ---------- checklist ---------- */
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border-radius:10px;border:1px solid transparent}
.check:hover{background:var(--bg2)}
.check.peso3{border-left:3px solid var(--erro)}
.check.peso2{border-left:3px solid var(--aviso)}
.check.peso1{border-left:3px solid var(--linha)}
.check .q{flex:1;font-size:.87rem}
.check .dica{display:block;font-size:.75rem;color:var(--tinta3);margin-top:.15rem}
.botoes-sim{display:flex;gap:.25rem;flex:0 0 auto}
.botoes-sim button{border:1px solid var(--linha);background:#fff;width:34px;height:30px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--tinta3)}
.botoes-sim button.sim.on{background:var(--ok);border-color:var(--ok);color:#fff}
.botoes-sim button.nao.on{background:var(--erro);border-color:var(--erro);color:#fff}

/* ---------- score ---------- */
.score-caixa{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.anel{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;flex:0 0 auto;color:#fff}
.anel.verde{background:conic-gradient(var(--ok) var(--pct), var(--linha) 0)}
.anel.amarelo{background:conic-gradient(var(--aviso) var(--pct), var(--linha) 0)}
.anel.vermelho{background:conic-gradient(var(--erro) var(--pct), var(--linha) 0)}
.anel.cinza{background:conic-gradient(var(--tinta3) var(--pct), var(--linha) 0)}
.anel span{width:72px;height:72px;border-radius:50%;background:#fff;color:var(--tinta);display:grid;place-items:center;font-size:1.25rem}

/* ---------- prompt ---------- */
.prompt{background:#231f1e;color:#f6efe9;border-radius:12px;padding:.9rem 1rem;font-family:var(--mono);font-size:.79rem;
  line-height:1.6;white-space:pre-wrap;max-height:420px;overflow:auto;border:1px solid #3b3330}
.prompt.curto{max-height:230px}
.barra-prompt{display:flex;gap:.4rem;align-items:center;justify-content:space-between;margin-bottom:.4rem;flex-wrap:wrap}

/* ---------- destaque ---------- */
.destaque{border-left:4px solid var(--accent);background:var(--accent-suave);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.87rem}
.aviso-caixa{border-left:4px solid var(--aviso);background:var(--aviso-suave);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.87rem}
.perigo-caixa{border-left:4px solid var(--erro);background:var(--erro-suave);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.87rem}
.ok-caixa{border-left:4px solid var(--ok);background:var(--ok-suave);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.87rem}
.info-caixa{border-left:4px solid var(--info);background:var(--info-suave);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.87rem}

/* ---------- seletor ---------- */
.opcao{border:1px solid var(--linha);border-radius:12px;padding:.75rem .85rem;cursor:pointer;background:#fff;transition:.15s;text-align:left;width:100%;font:inherit}
.opcao:hover{border-color:var(--accent2);box-shadow:var(--sombra)}
.opcao.on{border-color:var(--accent);background:var(--accent-suave);box-shadow:var(--sombra)}
.opcao .tt{font-weight:700;font-size:.92rem;margin-bottom:.15rem}
.opcao .ds{font-size:.8rem;color:var(--tinta2)}
.opcao .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}

/* ---------- pin card ---------- */
.pin-card{display:grid;grid-template-columns:120px 1fr;gap:.9rem;border:1px solid var(--linha);border-radius:12px;padding:.75rem;margin-bottom:.7rem;background:#fff}
.pin-thumb{width:120px;height:180px;border-radius:8px;background:linear-gradient(150deg,#fdeef4,#fdf4e3);display:grid;place-items:center;
  font-size:.7rem;color:var(--tinta3);text-align:center;padding:.4rem;border:1px solid var(--linha)}
.pin-corpo h4{margin-bottom:.3rem;font-size:.92rem}

/* ---------- progresso ---------- */
.barra{height:7px;background:var(--linha);border-radius:999px;overflow:hidden;margin:.5rem 0}
.barra > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:.3s}

/* ---------- abas ---------- */
.abas{display:flex;gap:.25rem;border-bottom:1px solid var(--linha);margin-bottom:1rem;flex-wrap:wrap}
.aba{border:0;background:none;padding:.55rem .8rem;font:inherit;font-size:.86rem;font-weight:650;color:var(--tinta3);cursor:pointer;border-bottom:2px solid transparent}
.aba.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- modal ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(43,35,32,.45);display:grid;place-items:center;padding:1rem;z-index:100}
.modal{background:#fff;border-radius:var(--r2);max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:1.3rem;box-shadow:var(--sombra2)}

/* ---------- bíblia embutida ---------- */
.biblia-nav{columns:2;column-gap:1rem}
.biblia-nav a{display:block;padding:.2rem 0;font-size:.85rem;break-inside:avoid}

/* leitura dos capítulos (markdown convertido) */
.md{font-size:.92rem;line-height:1.7}
.md h1{font-size:1.5rem;margin:1.4rem 0 .6rem;padding-bottom:.4rem;border-bottom:2px solid var(--accent-suave)}
.md h2{font-size:1.2rem;margin:1.6rem 0 .5rem;color:var(--accent)}
.md h3{font-size:1.03rem;margin:1.2rem 0 .4rem}
.md h4{font-size:.94rem;margin:1rem 0 .3rem;color:var(--tinta2)}
.md > h1:first-child{margin-top:0}
.md p{margin:0 0 .7rem}
.md ul,.md ol{margin:0 0 .8rem;padding-left:1.35rem}
.md li{margin-bottom:.25rem}
.md ul.lista-check{list-style:none;padding-left:.2rem}
.md ul.lista-check li{margin-bottom:.3rem}
.md hr{border:0;border-top:1px solid var(--linha);margin:1.4rem 0}
.md blockquote{margin:.9rem 0;padding:.7rem .9rem;border-left:4px solid var(--accent);
  background:var(--accent-suave);border-radius:0 10px 10px 0}
.md blockquote p:last-child{margin-bottom:0}
.md table{margin:.8rem 0}
.md pre{margin:.8rem 0;overflow:auto}
.md code{background:var(--linha2);padding:.1em .35em;border-radius:5px;font-size:.85em}
.md pre code{background:none;padding:0;color:inherit}
.md a{font-weight:600}
.md strong{color:var(--tinta)}

/* ---------- utilidades ---------- */
.mt{margin-top:1rem}.mt2{margin-top:1.6rem}.mb{margin-bottom:1rem}.mb0{margin-bottom:0}
.direita{text-align:right}.centro{text-align:center}
.nowrap{white-space:nowrap}
.rolagem{overflow-x:auto}
.escondido{display:none !important}
.fs-07{font-size:.78rem}.fs-08{font-size:.84rem}
.b{font-weight:700}.m{font-weight:500}
.cinza{color:var(--tinta2)}
.cortar{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--linha)}
  .conteudo{padding:1rem .9rem 4rem}
  .pin-card{grid-template-columns:96px 1fr}
  .pin-thumb{width:96px;height:144px}
  .biblia-nav{columns:1}
}
@media print{.topo,.lateral,.topo-acoes{display:none}.conteudo{max-width:100%}}

</style>
</head>
<body>
<div class="app">

  <header class="topo">
    <div class="marca">
      <span class="bolinha">📌</span>
      <span>PinMind <small class="mini" style="font-weight:500">· produção Pinterest com IA</small></span>
    </div>
    <div class="topo-acoes">
      <select id="seletorProjeto" class="btn" title="Projetos salvos" style="max-width:220px"></select>
      <button class="btn mini" id="btnNovo">+ Novo</button>
      <button class="btn mini" id="btnExportar">⬇ Exportar</button>
      <button class="btn mini" id="btnConfig">⚙ Integrações</button>
    </div>
  </header>

  <nav class="lateral" id="lateral"></nav>

  <main class="conteudo" id="conteudo"></main>

</div>

<script>
/* ===== dados/dados.js ===== */
/* =========================================================================
   BLOGMASTER — PINMIND
   Base de conhecimento do app: nichos, ofertas, benchmarks e estilos visuais.
   Todos os números vêm de benchmarks públicos 2025-2026 citados na BÍBLIA/11.
   ========================================================================= */

const BM = {
  // Benchmarks de design (GenSumo Research 2026, 148k pins analisados)
  design: {
    proporcao:   '2:3 vertical — 1000 x 1500 px',
    video:       '9:16 — 1080 x 1920 px',
    impressoes:  '+45% impressões vs quadrado · +22% cliques',
    texto:       '5 a 8 palavras, fonte sans-serif bold, alto contraste → +110% cliques',
    titulo:      '40 a 60 caracteres com keyword → +67% impressões',
    fundo:       'tons quentes/claros → +38% saves vs fundo escuro',
    Bordas:      'evite bordas grossas (-9% impressões)',
    sujeito:     'pessoa em contexto lifestyle → +14% impressões, +18% saves',
    frequencia:  '3 a 5 pins/dia por 90 dias → +22% impressões por pin',
    hashtags:    'hashtags caíram para ~1% do peso de ranking; priorize keyword longa',
    sazonal:     'publique sazonal 30 a 60 dias antes do pico',
    videostats:  'vídeo = +185% impressões, mas estático = 3x mais cliques de saída',
    carrossel:   'carrossel: +112 impressões, +7,1 saves/1k, +4,1 cliques/1k',
    freshPin:    'pin novo (imagem inédita) é o maior alavancador de alcance em 2026',
    prazos:      'pin forte segue surfando por 3 a 6 meses (alguns por anos)'
  },
  funil: { // taxas de referência para planejamento (conservador)
    impressaoParaClique: 0.004,   // 0,4% CTR médio (0,34%-0,62% em anúncios)
    cliqueParaConversao: 0.01,    // 1% (depende da oferta)
    saveParaClique: 0.15
  }
};

/* ---------------------------------------------------------------------------
   NICHOS — demanda, ticket médio, tipo de oferta e amarração com IA
   score = demanda(0-10) + monetização(0-10) + facilidade de fazer com IA(0-10)
   ------------------------------------------------------------------------- */
const NICHOS = [
  { id:'decor', pt:'Decoração & Organização de Casa', en:'Home Decor & Organization',
    sub:['cantinho de leitura','quarto pequeno','cozinha organizada','banheiro spa','home office',
         'decoração de aluguel','organização de despensa','quarto de bebê','sala minimalista'],
    demanda:10, monet:9, ia:9, ticketMedio:'R$ 60 a R$ 400',
    ofertas:['infoproduto decor','físico Amazon/ML (organizadores, luminárias, quadros)','printables (planners de casa)','SaaS de design'],
    obs:'Maior longevidade do Pinterest: pin de decoração entrega tráfego 2-3 anos depois. Ideal para físico + printables.' },

  { id:'receitas', pt:'Receitas & Comida', en:'Recipes & Food',
    sub:['jantar rápido 15 min','low carb','marmita fit','doces sem forno','airfryer','café da manhã proteico','receitas veganas','pão caseiro'],
    demanda:10, monet:7, ia:7, ticketMedio:'R$ 30 a R$ 200',
    ofertas:['e-book de receitas próprio','infoproduto nutrição','físico (utensílios, airfryer)','AdSense/tráfego'],
    obs:'Maior categoria por saves. Foto top-down do prato pronto com quantidade no overlay. Video pin de receita estoura fácil.' },

  { id:'fitness', pt:'Fitness & Emagrecimento', en:'Fitness & Weight Loss',
    sub:['treino em casa sem equipamento','pilates para iniciantes','abdômen lower','alongamento para quem trabalha sentado','treino 10 min','pós-parto'],
    demanda:9, monet:10, ia:8, ticketMedio:'R$ 97 a R$ 600',
    ofertas:['infoproduto fitness (Hotmart/Kiwify)','assinatura de treinos','suplementos (físico)','SaaS de dieta'],
    obs:'Picos em janeiro e maio. Formato campeão: grade numerada de exercícios, não vídeo único. Alto ticket de infoproduto.' },

  { id:'financas', pt:'Finanças & Renda Extra', en:'Personal Finance & Side Hustles',
    sub:['sair das dívidas','planilha de orçamento','renda extra em casa','como investir 100 reais','MEI para iniciantes','controle de gastos do casal'],
    demanda:9, monet:10, ia:10, ticketMedio:'R$ 47 a R$ 1.200',
    ofertas:['infoproduto finanças','planilhas próprias','SaaS/ferramenta (afiliado recorrente)','serviços'],
    obs:'Melhor nicho para produto digital próprio + afiliado SaaS recorrente. Infográfico e checklist dominam os saves.' },

  { id:'produtividade', pt:'Produtividade & Estudos', en:'Productivity & Studying',
    sub:['método pomodoro','notion para estudantes','como estudar para concurso','rotina matinal de 30 min','foco com TDAH','mapas mentais'],
    demanda:8, monet:8, ia:10, ticketMedio:'R$ 27 a R$ 400',
    ofertas:['templates Notion/planilhas','infoproduto estudo','SaaS de produtividade (recorrente)','printables'],
    obs:'Pico em janeiro e setembro. Público compra sistema, não motivação. Ótimo para digital próprio de margem 100%.' },

  { id:'beleza', pt:'Beleza & Autocuidado', en:'Beauty & Self-Care',
    sub:['skincare para pele oleosa','cronograma capilar','maquiagem natural','unhas em casa','rotina de skincare noturna','perfume barato que parece caro'],
    demanda:9, monet:9, ia:8, ticketMedio:'R$ 50 a R$ 300',
    ofertas:['físico (Amazon/Shopee/ML)','infoproduto beleza','marca própria','SaaS de beleza'],
    obs:'Visual clean, tons claros, produto em contexto. Funciona excepcionalmente bem para pin de "lista" e "antes/depois".' },

  { id:'moda', pt:'Moda & Looks', en:'Fashion & Outfits',
    sub:['look trabalho feminino','moda verão barata','capsule wardrobe','look casual chic','moda plus size','look festa'],
    demanda:9, monet:8, ia:7, ticketMedio:'R$ 80 a R$ 500',
    ofertas:['físico (Shopee/ML/Magalu)','infoproduto de moda','marca própria/print-on-demand','SaaS'],
    obs:'Lookbook de 4-6 looks no mesmo pin salva muito. Carrossel com 5-7 slides do mesmo look base performando em 2026.' },

  function exportarJSON(p) { download(p.nome.replace(/\s+/g, '-').toLowerCase() + '.json', JSON.stringify(p, null, 2), 'application/json'); }

  function exportarMarkdown(p) {
    const L = [];
    L.push('# Pack de Produção Pinterest — ' + p.nome);
    L.push('_Gerado em ' + new Date().toLocaleString('pt-BR') + '_');
    L.push('');
    L.push('## Resumo');
    L.push('- **Nicho:** ' + (p.nicho.nome || '—') + (p.nicho.sub ? ' / ' + p.nicho.sub : ''));
    L.push('- **Palavra-chave principal:** ' + (p.keyword || '—'));
    L.push('- **Oferta:** ' + (p.oferta.nome || '—') + ' (' + (p.oferta.plataforma || '—') + ')');
    L.push('- **Comissão:** ' + (p.oferta.comissaoPct || '—') + '% de ' + (p.oferta.preco || '—'));
    L.push('- **Estilo visual:** ' + (p.estilo.nome || '—'));
    L.push('- **Link de destino (colar manualmente):** ' + (p.oferta.linkAfiliado || '[COLAR LINK AQUI]'));
    L.push('');
    L.push('## Ângulos aprovados');
    p.angulos.filter(a => a.escolhido).forEach((a, i) => L.push((i + 1) + '. **' + a.formato + '** — ' + a.titulo + ' _(gatilho: ' + a.gatilho + ' · estilo: ' + a.estiloNome + ')_'));
    L.push('');
    L.push('## Pins prontos (' + p.pins.length + ')');
    p.pins.forEach((pin, i) => {
      L.push('### Pin ' + (i + 1) + ' — ' + pin.formato);
      L.push('- **Título:** ' + pin.titulo);
      L.push('- **Descrição:** ' + pin.descricao);
      L.push('- **Alt text:** ' + pin.alt);
      L.push('- **Overlay:** ' + pin.overlay);
      L.push('- **Prompt da imagem:** `' + pin.promptImagem + '`');
      L.push('- **Arquivo:** ' + pin.arquivo);
      L.push('- **Board:** ' + pin.board);
      L.push('- **Hashtags:** ' + pin.hashtags);
      L.push('- **Destino:** ' + (p.oferta.destino || p.oferta.linkAfiliado || '[COLAR LINK AQUI]'));
      L.push('');
    });
    L.push('## Checklist de publicação');
    L.push('- [ ] Imagem gerada em 1000×1500 px');
    L.push('- [ ] Overlay aplicado no Canva (5-8 palavras)');
    L.push('- [ ] Arquivo renomeado com a keyword');
    L.push('- [ ] Título 40-60 caracteres com a keyword');
    L.push('- [ ] Aviso de afiliado na descrição');
    L.push('- [ ] Link completo (sem encurtador) colado manualmente');
    L.push('- [ ] Board correto e relevante');
    L.push('');
    L.push('## Aviso');
    L.push('Contém link de afiliado. Se você comprar por ele, posso receber comissão sem custo extra para você. Este material não promete resultado financeiro.');
    return L.join('\n');
  }

  function exportarCSV(p) {
    const cab = ['#', 'titulo', 'descricao', 'overlay', 'arquivo', 'board', 'hashtags', 'estilo', 'formato', 'prompt_imagem', 'destino', 'status'];
    const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const linhas = p.pins.map((pin, i) => [
      i + 1, pin.titulo, pin.descricao, pin.overlay, pin.arquivo, pin.board, pin.hashtags,
      pin.estiloNome, pin.formato, pin.promptImagem, (p.oferta.linkAfiliado || '[COLAR LINK AQUI]'), pin.status
    ].map(esc).join(','));
    return [cab.map(esc).join(','), ...linhas].join('\n');
  }

  /* ---------------- integrações OPCIONAIS ---------------- */
  function config() { try { return JSON.parse(armazenamento.get(CONFIGKEY) || '{}'); } catch (e) { return {}; } }
  function salvarConfig(c) { armazenamento.set(CONFIGKEY, JSON.stringify(c)); }

  // Geração real de texto via endpoint compatível com OpenAI (opcional).
  async function chamarIA(prompt, cfg) {
    cfg = cfg || config();
    if (!cfg.chaveIA) throw new Error('Nenhuma chave de IA configurada. Use o modo offline (copiar e colar no ChatGPT).');
    const base = (cfg.baseIA || 'https://api.openai.com/v1').replace(/\/$/, '');
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.chaveIA },
      body: JSON.stringify({
        model: cfg.modeloIA || 'gpt-4o-mini',
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.8
      })
    });
    if (!resp.ok) throw new Error('Falha na API: ' + resp.status + ' ' + (await resp.text()).slice(0, 200));
    const j = await resp.json();
    return (j.choices && j.choices[0] && j.choices[0].message.content) || '';
  }

  // Criação de pin via Pinterest API v5 (opcional; só funciona com Standard access).
  async function publicarPinterest({ token, boardId, titulo, descricao, link, imagemUrl, alt }) {
    const r = await fetch('https://api.pinterest.com/v5/pins', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        board_id: boardId,
        title: titulo,
        description: descricao,
        alt_text: alt,
        link,
        media_source: { source_type: 'image_url', url: imagemUrl }
      })
    });
    if (!r.ok) throw new Error('Pinterest API: ' + r.status + ' ' + (await r.text()).slice(0, 300));
    return r.json();
  }

  return {
    armazenamentoDisponivel: () => armazenamento.disponivel,

    calcularScore, calcularScoreProjeto, estimativa,
    gerarAngulos, gerarPackPins,
    exportarJSON, exportarMarkdown, exportarCSV, download,
    config, salvarConfig, chamarIA, publicarPinterest
  };

window.PM_BIBLIA = {"geradoEm":"2026-10-03T20:50:09.484Z","capitulos":[{"arquivo":"00-INDICE.md","titulo":"A BÍBLIA — Como Ganhar Dinheiro no Pinterest Usando IA de Graça","html":"<h1>📕 A BÍBLIA — Como Ganhar Dinheiro no Pinterest Usando IA de Graça</h1>\n<p><strong>Versão 1.0 · 2026 · método completo, validado por benchmarks públicos 2025-2026</strong></p>\n<hr>\n<h2>O que é isto</h2>\n<p>Uma bíblia operacional. Não é motivação, não é \"mentalidade\". É o processo inteiro, do zero até a primeira comissão e depois até a escala, usando <strong>apenas ferramentas gratuitas</strong> de inteligência artificial.</p>\n<p>Ela existe em duas formas complementares:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Forma</th><th>O que é</th><th>Para quem</th></tr></thead><tbody><tr><td><strong>A Bíblia</strong> (você está aqui)</td><td>O método completo: por quê, o quê, quanto, quando, com quais números e com quais regras</td><td>Entender o jogo e tomar decisões</td></tr><tr><td><strong>O App de Produção</strong> (<code>app/index.html</code>)</td><td>Execução guiada em 11 etapas: valida o nicho e o produto com score, gera todos os prompts, valida o visual, monta o pack de 15-25 pins</td><td>Fazer, hoje, sem travar</td></tr></tbody></table></div>\n<hr>\n<h2>Como usar (leia nesta ordem)</h2>\n<p><strong>Se você tem 2 horas hoje:</strong></p>\n<ol>\n<li>Capítulo 01 (O Método) — 15 min</li>\n<li>Capítulo 03 (Nichos) — 25 min</li>\n<li>Capítulo 04 (Validação de Produtos) — 30 min</li>\n<li>Abra o app, etapa 1 → 2 → 3 — 50 min</li>\n</ol>\n<p><strong>Se você tem 10 minutos:</strong></p>\n<p>Vá direto ao <strong>Capítulo 10 (Plano 30-60-90)</strong> e siga o dia 1.</p>\n<p><strong>Se algo der errado:</strong></p>\n<p>Capítulo 11 (Diagnóstico) diz exatamente onde está o vazamento.</p>\n<hr>\n<h2>Os 16 capítulos</h2>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Capítulo</th><th>O que resolve</th><th>Tempo</th></tr></thead><tbody><tr><td>00</td><td><strong>Índice</strong> (aqui)</td><td>Mapa geral</td><td>5 min</td></tr><tr><td>01</td><td><a href=\"01-o-metodo.md\">O Método</a></td><td>Por que Pinterest + IA ainda funciona em 2026 e qual é a economia real do pin</td><td>15 min</td></tr><tr><td>02</td><td><a href=\"02-fundamentos-pinterest.md\">Fundamentos do Pinterest</a></td><td>Algoritmo, busca, formatos, tamanhos, \"fresh pin\", conta business</td><td>30 min</td></tr><tr><td>03</td><td><a href=\"03-nichos-e-pesquisa.md\">Nichos e Pesquisa</a></td><td>Como escolher nicho com dinheiro dentro + 16 nichos mapeados + sazonalidade</td><td>40 min</td></tr><tr><td>04</td><td><a href=\"04-validacao-de-produtos.md\">Validação de Produtos</a></td><td>Os 12 critérios, as 16 categorias de oferta, a matemática da comissão</td><td>40 min</td></tr><tr><td>05</td><td><a href=\"05-visual-que-converte.md\">O Visual que Converte</a></td><td>Os 12 estilos que dominam o feed + os números de cada escolha de design</td><td>35 min</td></tr><tr><td>06</td><td><a href=\"06-biblioteca-de-prompts.md\">Biblioteca de Prompts</a></td><td>Os 15 prompts completos, explicados e na ordem de uso</td><td>30 min</td></tr><tr><td>07</td><td><a href=\"07-ferramentas-gratis.md\">Ferramentas Grátis e Integrações</a></td><td>O stack inteiro sem pagar nada + APIs (Pinterest v5) e seus limites</td><td>25 min</td></tr><tr><td>08</td><td><a href=\"08-compliance-e-risco.md\">Compliance e Risco</a></td><td>O que derruba conta, o que é exigido por lei, como se recuperar de um aviso</td><td>30 min</td></tr><tr><td>09</td><td><a href=\"09-monetizacao-7-vias.md\">As 7 Vias de Monetização</a></td><td>Afiliados, produto próprio, PLR, POD, blog, serviço e lead-gen — com números</td><td>40 min</td></tr><tr><td>10</td><td><a href=\"10-plano-30-60-90.md\">Plano 30-60-90</a></td><td>Cronograma dia a dia, metas por fase, o que fazer quando empacar</td><td>20 min</td></tr><tr><td>11</td><td><a href=\"11-metricas.md\">Métricas e Diagnóstico</a></td><td>Os 8 KPIs, os benchmarks, e a árvore de decisão (escalar / pivotar / matar)</td><td>25 min</td></tr><tr><td>12</td><td><a href=\"12-escala-e-automacao.md\">Escala, Lotes e Automação</a></td><td>Produzir 100 pins em 1 hora, reciclar, multiplicar por idioma</td><td>30 min</td></tr><tr><td>13</td><td><a href=\"13-erros-e-contraexemplos.md\">Erros e Contra-Exemplos</a></td><td>Os 24 erros que matam projetos + os 9 mitos</td><td>25 min</td></tr><tr><td>14</td><td><a href=\"14-perguntas-frequentes.md\">Perguntas Frequentes</a></td><td>40 dúvidas respondidas direto</td><td>20 min</td></tr><tr><td>15</td><td><a href=\"15-fontes.md\">Fontes e Links</a></td><td>De onde vieram os números + onde conferir as regras atualizadas</td><td>10 min</td></tr></tbody></table></div>\n<hr>\n<h2>Os 5 pilares do método (resumo executivo)</h2>\n<blockquote><strong>1. Pinterest é buscador, não rede social.</strong><br>97% das buscas no Pinterest são por termos não-marcados. Número de seguidores não influencia distribuição. Quem ganha é quem acerta <strong>palavra-chave</strong>, não quem tem público.</blockquote>\n<blockquote><strong>2. Pin fresco é o motor.</strong><br>O maior alavancador de alcance em 2026 é publicar <strong>imagem inédita</strong> — mesmo que ela leve para uma página antiga. Repinar pin velho quase não faz nada. 3 a 5 pins novos por dia, por 90 dias, aumentam as impressões por pin em ~22%.</blockquote>\n<blockquote><strong>3. IA grátis produz o suficiente.</strong><br>Título, descrição, alt text, prompt de imagem, roteiro de vídeo, página de destino: tudo isso sai de ferramentas gratuitas. A IA não substitui a estratégia — ela remove o gargalo de produção.</blockquote>\n<blockquote><strong>4. O dinheiro está na oferta, não no pin.</strong><br>Pin bonito com oferta ruim dá zero. Oferta excelente com pin medíocre dá dinheiro. Por isso a validação de produto (capítulo 04) tem 12 critérios e 3 bloqueios de peso máximo.</blockquote>\n<blockquote><strong>5. Estático vende, vídeo alcança.</strong><br>Vídeo rende +185% de impressões, mas o estático gera <strong>3x mais cliques de saída</strong> (4,8 contra 1,6 por 1.000 impressões). A receita mora no estático. O vídeo é o que traz gente nova.</blockquote>\n<hr>\n<h2>Os 3 números que você precisa decorar</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Número</th><th>Significado</th></tr></thead><tbody><tr><td><strong>2:3 (1000×1500 px)</strong></td><td>A proporção que rende +45% impressões e +22% cliques. Quadrado perde de 30% a 45% de distribuição.</td></tr><tr><td><strong>5 a 8 palavras</strong></td><td>O tamanho do texto do overlay. Pin com texto bem feito soma +110% de cliques contra pin sem texto.</td></tr><tr><td><strong>40 a 60 caracteres</strong></td><td>O tamanho do título com palavra-chave. Rende +67% de impressões contra pin sem título.</td></tr></tbody></table></div>\n<hr>\n<h2>Aviso honesto</h2>\n<p>Nada aqui é promessa de renda. Os números usados como referência vêm de benchmarks públicos de mercado de 2025-2026, todos citados no capítulo 15. Pinterest, programas de afiliados e ferramentas mudam de regra com frequência — <strong>revalide sempre</strong> nos links oficiais antes de escalar.</p>\n<p>O que este material garante é o <strong>processo</strong>: validar antes de produzir, produzir em volume, medir e cortar o que não funciona. É o mesmo processo que separa quem faz R$ 200/mês de quem faz R$ 20.000/mês — a diferença é volume e iteração, não sorte.</p>"},{"arquivo":"01-o-metodo.md","titulo":"O Método — por que Pinterest + IA ainda funciona em 2026","html":"<h1>01 · O Método — por que Pinterest + IA ainda funciona em 2026</h1>\n<hr>\n<h2>1.1 A tese central</h2>\n<p>Existe uma assimetria que quase ninguém explora:</p>\n<ul>\n<li><strong>O Pinterest é um buscador com intenção de compra</strong> — 85% dos usuários planejam compras, e o Pinterest é a plataforma onde a pessoa <strong>já está procurando</strong> o que comprar ou fazer (não está sendo interrompida).</li>\n<li><strong>A produção de conteúdo nele é visual e repetitiva</strong> — exatamente o tipo de tarefa em que a IA é absurdamente boa.</li>\n<li><strong>O conteúdo tem vida longa</strong> — um pin forte continua surfando por 3 a 6 meses, às vezes anos. Nas redes sociais tradicionais, a vida útil é medida em horas.</li>\n</ul>\n<p>Resultado: você produz uma vez, com IA gratuita, e o ativo continua trabalhando. É a única rede onde o esforço de criação tem retorno composto.</p>\n<hr>\n<h2>1.2 A economia real do pin</h2>\n<p>Vamos fazer a conta honesta, com números conservadores:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Etapa</th><th>Taxa de referência</th><th>De 10.000 impressões sobram</th></tr></thead><tbody><tr><td>Impressões</td><td>—</td><td>10.000</td></tr><tr><td>Cliques de saída (CTR 0,4%)</td><td>0,34% a 1% em dados de mercado</td><td>40 cliques</td></tr><tr><td>Sessões na página</td><td>~90% dos cliques carregam</td><td>36 sessões</td></tr><tr><td>Vendas (conversão 1%)</td><td>0,5% a 2%</td><td>0,4 venda</td></tr><tr><td><strong>Comissão com ticket de R$ 97 e 50%</strong></td><td>R$ 48,50 por venda</td><td><strong>~R$ 19 por 10 mil impressões</strong></td></tr></tbody></table></div>\n<p>Agora o lado do custo:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Item</th><th>Custo</th></tr></thead><tbody><tr><td>Ferramentas (IA de imagem, texto, design, agendamento grátis)</td><td><strong>R$ 0</strong></td></tr><tr><td>Tempo para produzir 20 pins</td><td>2 a 3 horas</td></tr><tr><td>Domínio + hospedagem do blog (opcional)</td><td>~R$ 40/ano</td></tr><tr><td><strong>Custo marginal de cada pin adicional</strong></td><td><strong>~R$ 0</strong></td></tr></tbody></table></div>\n<p>O que isso significa na prática: <strong>o jogo é de volume e iteração, não de perfeição</strong>. Se um pin rende R$ 1,90 por mil impressões, você precisa de muitos pins trabalhando em paralelo — e é justamente aí que a IA muda a matemática.</p>\n<blockquote>⚠️ <strong>Duas ressalvas honestas.</strong> Primeira: a curva de distribuição do Pinterest é selvagem — o <strong>top 1% dos pins gera mais de 50% de todas as impressões</strong>. A maioria dos seus pins vai morrer. Você não está procurando acertar; está procurando <strong>produzir tentativas suficientes para acertar</strong>. Segunda: os números acima são referência para comparar ofertas e decidir, não para prometer resultado a ninguém.</blockquote>\n<hr>\n<h2>1.3 Por que a IA é a peça que faltava</h2>\n<p>O gargalo histórico do Pinterest sempre foi <strong>produção</strong>. Antes, fazer 10 pins por dia significava:</p>\n<ul>\n<li>1 hora escrevendo títulos e descrições;</li>\n<li>1 hora procurando imagem;</li>\n<li>20 minutos nomeando arquivo, alt text e hashtags;</li>\n<li>repetir no dia seguinte, sem criatividade e com erros de consistência.</li>\n</ul>\n<p>Com IA grátis, esse mesmo trabalho vira:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Tarefa</th><th>Antes</th><th>Com IA grátis</th><th>Ferramenta</th></tr></thead><tbody><tr><td>10 títulos otimizados</td><td>40 min</td><td>40 segundos</td><td>ChatGPT / Gemini</td></tr><tr><td>10 descrições + alt text</td><td>30 min</td><td>40 segundos</td><td>mesmo prompt</td></tr><tr><td>10 imagens verticais 2:3</td><td>1h+ (banco/imagem)</td><td>10 minutos</td><td>Bing Image Creator, Leonardo, Ideogram</td></tr><tr><td>10 layouts com overlay</td><td>40 min</td><td>15 min (template mestre)</td><td>Canva</td></tr><tr><td>1 página de destino</td><td>2 horas</td><td>10 min + revisão</td><td>ChatGPT</td></tr><tr><td>Roteiro de vídeo 15s</td><td>1 hora</td><td>1 minuto</td><td>ChatGPT</td></tr></tbody></table></div>\n<p><strong>O que a IA não faz por você</strong> (e por isso continua valendo dinheiro):</p>\n<ol>\n<li>Escolher a oferta que paga (capítulo 04);</li>\n<li>Julgar se o visual está bom de verdade (capítulo 05);</li>\n<li>Ler os números e decidir o que cortar (capítulo 11);</li>\n<li>Colocar o link e responder pelo que foi publicado (compliance, capítulo 08).</li>\n</ol>\n<hr>\n<h2>1.4 Os 5 pilares (o método em uma página)</h2>\n<h3>Pilar 1 — Pinterest é buscador</h3>\n<p>97% das buscas são não-marcadas; seguidores não decidem distribuição. Você otimiza para <strong>palavra-chave long-tail</strong> em quatro lugares: título, descrição, board e <strong>nome do arquivo da imagem</strong>.</p>\n<p>→ Capítulo 02.</p>\n<h3>Pilar 2 — Pin fresco</h3>\n<p>O Pinterest premia imagem inédita para o mesmo link. Um link pode (e deve) receber 5 designs diferentes. \"Fresh\" não é trocar a cor do texto: é um design genuinamente novo.</p>\n<p>→ Capítulo 02 e 12.</p>\n<h3>Pilar 3 — IA grátis no volante, você no julgamento</h3>\n<p>A IA gera 90% do volume; você aprova, corta e ajusta. Nunca publique sem revisar: texto de IA sem edição é identificável e o público do Pinterest está cada vez mais sensível a conteúdo genérico de máquina.</p>\n<p>→ Capítulos 06 e 07.</p>\n<h3>Pilar 4 — O dinheiro está na oferta, não no pin</h3>\n<p>A sequência correta é <strong>oferta → ângulo → visual → texto</strong>. Quem faz ao contrário (pin bonito primeiro, depois procura o que vender) desperdiça 80% do trabalho.</p>\n<p>→ Capítulo 04 e 09.</p>\n<h3>Pilar 5 — Estático vende, vídeo alcança</h3>\n<div class=\"rolagem\"><table><thead><tr><th>Formato</th><th>Impressões</th><th>Cliques de saída /1k</th><th>Save /1k</th><th>Papel</th></tr></thead><tbody><tr><td>Estático</td><td>base</td><td><strong>4,8</strong></td><td>5,2</td><td>Converter e vender</td></tr><tr><td>Vídeo</td><td><strong>+185%</strong></td><td>1,6</td><td><strong>13,5</strong></td><td>Alcance e novos olhos</td></tr><tr><td>Carrossel</td><td>+12%</td><td>4,1</td><td>7,1</td><td>História e tutorial</td></tr></tbody></table></div>\n<p>A conta que importa: <strong>60-70% estático + 20-30% vídeo + 10% carrossel</strong>.</p>\n<p>→ Capítulos 02 e 06.</p>\n<hr>\n<h2>1.5 O processo, em 11 etapas</h2>\n<p>Este é o fluxo que o app executa com você:</p>\n<pre class=\"prompt curto\">[0] FUNDAÇÃO        Conta business, bio com keyword, 5 boards, claim do site\n      ↓\n[1] NICHO           Escolher nicho por dinheiro × facilidade de IA (não por paixão)\n      ↓\n[2] OFERTA          Validar produto com 12 critérios (3 bloqueios de peso máximo)\n      ↓\n[3] ÂNGULOS         1 palavra-chave long-tail → 10 ângulos → marcar 3 a 5\n      ↓\n[4] VISUAL          Escolher 1-2 estilos fixos e gerar as imagens em 2:3\n      ↓\n[5] TEXTO           Título (40-60 car.) + descrição + alt + 5 hashtags + nome do arquivo\n      ↓\n[6] FORMATOS        Video pin 6-15s + carrossel de 5 slides para variar\n      ↓\n[7] DESTINO         Página com aviso de afiliado → link colado MANUALMENTE\n      ↓\n[8] VALIDAÇÃO       4 checklists com nota (produto, visual, SEO, compliance)\n      ↓\n[9] PACK            15 a 25 pins prontos, exportados em Markdown/CSV\n      ↓\n[10] PUBLICAR       3-5 pins/dia por 90 dias + medir + cortar o que não performa</pre>\n<p>Cada etapa tem um <strong>portão de saída</strong>. Não avance sem fechar o portão — é o que evita produzir 50 pins para uma oferta que nunca ia vender.</p>\n<hr>\n<h2>1.6 Quanto tempo até o primeiro resultado</h2>\n<p>Cronograma realista, com 1 hora por dia:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Período</th><th>O que acontece</th><th>O que você faz</th></tr></thead><tbody><tr><td><strong>Dias 1-7</strong></td><td>Conta montada, nicho validado, oferta definida, primeiros 10 pins no ar. <strong>Nada de cliques relevantes ainda.</strong></td><td>Não desanime. Pinterest tem atraso de indexação.</td></tr><tr><td><strong>Dias 8-30</strong></td><td>Impressões começam a subir, primeiros saves e cliques. Talvez a 1ª venda.</td><td>Produza 3-5 pins/dia sem exceção. Meça semanalmente.</td></tr><tr><td><strong>Mês 2</strong></td><td>200-400 pins publicados. Você já sabe quais 3 ângulos e 2 estilos funcionam.</td><td>Corte o que não funciona. Dobre no que funciona.</td></tr><tr><td><strong>Mês 3</strong></td><td>Pins do mês 1 ainda rendendo — aqui começa o efeito composto. Receita previsível.</td><td>Escale volume, teste 2ª oferta, comece produto digital próprio.</td></tr><tr><td><strong>Mês 6</strong></td><td>O acervo (centenas de pins) trabalha sozinho. Receita depende do tamanho do acervo, não do dia.</td><td>Recicle vencedores, expanda idioma, sistematize.</td></tr></tbody></table></div>\n<blockquote><strong>A verdade desconfortável:</strong> a maioria das pessoas desiste entre o dia 10 e o dia 25, exatamente quando nada aconteceu ainda e o trabalho já pesa. O cronograma acima é o que acontece com quem passa desse ponto.</blockquote>\n<hr>\n<h2>1.7 O que este método NÃO é</h2>\n<ul>\n<li><strong>Não é</strong> publicar 50 pins por dia com o mesmo template. Isso é spam e o Pinterest derruba.</li>\n<li><strong>Não é</strong> usar bot de automação de mass pinning. As diretrizes do Pinterest proíbem apps que executam ações sem a consideração individual de cada uma.</li>\n<li><strong>Não é</strong> usar encurtador de link. Encurtadores são bloqueados/marcados.</li>\n<li><strong>Não é</strong> copiar pin de concorrente. Use referência de estrutura, nunca cópia de criativo.</li>\n<li><strong>Não é</strong> prometer emagrecimento, enriquecimento ou cura. É infração e destrói a conta.</li>\n<li><strong>Não é</strong> depender de uma única conta, uma única oferta ou uma única conta de afiliado. Diversifique sempre.</li>\n</ul>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"02-fundamentos-pinterest.md\">02 · Fundamentos do Pinterest</a></p>"},{"arquivo":"02-fundamentos-pinterest.md","titulo":"Fundamentos do Pinterest — como a máquina funciona","html":"<h1>02 · Fundamentos do Pinterest — como a máquina funciona</h1>\n<hr>\n<h2>2.1 O que o algoritmo premia (em 2026)</h2>\n<p>O Pinterest distribui conteúdo por <strong>relevância de busca + sinais de engajamento</strong>. Em ordem de peso prático:</p>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Sinal</th><th>Peso</th><th>Como você entrega</th></tr></thead><tbody><tr><td>1</td><td><strong>Palavra-chave no título, descrição, board e nome do arquivo</strong></td><td>Altíssimo</td><td>Keyword long-tail em 4 lugares</td></tr><tr><td>2</td><td><strong>Imagem fresca (pin novo que o Pinterest nunca viu)</strong></td><td>Altíssimo</td><td>Design novo por pin, não repin</td></tr><tr><td>3</td><td><strong>Cliques de saída e saves</strong></td><td>Alto</td><td>Promessa clara + destino alinhado</td></tr><tr><td>4</td><td><strong>Qualidade e proporção da imagem (2:3)</strong></td><td>Alto</td><td>1000×1500 px vertical</td></tr><tr><td>5</td><td><strong>Relevância do board de destino</strong></td><td>Médio</td><td>Board temático com descrição otimizada</td></tr><tr><td>6</td><td><strong>Consistência de publicação</strong></td><td>Médio</td><td>3-5 pins/dia por 90 dias</td></tr><tr><td>7</td><td><strong>Hashtags</strong></td><td>~1%</td><td>Use no máximo 5, sem depender delas</td></tr></tbody></table></div>\n<p><strong>O que quase não importa:</strong> número de seguidores (97% das buscas são não-marcadas), curtidas e repins.</p>\n<blockquote>💡 <strong>Consequência prática:</strong> você não precisa de audiência para começar. Precisa de <strong>clareza de palavra-chave</strong> e <strong>volume de designs novos</strong>.</blockquote>\n<hr>\n<h2>2.2 A anatomia de um pin otimizado</h2>\n<pre class=\"prompt curto\">┌─────────────────────────────┐\n│                             │  ← Margem de segurança 8-10%\n│    TEXTO DO OVERLAY         │     (o feed pode cortar)\n│    5 a 8 palavras, BOLD     │\n│    alto contraste           │\n│                             │\n│                             │\n│      [ IMAGEM / FOCO ]      │  ← 1 único ponto focal\n│      pessoa, produto ou     │\n│      resultado em contexto  │\n│                             │\n│                             │  ← Fundo claro/quente (+38% saves)\n│   [logo/URL discreto]       │\n└─────────────────────────────┘\n       1000 × 1500 px (2:3)</pre>\n<p><strong>Os 6 campos que o Pinterest indexa em cada pin:</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Campo</th><th>Limite</th><th>Regra</th></tr></thead><tbody><tr><td>Título</td><td>100 caracteres (use 40-60)</td><td>Palavra-chave no início, sem CAIXA ALTA</td></tr><tr><td>Descrição</td><td>500 caracteres (use 2-4 linhas)</td><td>Keyword + 1 sinônimo, escrita natural, com aviso de afiliado</td></tr><tr><td>Alt text</td><td>~500 caracteres (use 200)</td><td>Descreva a imagem literalmente</td></tr><tr><td>Nome do arquivo</td><td>—</td><td><code>organizacao-cozinha-pequena-1.png</code>, nunca <code>IMG_2931.png</code></td></tr><tr><td>Board de destino</td><td>—</td><td>Título e descrição com keyword</td></tr><tr><td>Link</td><td>—</td><td>URL completa, sem encurtador</td></tr></tbody></table></div>\n<hr>\n<h2>2.3 Formatos: qual usar para cada objetivo</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Formato</th><th>Medida</th><th>Duração</th><th>Força</th><th>Fraqueza</th><th>Use quando</th></tr></thead><tbody><tr><td><strong>Pin estático</strong></td><td>1000×1500 (2:3)</td><td>—</td><td>4,8 cliques/1k, o melhor para converter</td><td>Menos alcance</td><td>Objetivo é <strong>vender ou levar tráfego</strong></td></tr><tr><td><strong>Video pin</strong></td><td>1080×1920 (9:16)</td><td>4s a 15min (ótimo: <strong>6-15s</strong>)</td><td>+185% impressões, 13,5 saves/1k</td><td>1,6 cliques/1k</td><td>Objetivo é <strong>alcance e novos seguidores</strong></td></tr><tr><td><strong>Carrossel</strong></td><td>1000×1500</td><td>até 5 imagens</td><td>7,1 saves/1k com cliques próximos ao estático</td><td>Subutilizado por quase todo mundo</td><td><strong>Tutorial, comparação, faixa de produtos</strong></td></tr><tr><td><strong>Idea Pin</strong></td><td>1080×1920</td><td>até 20 páginas</td><td>Alto engajamento nativo</td><td>Não aceita link de afiliado</td><td>Conteúdo de marca e storytelling</td></tr><tr><td><strong>Pin de produto (catálogo)</strong></td><td>1000×1500</td><td>—</td><td>3,2x conversão</td><td>Exige catálogo conectado</td><td>Loja própria com feed</td></tr></tbody></table></div>\n<h3>Regras de produção por formato</h3>\n<p><strong>Estático (sua base: 60-70% do volume)</strong></p>\n<ul>\n<li>1000×1500 px, PNG (JPG se o arquivo ficar pesado — máx. 20MB, ideal até 5MB).</li>\n<li>Overlay de 5 a 8 palavras, bold, sans-serif, com contraste real.</li>\n<li>Um único foco visual. Fundo claro ou tom quente.</li>\n<li>Sem borda grossa (-9% de impressões).</li>\n</ul>\n<p><strong>Vídeo (20-30% do volume)</strong></p>\n<ul>\n<li>6 a 15 segundos é o ponto ótimo; gancho nos primeiros 3 segundos.</li>\n<li>Assuma que ninguém ouve: <strong>legenda e texto fixo na tela são obrigatórios</strong>.</li>\n<li>Capa (cover) com o overlay — é ela que aparece no feed.</li>\n<li>Sem marca d'água de outra plataforma (o Pinterest penaliza).</li>\n</ul>\n<p><strong>Carrossel (10% do volume)</strong></p>\n<ul>\n<li>5 slides, cada um com função: <strong>gancho → contexto → prova → objeção → CTA</strong>.</li>\n<li>Consistência de paleta, fonte e grid entre os slides.</li>\n<li>Útil para \"5 opções\", \"antes/depois\", \"passo a passo\".</li>\n</ul>\n<hr>\n<h2>2.4 \"Fresh pin\": o conceito que separa amador de profissional</h2>\n<p><strong>Pin fresco = imagem que o Pinterest nunca viu</strong>, mesmo que aponte para uma página que já existe.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Conta como pin fresco ✅</th><th>NÃO conta como fresco ❌</th></tr></thead><tbody><tr><td>Nova imagem de fundo</td><td>Mesma imagem com texto diferente</td></tr><tr><td>Nova composição/layout</td><td>Mesma arte com outra cor de moldura</td></tr><tr><td>Nova fotografia/ilustração</td><td>Repin de um pin existente</td></tr><tr><td>Novo estilo visual do mesmo tema</td><td>Recorte levemente diferente</td></tr></tbody></table></div>\n<p><strong>A regra prática:</strong> para cada página/oferta, crie <strong>3 a 5 designs genuinamente diferentes</strong>. Um único tema pode gerar 15+ pins ao longo de um trimestre.</p>\n<p><strong>Espaçamento:</strong> mantenha <strong>pelo menos 72 horas</strong> entre dois pins que apontam para a mesma URL. Publicar o mesmo link várias vezes no mesmo dia aciona o filtro de spam.</p>\n<hr>\n<h2>2.5 Boards: estrutura que ajuda o algoritmo</h2>\n<p><strong>Regras de board:</strong></p>\n<ol>\n<li><strong>5 a 10 boards no começo</strong> — mais que isso dilui. Cada board é um \"assunto\" que você declara ao Pinterest.</li>\n<li><strong>Título com palavra-chave primeiro</strong>: <code>Organização de Cozinha Pequena</code> (não <code>Minhas coisinhas fofas</code>).</li>\n<li><strong>Descrição com 2 linhas contendo keyword e sinônimos</strong> — o Pinterest indexa descrição de board.</li>\n<li><strong>Board secreto para descarte</strong>: crie um board privado \"Rascunhos\" para guardar referência sem poluir a conta.</li>\n<li><strong>Boards-armadilha a evitar</strong>: \"Favoritos\", \"Aleatório\", \"Coisas legais\", \"Inspiração\" — são vazios de sinal e confundem a categorização.</li>\n</ol>\n<p><strong>Estrutura sugerida para uma conta de nicho de decoração:</strong></p>\n<pre class=\"prompt curto\">✅ Organização de Cozinha Pequena\n✅ Organização de Despensa\n✅ Decoração de Apartamento Alugado\n✅ Home Office Pequeno\n✅ Cantinho de Leitura\n✅ Decoração Minimalista\n✅ Antes e Depois de Ambientes\n✅ Plantas para Interiores  ← adjacente, traz público cruzado\n❌ Favoritos  ❌ Inspiração  ❌ Aleatório</pre>\n<hr>\n<h2>2.6 Perfil e conta business</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Item</th><th>Como fazer</th><th>Por que importa</th></tr></thead><tbody><tr><td><strong>Converter em conta business</strong></td><td>Configurações → Gestão de conta → Converter</td><td>Grátis; libera analytics, agendador nativo e Rich Pins</td></tr><tr><td><strong>Nome</strong></td><td>Marca + palavra-chave (máx. 40 caracteres)</td><td>O nome é indexado</td></tr><tr><td><strong>Bio</strong></td><td>160 caracteres com keyword + promessa clara</td><td>Conversão de visitante em seguidor</td></tr><tr><td><strong>Site/claim</strong></td><td>Reivindicar o domínio (valida por HTML tag ou arquivo)</td><td>Confiança do algoritmo + analytics de tráfego</td></tr><tr><td><strong>Foto/capa</strong></td><td>Coerente com o nicho, não selfie aleatória</td><td>Primeira impressão de credibilidade</td></tr><tr><td><strong>Agendador nativo</strong></td><td>\"Criar pin\" → \"Publicar mais tarde\"</td><td>Até 10 pins na fila; 2 semanas (desktop) a 30 dias (app)</td></tr></tbody></table></div>\n<blockquote><strong>Não tem site ainda?</strong> Use uma página de destino gratuita (Notion público, Gumroad, Payhip, um subdomínio de blog grátis) e reivindique depois. O claim do site não é pré-requisito para começar — mas acelera.</blockquote>\n<hr>\n<h2>2.7 Sinais de spam que derrubam alcance</h2>\n<p>Evite <strong>todos</strong>:</p>\n<ul>\n<li>❌ Publicar o mesmo link repetidamente no mesmo dia</li>\n<li>❌ Usar o mesmo criativo em 10 boards diferentes no mesmo dia</li>\n<li>❌ Encurtadores (<code>bit.ly</code>, <code>tinyurl</code>, <code>cutt.ly</code>) — bloqueados/marcados</li>\n<li>❌ Descrição com enfileiramento de 30 hashtags</li>\n<li>❌ Link que não tem relação com a promessa do pin</li>\n<li>❌ Volume de 150+ links de afiliado por dia</li>\n<li>❌ Texto do overlay prometendo resultado impossível</li>\n<li>❌ Marca d'água de TikTok/Instagram no vídeo</li>\n</ul>\n<hr>\n<h2>2.8 Sazonalidade: o calendário que multiplica</h2>\n<p>Publique conteúdo sazonal <strong>30 a 60 dias antes do pico</strong> — o pin precisa de tempo para indexar e ranquear.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Período</th><th>Picos de busca</th><th>Publicar a partir de</th></tr></thead><tbody><tr><td>Jan</td><td>Fitness, finanças, produtividade, organização</td><td><strong>Novembro</strong></td></tr><tr><td>Fev-Mar</td><td>Volta às aulas, organização de estudo</td><td><strong>Dezembro</strong></td></tr><tr><td>Abr-Mai</td><td>Verão (hemisfério norte), corpo, moda leve</td><td><strong>Fevereiro</strong></td></tr><tr><td>Jun-Ago</td><td>Viagem, férias, receitas de festa junina</td><td><strong>Abril</strong></td></tr><tr><td>Set-Out</td><td>Volta ao trabalho, planejamento, outono</td><td><strong>Julho</strong></td></tr><tr><td>Nov-Dez</td><td>Natal, presentes, ceia, decoração natalina, <strong>noivado/casamento</strong></td><td><strong>Setembro</strong></td></tr></tbody></table></div>\n<blockquote>Categorias com pico de intenção como <strong>casamento</strong> (novembro a fevereiro) e <strong>decoração natalina</strong> têm pins que continuam salvando <strong>anos</strong> depois. São as mais recomendadas para começar em setembro/outubro.</blockquote>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"03-nichos-e-pesquisa.md\">03 · Nichos e Pesquisa</a></p>"},{"arquivo":"03-nichos-e-pesquisa.md","titulo":"Nichos e Pesquisa — escolher onde tem dinheiro","html":"<h1>03 · Nichos e Pesquisa — escolher onde tem dinheiro</h1>\n<hr>\n<h2>3.1 A regra de ouro</h2>\n<blockquote><strong>Escolha o nicho pelo dinheiro e pela facilidade de produzir com IA. Paixão vem em terceiro.</strong></blockquote>\n<p>Parece frio, mas é o que separa quem fatura de quem desiste. Um nicho apaixonante sem oferta que paga gera 6 meses de trabalho e R$ 0. Um nicho \"chato\" cheio de afiliado recorrente paga aluguel.</p>\n<h3>A fórmula do app</h3>\n<pre class=\"prompt curto\">Score do nicho = (Demanda × 0,40) + (Monetização × 0,35) + (Facilidade com IA × 0,25)</pre>\n<p>Cada critério vai de 0 a 10. Acima de 85 = oportunidade alta. Entre 70 e 85 = boa. Abaixo de 70 = deixe para depois.</p>\n<hr>\n<h2>3.2 Os 16 nichos mapeados (dados 2025-2026)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Nicho</th><th>Demanda</th><th>Monet.</th><th>IA</th><th>Ticket médio</th><th>Melhor caminho</th></tr></thead><tbody><tr><td>1</td><td>Decoração &amp; Organização</td><td>10</td><td>9</td><td>9</td><td>R$ 60-400</td><td>Físico + printables</td></tr><tr><td>2</td><td>Receitas &amp; Comida</td><td>10</td><td>7</td><td>7</td><td>R$ 30-200</td><td>E-book + físico + ads</td></tr><tr><td>3</td><td>Fitness &amp; Emagrecimento</td><td>9</td><td>10</td><td>8</td><td>R$ 97-600</td><td>Infoproduto</td></tr><tr><td>4</td><td>Finanças &amp; Renda Extra</td><td>9</td><td>10</td><td>10</td><td>R$ 47-1.200</td><td>Infoproduto + SaaS</td></tr><tr><td>5</td><td>Produtividade &amp; Estudos</td><td>8</td><td>8</td><td>10</td><td>R$ 27-400</td><td>Templates + SaaS</td></tr><tr><td>6</td><td>Beleza &amp; Autocuidado</td><td>9</td><td>9</td><td>8</td><td>R$ 50-300</td><td>Físico + infoproduto</td></tr><tr><td>7</td><td>Moda &amp; Looks</td><td>9</td><td>8</td><td>7</td><td>R$ 80-500</td><td>Físico + carrossel</td></tr><tr><td>8</td><td>DIY &amp; Artesanato</td><td>9</td><td>6</td><td>8</td><td>R$ 20-200</td><td>Moldes + printables</td></tr><tr><td>9</td><td>Maternidade &amp; Bebê</td><td>8</td><td>8</td><td>8</td><td>R$ 60-400</td><td>Infoproduto + printables</td></tr><tr><td>10</td><td>Pets</td><td>8</td><td>7</td><td>8</td><td>R$ 40-300</td><td>Físico + infoproduto</td></tr><tr><td>11</td><td><strong>IA &amp; Ferramentas</strong></td><td>10</td><td>9</td><td>10</td><td>R$ 27-997</td><td><strong>SaaS recorrente</strong></td></tr><tr><td>12</td><td>Viagem</td><td>8</td><td>7</td><td>8</td><td>R$ 100-2.000</td><td>Roteiro PDF + seguro</td></tr><tr><td>13</td><td><strong>Negócios &amp; Marketing Digital</strong></td><td>9</td><td>10</td><td>9</td><td>R$ 97-2.500</td><td><strong>Infoproduto + SaaS</strong></td></tr><tr><td>14</td><td>Jardim &amp; Plantas</td><td>8</td><td>6</td><td>9</td><td>R$ 30-250</td><td>Físico + infoproduto</td></tr><tr><td>15</td><td>Relacionamento &amp; Família</td><td>7</td><td>6</td><td>9</td><td>R$ 27-200</td><td>Printables</td></tr><tr><td>16</td><td>Bem-estar &amp; Baixo Impacto</td><td>8</td><td>8</td><td>8</td><td>R$ 47-500</td><td>Infoproduto + assinatura</td></tr></tbody></table></div>\n<h3>Os 4 melhores para começar do zero</h3>\n<p><strong>🥇 Finanças &amp; Renda Extra</strong> — público comprador, infoprodutos de R$ 47 a R$ 1.200, comissões de 40% a 80%, e SaaS de ferramentas que pagam <strong>recorrente</strong>. Produção com IA é trivial (infográfico, checklist, planilha). Pico em janeiro e setembro.</p>\n<p><strong>🥈 IA &amp; Ferramentas</strong> — o nicho mais quente do momento. Você vende ferramenta que o cliente paga todo mês e você recebe todo mês. Mesh perfeito com produção por IA. Concorrência maior, ticket também.</p>\n<p><strong>🥉 Decoração &amp; Organização</strong> — o nicho de maior <strong>longevidade</strong> do Pinterest: pins de decoração entregam tráfego 2-3 anos depois de publicados. Combina físico (Amazon/Mercado Livre) com printables próprios de margem 100%.</p>\n<p><strong>🏅 Fitness de baixo impacto / Bem-estar</strong> — pico de janeiro e \"sono\" como tendência forte de 2026. Infoprodutos de ticket alto, produção visual fácil e público decidido.</p>\n<hr>\n<h2>3.3 Como validar demanda em 5 minutos (sem ferramenta paga)</h2>\n<h3>Método 1 — Busca guiada do Pinterest (o mais importante)</h3>\n<ol>\n<li>Abra o Pinterest e digite a palavra-chave principal no buscador.</li>\n<li><strong>Não aperte Enter.</strong> Olhe as sugestões coloridas que aparecem embaixo.</li>\n</ol>\n<ul>\n<li>Se aparecem <strong>6+ sugestões</strong> relacionadas → existe demanda e variedade. <strong>Ótimo sinal.</strong></li>\n<li>Se aparece <strong>1 ou nenhuma</strong> → o termo é fraco. Troque.</li>\n</ul>\n<ol>\n<li>Cada sugestão colorida é uma keyword long-tail pronta para virar um pin.</li>\n</ol>\n<p><strong>Exemplo:</strong> digitar <code>organização de cozinha</code> sugere <code>organização de cozinha pequena</code>, <code>organização de cozinha simples</code>, <code>organização de cozinha geladeira</code>, <code>organização de cozinha armário</code>, <code>organização de cozinha barata</code>.</p>\n<p>Isso é ouro: são <strong>5 pins diferentes</strong>, cada um com uma keyword própria.</p>\n<h3>Método 2 — Pinterest Trends</h3>\n<p>Acesse <code>trends.pinterest.com</code> (grátis, sem login):</p>\n<ul>\n<li>Compare até 5 termos de uma vez.</li>\n<li>Veja o gráfico dos últimos 12 meses → identifique o <strong>mês de pico</strong> e publique 30-60 dias antes.</li>\n<li>Veja a distribuição por <strong>idade, gênero e região</strong> → ajuste a linguagem.</li>\n</ul>\n<h3>Método 3 — Análise de concorrência (a mais subestimada)</h3>\n<p>Busque a keyword e ordene pelos pins do topo:</p>\n<div class=\"rolagem\"><table><thead><tr><th>O que olhar</th><th>Leitura</th></tr></thead><tbody><tr><td>Idade do pin (data)</td><td>Só pins de 2026 no topo = feed ativo. Pins velhos no topo = difícil entrar</td></tr><tr><td>Quantidade de saves</td><td>Saves &gt; 1.000 = o formato funciona</td></tr><tr><td>Estilo dominante</td><td>Se 8 de 10 são light &amp; bright, esse é o padrão — ou você se diferencia, ou segue</td></tr><tr><td>Overlay</td><td>Copie a <strong>estrutura</strong> (não o texto): tamanho, posição, número de palavras</td></tr><tr><td>Destino</td><td>Está indo para blog? Direto para loja? Isso revela o modelo de quem está ganhando</td></tr></tbody></table></div>\n<blockquote>⚠️ <strong>Regra ética e prática:</strong> nunca copie criativo 1:1. Use referência de <strong>estrutura</strong> e crie imagem própria. Cópia gera denúncia e derrubada.</blockquote>\n<h3>Método 4 — Onde o dinheiro já está</h3>\n<p>Antes de produzir qualquer coisa, confirme se existe oferta:</p>\n<ol>\n<li>Entre na Hotmart / Kiwify / Monetizze e busque o tema.</li>\n<li>Filtre por <strong>temperatura alta</strong> e <strong>mínimo de vendas</strong>.</li>\n<li>Se existem 10+ produtos do mesmo tema com centenas de vendas, o público <strong>compra</strong>. Siga.</li>\n<li>Se não existe nenhum produto, ou é oportunidade inédita (raro) ou é nicho que não compra (comum).</li>\n</ol>\n<hr>\n<h2>3.4 Sub-nicho: onde a concorrência cai</h2>\n<p>Palavra-chave ampla = guerra. Palavra-chave específica = sua vez.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Keyword ampla (evitar)</th><th>Sub-nicho (usar)</th></tr></thead><tbody><tr><td><code>decoração</code></td><td><code>decoração de apartamento alugado sem furar parede</code></td></tr><tr><td><code>emagrecer</code></td><td><code>abdômen lower em casa sem equipamento 10 min</code></td></tr><tr><td><code>dinheiro</code></td><td><code>planilha de orçamento familiar para quem ganha pouco</code></td></tr><tr><td><code>estudar</code></td><td><code>método de estudo para concurso trabalhando 8h por dia</code></td></tr><tr><td><code>receita</code></td><td><code>jantar rápido de 15 minutos com 5 ingredientes</code></td></tr><tr><td><code>skincare</code></td><td><code>rotina de skincare noturna para pele oleosa barata</code></td></tr><tr><td><code>viagem</code></td><td><code>roteiro de 3 dias em cidades históricas gastando pouco</code></td></tr></tbody></table></div>\n<p><strong>A regra dos 5 eixos para afunilar:</strong> combine o tema com um modificador de</p>\n<ol>\n<li><strong>público</strong> (para mães, para iniciantes, para quem trabalha sentado)</li>\n<li><strong>restrição</strong> (barato, sem equipamento, em apartamento, com pouco tempo)</li>\n<li><strong>local</strong> (Brasil, cidade pequena, aluguel)</li>\n<li><strong>formato</strong> (passo a passo, checklist, comparativo)</li>\n<li><strong>temporal</strong> (rotina de 7 dias, em 1 tarde, por 30 dias)</li>\n</ol>\n<p>Ex.: <code>rotina de 10 minutos de alongamento para quem trabalha sentado em casa</code> — cinco eixos em uma frase, sem concorrência direta.</p>\n<hr>\n<h2>3.5 Sazonalidade por nicho</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Nicho</th><th>Picos</th><th>Publicar a partir de</th></tr></thead><tbody><tr><td>Fitness / Emagrecimento</td><td>Janeiro, maio, setembro</td><td>Nov / Mar / Jul</td></tr><tr><td>Finanças / Renda extra</td><td>Janeiro (metas), março (IR), dezembro</td><td>Nov / Jan / Out</td></tr><tr><td>Produtividade / Estudos</td><td>Janeiro, fevereiro, agosto-setembro</td><td>Nov / Dez / Jun</td></tr><tr><td>Decoração</td><td><strong>Evergreen</strong> + setembro-dezembro (fim de ano)</td><td>O ano inteiro</td></tr><tr><td>Receitas</td><td>Evergreen + festas (jun, nov-dez)</td><td>O ano inteiro</td></tr><tr><td>Moda</td><td>Trocas de estação</td><td>2 meses antes</td></tr><tr><td>Maternidade</td><td>Evergreen + Dia das Mães</td><td>O ano inteiro</td></tr><tr><td>Casamento</td><td>Novembro a fevereiro</td><td><strong>Setembro</strong></td></tr><tr><td>Natal</td><td>Novembro-dezembro</td><td><strong>Setembro</strong></td></tr><tr><td>Viagem</td><td>Jun-jul e dez-jan</td><td>Abr e Out</td></tr><tr><td>Volta às aulas</td><td>Jan-fev e Jul-ago</td><td>Nov e Mai</td></tr><tr><td>Jardim / Plantas</td><td>Primavera (set-nov)</td><td>Julho</td></tr></tbody></table></div>\n<blockquote><strong>Estratégia de mix recomendada:</strong> 70% conteúdo evergreen (rende o ano inteiro) + 30% sazonal (aproveita os picos). Quem só faz sazonal tem picos e vales brutais. Quem só faz evergreen perde os picos de busca.</blockquote>\n<hr>\n<h2>3.6 O teste final antes de commitar (5 perguntas)</h2>\n<p>Responda <strong>sim</strong> para todas antes de investir uma semana:</p>\n<ol>\n<li><strong>Existem pelo menos 5 ofertas ativas</strong> (afiliado ou produto próprio) que pagam neste nicho?</li>\n<li><strong>Consigo produzir 15-25 pins</strong> diferentes sobre isso sem me repetir? (se só dá 3 pins, o nicho é raso)</li>\n<li><strong>O tema é visual?</strong> Dá foto/ilustração óbvia? (Pinterest é buscador visual — tema abstrato não performa)</li>\n<li><strong>Estou confortável</strong> em publicar sobre isso 50 vezes sem cansar?</li>\n<li><strong>A comissão por venda</strong> paga pelo menos R$ 25? (abaixo disso o volume necessário é brutal)</li>\n</ol>\n<p>Se qualquer resposta for \"não\", troque de nicho <strong>agora</strong>. É infinitamente mais barato trocar aqui do que depois de 300 pins publicados.</p>\n<hr>\n<h2>3.7 Prompt para destravar a escolha</h2>\n<p>Está no app (etapa 1) e aqui para copiar:</p>\n<pre class=\"prompt curto\">Atue como estrategista sênior de pesquisa de mercado.\n\nGere 12 nichos de Pinterest monetizáveis em 2026 que eu consiga produzir\n100% com IA grátis. Para cada nicho, entregue:\n1. Nome específico (nunca \"lifestyle\")\n2. Três sub-nichos com intenção real de busca\n3. Demanda estimada (Alta/Média/Baixa) e por quê\n4. Ticket médio e caminho de monetização mais provável\n5. Dificuldade de produção com IA (Fácil/Médio/Difícil)\n6. Uma palavra-chave long-tail para o dia 1\n7. O maior risco do nicho\n\nOrdene do melhor para o pior para um iniciante sem verba.\nNo fim, escolha o TOP 3 e justifique em 2 linhas cada.</pre>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"04-validacao-de-produtos.md\">04 · Validação de Produtos</a></p>"},{"arquivo":"04-validacao-de-produtos.md","titulo":"Validação de Produtos — o capítulo que decide se você ganha dinheiro","html":"<h1>04 · Validação de Produtos — o capítulo que decide se você ganha dinheiro</h1>\n<blockquote><strong>Este é o capítulo mais importante da Bíblia.</strong> Pin bonito com oferta ruim dá zero. Oferta excelente com pin medíocre dá dinheiro. Valide primeiro.</blockquote>\n<hr>\n<h2>4.1 A ordem correta (e por que quase todo mundo erra)</h2>\n<p>❌ <strong>Errado:</strong> fazer pins bonitos → depois procurar o que vender → descobrir que não tem nada bom → desistir.</p>\n<p>✅ <strong>Certo:</strong> achar a oferta que paga → validar → criar o ângulo → aí sim desenhar o pin.</p>\n<p>Você não está fazendo arte. Está construindo uma <strong>máquina de conversão</strong> onde o pin é apenas a porta de entrada.</p>\n<hr>\n<h2>4.2 Os 12 critérios de validação</h2>\n<p>O app roda exatamente este checklist com score ponderado. <strong>Itens de peso 3 bloqueiam</strong> — se um deles falhar, não avance.</p>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Critério</th><th>Peso</th><th>Por quê</th></tr></thead><tbody><tr><td>1</td><td>O produto resolve uma <strong>dor concreta e específica</strong></td><td>🔴 3</td><td>\"Organizar despensa pequena\" &gt; \"ter uma vida melhor\"</td></tr><tr><td>2</td><td>Existe <strong>oferta afiliada aprovada</strong> e disponível hoje</td><td>🔴 3</td><td>Sem link aprovado não existe projeto</td></tr><tr><td>3</td><td>O programa <strong>permite link direto</strong> no Pinterest</td><td>🔴 3</td><td>Etsy, por exemplo, exige intermediação por blog</td></tr><tr><td>4</td><td>Comissão × preço gera <strong>pelo menos R$ 25 por venda</strong></td><td>🟠 2</td><td>Abaixo disso o volume necessário é brutal</td></tr><tr><td>5</td><td>O produto é <strong>legitimamente útil</strong></td><td>🟠 2</td><td>Queima de reputação mata contas no médio prazo</td></tr><tr><td>6</td><td>Existe <strong>busca no Pinterest</strong> (a busca guiada retorna sugestões)</td><td>🟠 2</td><td>Sem demanda, não há tráfego</td></tr><tr><td>7</td><td>O produto tem <strong>provas sociais</strong> (avaliações, vendas, reputação)</td><td>🟠 2</td><td>Oferta sem histórico = reembolso alto</td></tr><tr><td>8</td><td>O produto é <strong>visual</strong> (dá uma imagem/demonstração óbvia)</td><td>🟠 2</td><td>Pinterest é buscador visual</td></tr><tr><td>9</td><td>O <strong>ticket</strong> permite tráfego frio sem funil complexo</td><td>🟡 1</td><td>R$ 27-197 é a faixa de compra por impulso</td></tr><tr><td>10</td><td>Consigo produzir <strong>15-25 pins</strong> sobre este produto</td><td>🟡 1</td><td>Se só dá 3 pins, o nicho é raso</td></tr><tr><td>11</td><td>A <strong>sazonalidade</strong> está a favor (ou o tema é evergreen)</td><td>🟡 1</td><td>Publique sazonal 30-60 dias antes</td></tr><tr><td>12</td><td>Existe <strong>produto digital próprio</strong> complementar (upsell)</td><td>🟡 1</td><td>Printables/templates aumentam lucro por clique</td></tr></tbody></table></div>\n<h3>Como pontuar</h3>\n<pre class=\"prompt curto\">Score = (pontos obtidos ÷ pontos totais) × 100\n\n≥ 85  → APROVADO, pode escalar\n65-84 → VIÁVEL COM AJUSTES, corrija os itens vermelhos\n&lt; 65  → FRACO, troque de produto ou de ângulo\n🔴 qualquer peso 3 reprovado → BLOQUEADO, nem comece</pre>\n<hr>\n<h2>4.3 As 16 categorias de oferta (dados 2026-BR)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Categoria</th><th>Onde</th><th>Comissão</th><th>Cookie</th><th>Link direto no Pinterest</th><th>Risco</th></tr></thead><tbody><tr><td><strong>Infoproduto BR</strong></td><td>Hotmart</td><td>10% a 80% (média 40-60%)</td><td>60-180 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Infoproduto BR</strong></td><td>Kiwify</td><td>até 70-85%</td><td>até 180 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Infoproduto + físico</strong></td><td>Monetizze</td><td>até 70-80%</td><td>30-180 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Infoproduto BR</strong></td><td>Eduzz</td><td>10% a 70%</td><td>30-180 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Físico/digital BR</strong></td><td>Braip</td><td>até 99% em alguns</td><td>não divulgado</td><td>✅ Sim</td><td>Médio (mensalidade de inatividade)</td></tr><tr><td><strong>Físico global</strong></td><td>Amazon Associados</td><td>1% a 15% (moda ~10%, livro 4,5%)</td><td><strong>24 horas</strong></td><td>✅ Sim</td><td>Médio</td></tr><tr><td><strong>Físico BR</strong></td><td>Mercado Livre Afiliados</td><td>até ~16%</td><td>30 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Físico BR/Ásia</strong></td><td>Shopee Afiliados</td><td>3% a 15%</td><td>7 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Físico BR</strong></td><td>Parceiro Magalu</td><td>1% a 12%</td><td>30 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>SaaS / software</strong> ⭐</td><td>Programas próprios (Hostinger, Canva, SEMrush, Elementor, ConvertKit, Notion)</td><td>30% a 60% <strong>ou recorrente</strong></td><td>30-90 dias</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Produto próprio</strong> ⭐</td><td>Gumroad, Payhip, Etsy, Hotmart (como produtor), Ko-fi</td><td>80% a 95% para você</td><td>n/a</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Print on demand</strong></td><td>Printful/Printify + loja, Redbubble</td><td>margem 20% a 50%</td><td>n/a</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>Tráfego → anúncios</strong></td><td>AdSense, Ezoic, Mediavine, Journey</td><td>RPM variável (US$ 5-40)</td><td>n/a</td><td>❌ (precisa blog)</td><td>Baixo</td></tr><tr><td><strong>Serviço próprio</strong></td><td>Gestão de Pinterest, criação de pins</td><td>R$ 500 a R$ 5.000/mês por cliente</td><td>n/a</td><td>❌</td><td>Baixo</td></tr><tr><td><strong>Lead → venda consultiva</strong></td><td>Formulário/WhatsApp</td><td>alto ticket</td><td>n/a</td><td>✅ Sim</td><td>Baixo</td></tr><tr><td><strong>PLR licenciado</strong></td><td>PLR Databases, IDPLR, packs de prompts</td><td>margem 100%</td><td>n/a</td><td>✅ Sim</td><td>Baixo (confira a licença)</td></tr></tbody></table></div>\n<h3>⭐ As duas melhores categorias (e por que quase ninguém usa)</h3>\n<p><strong>1. SaaS com comissão recorrente.</strong> Você indica uma ferramenta; o cliente assina; <strong>você recebe todo mês</strong> enquanto ele ficar. Exemplos de estrutura (confirme os valores atuais):</p>\n<ul>\n<li>ConvertKit: ~30% recorrente por 24 meses.</li>\n<li>Hostinger: até ~60% por venda + recorrência em assinaturas.</li>\n<li>SEMrush: comissão alta por venda (+ valor por trial) — ticket de US$ 200 citado no mercado.</li>\n<li>Canva Pro: até ~36% por assinatura.</li>\n</ul>\n<p>Um único cliente de US$ 200 de comissão vale mais que trinta e-books de R$ 30. <strong>Multiplique por 100 clientes e você tem um salário recorrente.</strong></p>\n<p><strong>2. Produto digital próprio.</strong> Margem de 80% a 95% (ou 100% em Gumroad/Payhip). Custo marginal zero. Você cria <strong>uma vez</strong> com IA + Canva e vende infinitas vezes. É a via que mais cresce depois do terceiro mês.</p>\n<hr>\n<h2>4.4 A matemática da comissão</h2>\n<p>Faça esta conta <strong>antes</strong> de produzir qualquer pin:</p>\n<pre class=\"prompt curto\">Valor por venda = Preço do produto × (% de comissão ÷ 100)\n\nExemplos reais:\n  R$ 97   × 50%  = R$ 48,50\n  R$ 197  × 40%  = R$ 78,80\n  R$ 27   × 80%  = R$ 21,60  ← abaixo do mínimo, precisa de volume alto\n  US$ 99  × 30%  = US$ 29,70 ≈ R$ 165  ← recorrente, todo mês</pre>\n<h3>Quantos cliques você precisa</h3>\n<p>Com conversão de 1% (referência de mercado):</p>\n<ul>\n<li>Para 1 venda a cada 100 cliques.</li>\n<li>Para R$ 500/mês com produto de R$ 48,50 → ~10 vendas/mês → <strong>~1.000 cliques/mês</strong>.</li>\n<li>Com CTR de 0,4% → <strong>~250.000 impressões/mês</strong>.</li>\n</ul>\n<p><strong>Tradução prática:</strong> 250 mil impressões/mês exige um acervo de 300 a 600 pins publicados com constância. Não é impossível — é aritmética de volume. É exatamente por isso que a IA grátis é a peça que muda o jogo: sem ela, esse volume é inviável para uma pessoa só.</p>\n<h3>A tabela que decide</h3>\n<div class=\"rolagem\"><table><thead><tr><th>Impressões/mês</th><th>Cliques</th><th>Vendas (1%)</th><th>Receita com R$ 48,50/venda</th></tr></thead><tbody><tr><td>10.000</td><td>40</td><td>0,4</td><td>~R$ 19</td></tr><tr><td>50.000</td><td>200</td><td>2</td><td>~R$ 97</td></tr><tr><td>100.000</td><td>400</td><td>4</td><td>~R$ 194</td></tr><tr><td>250.000</td><td>1.000</td><td>10</td><td>~R$ 485</td></tr><tr><td>500.000</td><td>2.000</td><td>20</td><td>~R$ 970</td></tr><tr><td>1.000.000</td><td>4.000</td><td>40</td><td>~R$ 1.940</td></tr></tbody></table></div>\n<p><em>Considere esta tabela como régua de planejamento, não como promessa. Oferta melhor (ticket maior, comissão maior, conversão maior) multiplica cada linha.</em></p>\n<hr>\n<h2>4.5 Escolhendo dentro de um catálogo (Hotmart/Kiwify)</h2>\n<p>Filtros objetivos ao escolher um infoproduto para afiliar:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Filtro</th><th>Valor mínimo</th><th>Por quê</th></tr></thead><tbody><tr><td><strong>Temperatura</strong></td><td>Alta (mais de 100 vendas)</td><td>Já provou que vende</td></tr><tr><td><strong>Nota do produtor</strong></td><td>≥ 4,5 e sem histórico de reclamação</td><td>Reembolso baixo = você recebe</td></tr><tr><td><strong>Comissão</strong></td><td>≥ 40%</td><td>Abaixo disso, escolha outro</td></tr><tr><td><strong>Ticket</strong></td><td>R$ 47 a R$ 997</td><td>Faixa de conversão em tráfego frio</td></tr><tr><td><strong>Página de vendas</strong></td><td>Profissional, com depoimentos e garantia</td><td>Você não vai ter que \"vender sozinho\"</td></tr><tr><td><strong>Recorrência</strong></td><td>Assinatura &gt; pagamento único</td><td>Renda composta</td></tr><tr><td><strong>Afiliação automática</strong></td><td>Aprovada na hora</td><td>Velocidade de teste</td></tr><tr><td><strong>Materiais de apoio</strong></td><td>Tem criativos e textos para afiliado</td><td>Menos trabalho</td></tr></tbody></table></div>\n<blockquote>⚠️ <strong>Nunca</strong> promova produto que você não conheceria o suficiente para recomendar a um amigo. Reembolso, reclamação e queima de conta vêm justamente daí.</blockquote>\n<hr>\n<h2>4.6 Template de ficha de validação (copie)</h2>\n<pre class=\"prompt curto\">FICHA DE VALIDAÇÃO DE OFERTA\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nProduto:            ______________________________\nPlataforma:         ______________________________\nComissão (%):       _______   Preço (R$): _______\nValor por venda:    R$ ______________\nCookie:             _______ dias\nPagamento:          ______________________________\nLink direto no Pinterest?   ( ) Sim   ( ) Não   ( ) Incerto\n                          → se NÃO: usar página intermediária\nCategoria proibida?         ( ) Sim   ( ) Não\nConcorrência no Pinterest:  ____ pins relevantes no topo\nBusca guiada retorna 6+ sugestões?  ( ) Sim   ( ) Não\nVendas declaradas:  ________     Nota: ______\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nSCORE DOS 12 CRITÉRIOS: ______ / 100\nBloqueios (peso 3):     ______\nVEREDITO:  ( ) APROVADO  ( ) AJUSTAR  ( ) DESCARTAR\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nDecisão tomada em ___/___/______   Revisar em ___/___/______</pre>\n<p>O app gera isso automaticamente na etapa 2 e guarda o histórico no log do projeto.</p>\n<hr>\n<h2>4.7 Erros de validação que custam caro</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Erro</th><th>Consequência</th><th>Correção</th></tr></thead><tbody><tr><td>Promover produto caro sem prova social</td><td>Reembolso alto, você perde a comissão</td><td>Comece por produtos com 100+ vendas</td></tr><tr><td>Promover produto de R$ 27 com 20% de comissão</td><td>R$ 5,40 por venda → precisa de 5.000 cliques para R$ 270</td><td>Suba o ticket ou a comissão</td></tr><tr><td>Usar link da Etsy direto no pin</td><td>Violação de termos do programa</td><td>Página intermediária</td></tr><tr><td>Depender de uma única oferta</td><td>Se o produtor fecha o programa, sua renda zera</td><td>1 principal + 2 secundárias sempre</td></tr><tr><td>Promover produto que você nunca testou</td><td>Queima de reputação</td><td>Teste ou, no mínimo, pesquise avaliações reais</td></tr><tr><td>Encurtar o link para \"ficar bonito\"</td><td>Pinterest bloqueia/marca</td><td>Use a URL completa</td></tr><tr><td>Não conferir a categoria</td><td>Produto proibido = conta derrubada</td><td>Cheque a lista de categorias proibidas (cap. 08)</td></tr></tbody></table></div>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"05-visual-que-converte.md\">05 · O Visual que Converte</a></p>"},{"arquivo":"05-visual-que-converte.md","titulo":"O Visual que Converte — o que realmente se vê no feed","html":"<h1>05 · O Visual que Converte — o que realmente se vê no feed</h1>\n<hr>\n<h2>5.1 Os números do design (benchmark 2026, 148 mil pins analisados)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Variável de design</th><th>Escolha ótima</th><th>Efeito medido<
