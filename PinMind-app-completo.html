/th></tr></thead><tbody><tr><td><strong>Proporção</strong></td><td>2:3 vertical (1000×1500 px)</td><td><strong>+45% impressões</strong> e +22% cliques vs quadrado</td></tr><tr><td><strong>Texto no overlay</strong></td><td>5 a 8 palavras, bold sans-serif</td><td><strong>+110% cliques</strong> vs pin sem texto</td></tr><tr><td><strong>Fundo</strong></td><td>Tons quentes ou claros</td><td><strong>+38% saves</strong> vs fundo escuro</td></tr><tr><td><strong>Sujeito</strong></td><td>Pessoa em contexto lifestyle</td><td>+14% impressões, +18% saves</td></tr><tr><td><strong>Fonte</strong></td><td>Sans-serif bold ou semi-bold</td><td>+19% cliques</td></tr><tr><td><strong>Título</strong></td><td>40 a 60 caracteres com keyword</td><td>+67% impressões vs pin sem título</td></tr><tr><td><strong>Bordas</strong></td><td>Nenhuma borda grossa</td><td><strong>-9% impressões</strong> se usar borda</td></tr><tr><td><strong>Frequência</strong></td><td>3 a 5 pins/dia por 90 dias</td><td>+22% impressões por pin</td></tr></tbody></table></div>\n<p><strong>A combinação de todos os 6 acertos de design</strong> performa a <strong>2,3x</strong> a média de impressões e cliques. E a mudança de maior impacto isolado é simplesmente <strong>sair do quadrado para o 2:3</strong>.</p>\n<hr>\n<h2>5.2 Os 12 estilos visuais (o que você mais vê no feed)</h2>\n<h3>🥇 Estilos de força ALTA (a maior parte do feed bem-sucedido)</h3>\n<p><strong>1. Light &amp; Bright</strong></p>\n<ul>\n<li><strong>Onde:</strong> decoração, receitas, beleza, jardim, bebê, produtividade.</li>\n<li><strong>Por que:</strong> fundo claro rende +38% de saves. É o visual dominante em casa, comida e bem-estar.</li>\n<li><strong>Prompt:</strong> <code>white or light beige background, soft natural light from the left, minimal shadows, pastel palette with one accent color, airy clean aesthetic, lots of negative space</code></li>\n<li><strong>Evite:</strong> saturação alta e sombras duras — parece panfleto.</li>\n</ul>\n<p><strong>2. Bold Tipográfico</strong></p>\n<ul>\n<li><strong>Onde:</strong> finanças, IA, negócios, produtividade, fitness.</li>\n<li><strong>Por que:</strong> texto grande em 5-8 palavras rende +110% de cliques. Domina os nichos de informação.</li>\n<li><strong>Prompt:</strong> <code>extra-bold sans-serif typography filling 40% of the pin, high contrast (near-black on off-white, or white on a colored block), clear hierarchy between line 1 and line 2, left aligned</code></li>\n<li><strong>Evite:</strong> passar de 8 palavras ou usar 3 fontes diferentes.</li>\n</ul>\n<p><strong>3. Top-down Flat Lay</strong></p>\n<ul>\n<li><strong>Onde:</strong> receitas, DIY, beleza, jardim.</li>\n<li><strong>Por que:</strong> padrão nº 1 em comida e artesanato. O resultado visto de cima com ingredientes ao redor gera altíssimo save.</li>\n<li><strong>Prompt:</strong> <code>top-down flat lay photograph, neutral light wood or marble surface, dish/project centered, ingredients arranged around it in a balanced composition, diffused light with no glare</code></li>\n<li><strong>Evite:</strong> encher as bordas — no thumbnail fica ilegível.</li>\n</ul>\n<p><strong>4. Lifestyle com Pessoa</strong></p>\n<ul>\n<li><strong>Onde:</strong> fitness, moda, bebê, pets, viagem, beleza.</li>\n<li><strong>Por que:</strong> +14% impressões e +18% saves. Gera identificação imediata.</li>\n<li><strong>Prompt:</strong> <code>real person in an everyday context (not a studio model), slightly side angle, natural window light, recognizable home or urban setting, warm colors, candid unposed moment</code></li>\n<li><strong>Evite:</strong> rosto gerado por IA com aparência \"plástica\" — o público rejeita e a plataforma sinaliza.</li>\n</ul>\n<p><strong>5. Checklist / Infográfico</strong></p>\n<ul>\n<li><strong>Onde:</strong> finanças, produtividade, negócios, IA, fitness, bebê.</li>\n<li><strong>Por que:</strong> conteúdo de referência (lista, checklist, passo a passo) é o que <strong>mais é salvo</strong> — a pessoa salva para usar depois.</li>\n<li><strong>Prompt:</strong> <code>vertical infographic layout, 5 to 7 numbered items with simple line icons, soft color blocks separating each item, typography legible on mobile, 4-word title at the top</code></li>\n<li><strong>Evite:</strong> mais de 7 itens ou texto pequeno — ninguém lê.</li>\n</ul>\n<p><strong>6. Antes / Depois</strong></p>\n<ul>\n<li><strong>Onde:</strong> decoração, fitness, beleza, DIY, jardim.</li>\n<li><strong>Por que:</strong> contraste visual resolve em 1 segundo. É o gancho mais forte para clique em transformação.</li>\n<li><strong>Prompt:</strong> <code>exact vertical split down the middle, \"before\" on the left and \"after\" on the right with the same framing and lighting, thin divider line, subtle corner labels, consistent color between both sides</code></li>\n<li><strong>Evite:</strong> prometer resultado de saúde impossível — é infração.</li>\n</ul>\n<h3>🥈 Estilos de força MÉDIA (diferenciação e nichos específicos)</h3>\n<p><strong>7. Grade Numerada / Passo a Passo</strong></p>\n<ul>\n<li><strong>Onde:</strong> DIY, receitas, fitness, jardim.</li>\n<li><strong>Por que:</strong> vencedor em DIY e treino. Mostra o processo, combina resultado final no topo com etapas embaixo.</li>\n<li><strong>Prompt:</strong> <code>2x2 or 3x2 grid showing steps, large numerals in a circle at each frame corner, final result in the larger top frame, thin white frame between frames</code></li>\n<li><strong>Evite:</strong> grade 3x3 em pin 2:3 — cada quadro fica minúsculo.</li>\n</ul>\n<p><strong>8. Dark Academia / Moody</strong></p>\n<ul>\n<li><strong>Onde:</strong> produtividade, moda, viagem, negócios.</li>\n<li><strong>Por que:</strong> continua sendo um dos feeds de maior distribuição por estética em 2026, com destaque para aubergine e dark academia 2.0.</li>\n<li><strong>Prompt:</strong> <code>warm low-light photography, rich shadows, gold accents, slightly filmic color grade, dark wood and leather textures, old library atmosphere</code></li>\n<li><strong>Evite:</strong> fundo escuro perde save médio — use apenas quando a estética for o diferencial.</li>\n</ul>\n<p><strong>9. Cottage-Glam</strong></p>\n<ul>\n<li><strong>Onde:</strong> decoração, receitas, jardim, beleza.</li>\n<li><strong>Por que:</strong> tendência declarada de 2026: rústico acolhedor com um toque de glamour.</li>\n<li><strong>Prompt:</strong> <code>cozy rustic setting with one glamorous element (crystal, gold metal, satin), warm filter, wildflowers, artisanal ceramic dishes, late afternoon light</code></li>\n<li><strong>Evite:</strong> mais de um elemento glamouroso vira kitsch.</li>\n</ul>\n<p><strong>10. Cluttercore Curado (Maximalismo)</strong></p>\n<ul>\n<li><strong>Onde:</strong> decoração, moda, relacionamento.</li>\n<li><strong>Por que:</strong> 2026 premia o excesso <strong>intencional</strong> — cada objeto parece escolhido.</li>\n<li><strong>Prompt:</strong> <code>maximalist yet intentional interior, collectible objects visible but organized by color, mixed patterns unified by one palette, fabric and ceramic textures, warm light</code></li>\n<li><strong>Evite:</strong> desordem aleatória — o oposto do que funciona.</li>\n</ul>\n<p><strong>11. Minimalista Premium</strong></p>\n<ul>\n<li><strong>Onde:</strong> negócios, finanças, IA, produtividade, SaaS.</li>\n<li><strong>Por que:</strong> passa autoridade. Ideal para vender software, curso caro e serviço.</li>\n<li><strong>Prompt:</strong> <code>minimal composition with lots of white space, a single object or screen mockup, thin elegant black typography, soft long shadow, off-white or light grey background</code></li>\n<li><strong>Evite:</strong> minimalismo sem hierarquia morre no feed — o título precisa ser grande.</li>\n</ul>\n<p><strong>12. Print/Planner Mockup</strong></p>\n<ul>\n<li><strong>Onde:</strong> produtividade, finanças, relacionamento, bebê.</li>\n<li><strong>Por que:</strong> a melhor forma de vender <strong>produto digital próprio</strong> — mostra o arquivo como objeto tangível.</li>\n<li><strong>Prompt:</strong> <code>mockup of the printed sheet on a light desk or held in hand, tablet with the template open, pen and coffee cup beside it, realistic shadow, tangible product feel</code></li>\n<li><strong>Evite:</strong> o print precisa ficar legível no mockup — ele é a promessa visual do produto.</li>\n</ul>\n<hr>\n<h2>5.3 Paleta, tipografia e execução no Canva (grátis)</h2>\n<h3>Paleta que mais salva</h3>\n<p>A análise dos 10% melhores pins revela duas estratégias dominantes:</p>\n<ol>\n<li><strong>Preto e branco puros com um acento</strong> (55% dos virais).</li>\n<li><strong>Cores extraídas da própria fotografia</strong> do pin.</li>\n</ol>\n<p><strong>Paleta recomendada para começar:</strong></p>\n<pre class=\"prompt curto\">Fundo ....... #FFFFFF  ou  #FAF7F4 (off-white quente)\nTexto ....... #231F1E  (quase preto, não #000)\nAcento ...... 1 cor só — escolha e nunca mude\nSecundária .. cinza claro #EDE7E3 para blocos</pre>\n<h3>Tipografia</h3>\n<ul>\n<li><strong>Sans-serif bold</strong> para o overlay principal. Fonte grossa, sem serifa, com boa altura-x.</li>\n<li><strong>Uma</strong> fonte secundária no máximo, para legendas.</li>\n<li>Contraste real: se o fundo for claro, texto quase preto; se for foto, use bloco de cor sólida atrás do texto (nunca texto solto sobre imagem movimentada).</li>\n<li>Teste obrigatório: diminua para o tamanho de thumbnail e veja se ainda lê.</li>\n</ul>\n<h3>Receita de template mestre no Canva (faça uma vez, use 500 vezes)</h3>\n<ol>\n<li>Novo design → <strong>1000×1500 px</strong> (a proporção 2:3).</li>\n<li>Adicione guias em 10% e 90% (margem de segurança).</li>\n<li>Coloque o bloco de texto do overlay no terço superior: fonte bold, tamanho que ocupe ~35% da largura.</li>\n<li>Adicione um retângulo semi-transparente branco (90%) atrás do texto — garante contraste em qualquer imagem.</li>\n<li>Espaço reservado na base para logo/URL discreto (opcional).</li>\n<li>Duplique para 10 páginas → cada página é uma variação de fundo.</li>\n<li><strong>Exporte em PNG</strong> e renomeie com a keyword.</li>\n</ol>\n<hr>\n<h2>5.4 O teste do brilho baixo (obrigatório)</h2>\n<p>Antes de publicar qualquer pin:</p>\n<ol>\n<li>Mande o pin para o seu celular.</li>\n<li>Diminua o brilho da tela para <strong>30%</strong>.</li>\n<li>Olhe por 2 segundos.</li>\n</ol>\n<div class=\"rolagem\"><table><thead><tr><th>O que acontece</th><th>Diagnóstico</th><th>Ação</th></tr></thead><tbody><tr><td>Você lê o título</td><td>✅ Aprovado</td><td>Publique</td></tr><tr><td>Você vê a imagem mas não lê</td><td>❌ Contraste insuficiente</td><td>Aumente o contraste ou coloque bloco atrás do texto</td></tr><tr><td>Você não entende o assunto</td><td>❌ Foco visual confuso</td><td>Volte para um único sujeito</td></tr></tbody></table></div>\n<p><strong>90% dos pins ruins falham neste teste.</strong> É o filtro de 5 segundos mais eficiente que existe.</p>\n<hr>\n<h2>5.5 IA x \"cara de IA\": como não ser penalizado</h2>\n<p>O público do Pinterest está cada vez mais sensível a GenAI genérica, e há relatos consistentes de usuários desligando conteúdo gerado por IA no feed. O que separa IA boa de IA ruim:</p>\n<div class=\"rolagem\"><table><thead><tr><th>❌ Cara de IA</th><th>✅ IA bem usada</th></tr></thead><tbody><tr><td>Mão com 6 dedos, dentes estranhos</td><td>Enquadramento sem mãos/rostos em close quando o modelo falha</td></tr><tr><td>Texto torto dentro da imagem</td><td><strong>Nunca</strong> texto na imagem — texto sempre no Canva</td></tr><tr><td>Pele plástica, brilho artificial</td><td>Expressões naturais, luz de janela, leve imperfeição</td></tr><tr><td>Cenário impossível (escada para lugar nenhum)</td><td>Ambiente coerente com contexto real</td></tr><tr><td>Mesma cara em 50 pins</td><td>Variação de enquadramento, luz e ângulo</td></tr><tr><td>Saturação exagerada</td><td>Tons quentes e naturais</td></tr></tbody></table></div>\n<p><strong>Regra prática:</strong> gere 3 a 5 imagens por pin e escolha a <strong>1 mais natural</strong> — não a mais \"impressionante\". Natural converte mais no Pinterest.</p>\n<hr>\n<h2>5.6 Checklist visual de 10 pontos (roda antes de publicar)</h2>\n<pre class=\"prompt curto\">[ ] 1. Proporção 2:3 (1000×1500 px)?\n[ ] 2. Título legível com 5-8 palavras em bold?\n[ ] 3. Alto contraste real (testei com brilho a 30%)?\n[ ] 4. Fundo claro ou tom quente (salvo escolha estética consciente)?\n[ ] 5. Um único foco visual?\n[ ] 6. Sem borda grossa e sem marca d'água de outra plataforma?\n[ ] 7. Sem \"cara de IA\" óbvia (mãos, dentes, texto torto)?\n[ ] 8. Texto dentro da área segura (margem de 8-10%)?\n[ ] 9. Paleta coerente com a conta?\n[ ] 10. Nome do arquivo contém a palavra-chave?</pre>\n<p><strong>Abaixo de 8 itens marcados: refaça.</strong> Não vale a pena testar um pin que já sabe que vai mal.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"06-biblioteca-de-prompts.md\">06 · Biblioteca de Prompts</a></p>"},{"arquivo":"06-biblioteca-de-prompts.md","titulo":"Biblioteca de Prompts — os 15 geradores","html":"<h1>06 · Biblioteca de Prompts — os 15 geradores</h1>\n<blockquote>Todos os prompts abaixo funcionam nas <strong>versões gratuitas</strong> do ChatGPT, Gemini e Claude.<br>No app, eles são preenchidos automaticamente com os seus dados (nicho, palavra-chave, produto, estilo, link) — aqui estão na versão manual, para usar quando quiser.</blockquote>\n<hr>\n<h2>6.0 Regras de prompting que fazem a diferença</h2>\n<p><strong>As 7 regras que separam um prompt que gera lixo de um que gera trabalho pronto:</strong></p>\n<ol>\n<li><strong>Dê um papel específico.</strong> \"Atue como estrategista sênior de SEO para Pinterest com 8 anos de experiência\" &gt; \"me ajude com Pinterest\".</li>\n<li><strong>Diga o contexto do Pinterest 2026.</strong> Sem isso a IA devolve conselho de 2021. Cite: buscador visual, pin fresco, 2:3, título de 40-60 caracteres.</li>\n<li><strong>Peça formato de saída exato.</strong> \"Tabela com 4 colunas: | # | Título | Caracteres | Gatilho |\". Sem formato definido, você recebe texto que não dá para usar.</li>\n<li><strong>Proíba explicitamente o que não quer.</strong> \"Sem encurtador, sem promessa de saúde, sem CAIXA ALTA, sem emoji excessivo.\"</li>\n<li><strong>Peça autocrítica.</strong> \"No final, aponte o pior item da sua própria lista e por quê.\" Isso melhora a qualidade de tudo acima.</li>\n<li><strong>Peça para perguntar antes de inventar.</strong> \"Se faltar informação, PERGUNTE em vez de inventar.\" Reduz muito a alucinação.</li>\n<li><strong>Itere em vez de recomeçar.</strong> Se a saída está 80% boa, responda: <em>\"Melhore os itens 3, 7 e 9 seguindo as regras 2 e 4. Mantenha o resto igual.\"</em></li>\n</ol>\n<p><strong>Três truques extras:</strong></p>\n<ul>\n<li><strong>Peça em inglês o que é técnico</strong> (prompts de imagem, termos de fotografia) e em português o que é copy. Os modelos de imagem respondem muito melhor em inglês.</li>\n<li><strong>Peça 10 e use 3.</strong> Volume de opções vence a busca pela opção perfeita.</li>\n<li><strong>Peça a versão \"crua\" e a versão \"refinada\"</strong> do mesmo texto. Compare.</li>\n</ul>\n<hr>\n<h2>6.1 PROMPT 1 — Máquina de Nichos</h2>\n<p><strong>Quando usar:</strong> Etapa 1, antes de qualquer coisa.</p>\n<p><strong>O que fazer com a saída:</strong> escolher 3 candidatos → validar demanda na busca guiada (cap. 03) → escolher 1.</p>\n<pre class=\"prompt curto\">Atue como estrategista sênior de pesquisa de mercado.\n\nGere 12 nichos de Pinterest monetizáveis em 2026 e que eu consiga produzir\n100% com ferramentas de IA GRÁTIS.\n\nPARA CADA NICHO, ENTREGUE UMA TABELA COM:\n1. Nome do nicho (específico, nunca \"lifestyle\")\n2. Três sub-nichos com intenção real de busca\n3. Demanda estimada no Pinterest (Alta/Média/Baixa) e POR QUÊ\n4. Ticket médio e o caminho de monetização mais provável\n5. Dificuldade de produção com IA (Fácil/Médio/Difícil) e qual ferramenta grátis encaixa\n6. Uma palavra-chave long-tail para atacar no dia 1\n7. O maior risco desse nicho\n\nREGRAS\n- Nunca use palavra genérica: seja hiperespecífico.\n- Escreva para humano; dados apenas quando forem verificáveis.\n- Ordene os 12 do melhor para o pior em oportunidade para um iniciante sem verba.\n- No fim, escolha o TOP 3 e justifique em 2 linhas cada.\n- Depois me pergunte: qual dos 3 eu quero validar hoje?</pre>\n<hr>\n<h2>6.2 PROMPT 2 — Caçador de Ofertas</h2>\n<p><strong>Quando usar:</strong> Etapa 2, com o nicho já escolhido.</p>\n<p><strong>O que fazer com a saída:</strong> validar cada oferta nos 12 critérios (cap. 04) → aprovar 1 principal + 2 secundárias.</p>\n<pre class=\"prompt curto\">Atue como especialista em programas de afiliados e compliance para Pinterest.\n\nListe 10 ofertas concretas (programas de afiliado ou produtos digitais próprios)\nque eu consiga promover no Pinterest neste nicho:\n[NICHO] / [SUB-NICHO] / [PÚBLICO]\n\nPARA CADA OFERTA, ENTREGUE:\n1. Nome da oferta + plataforma onde está cadastrada\n2. Tipo: afiliado (infoproduto/físico/SaaS/recorrente) ou produto próprio\n3. Comissão e condições de pagamento\n4. Janela de cookie\n5. Permite link direto no Pinterest? (Sim/Não/Incerto — e se Não, qual o caminho)\n6. Faixa de preço e comissão por venda em reais\n7. É categoria proibida no Pinterest? (arma, tabaco, adulto, aposta etc.)\n8. Meu veredito honesto: viável / viável com página de destino / evitar\n\nOrdene por (comissão por venda × confiança do produtor) ÷ atrito de produção.\n\nFECHE COM:\n- As 3 melhores para um iniciante\n- As 2 que eu devo evitar e por quê\n- Um bloco único, pronto para copiar, com as perguntas que devo fazer ao\n  gerente de afiliados antes de divulgar</pre>\n<hr>\n<h2>6.3 PROMPT 3 — Máquina de Ângulos ⭐ (o mais importante)</h2>\n<p><strong>Quando usar:</strong> Etapa 3. É este prompt que transforma 1 keyword em 10 pins diferentes.</p>\n<p><strong>O que fazer com a saída:</strong> marcar 3 a 5 ângulos e produzir.</p>\n<pre class=\"prompt curto\">Atue como estrategista de conteúdo viral para Pinterest.\n\nTransforme UMA palavra-chave em 10 ângulos de pin completamente diferentes.\n\nPALAVRA-CHAVE: [SUA KEYWORD LONG-TAIL]\nNICHO: [NICHO]  |  PRODUTO: [OFERTA]  |  PÚBLICO: [PÚBLICO]\n\nPARA CADA ÂNGULO, ENTREGUE:\n1. Nome do formato (Lista / Erro / Transformação / Cola / Mito / Orçamento /\n   Rotina / Comparativo / Caminho do iniciante / Antes-Depois)\n2. Título da ideia do pin, com 5 a 8 palavras (é o texto do overlay)\n3. Gatilho emocional usado (curiosidade / alívio / aspiração / medo de perder\n   dinheiro / status)\n4. Estilo visual que encaixa (light &amp; bright / bold tipográfico / top-down /\n   lifestyle / checklist infográfico / grade numerada / antes-depois / mockup)\n5. A promessa exata que o pin faz\n6. Tipo de página de destino (oferta de afiliado / artigo / produto / isca)\n\nREGRAS\n- Os 10 precisam ser realmente diferentes, não versões reescritas do mesmo.\n- Não use mais de 5 hashtags, sem encurtador, sem promessa de saúde ou renda.\n- Mantenha tudo no MESMO IDIOMA da palavra-chave.\n- Termine com uma tabela ordenando os 10 por facilidade de produção com IA\n  grátis versus potencial de save.</pre>\n<blockquote>💡 <strong>Por que este é o prompt mais importante:</strong> o top 1% dos pins puxa mais de 50% das impressões. Você não acerta o pin vencedor — você <strong>aumenta a chance de produzir ele</strong>. Dez ângulos diferentes é dez bilhetes de loteria no lugar de um.</blockquote>\n<hr>\n<h2>6.4 PROMPT 4 — Fábrica de Pins (1 ângulo → 5 pins completos)</h2>\n<p><strong>Quando usar:</strong> Etapa 5 e Etapa 9, em lote.</p>\n<p><strong>O que fazer com a saída:</strong> cada pin vira uma linha do seu pack; importe no app ou na sua planilha.</p>\n<pre class=\"prompt curto\">Atue como copywriter, especialista em SEO de Pinterest e engenheiro de prompt.\n\nPegue UM ângulo de pin e produza um pacote COMPLETO, pronto para publicar,\ncom 5 pins (o Pinterest premia pin fresco — 5 designs diferentes valem mais\nque 1 design perfeito).\n\nÂNGULO: [ÂNGULO]\nNICHO: [NICHO] | KEYWORD: [KEYWORD] | OFERTA: [OFERTA]\nESTILO VISUAL: [ESTILO]\n\nPARA CADA UM DOS 5 PINS, ENTREGUE EXATAMENTE NESTE FORMULÁRIO:\n\nPIN nº\n- TÍTULO (40 a 60 caracteres, com a palavra-chave, sem promessa mentirosa):\n- DESCRIÇÃO (2 a 4 linhas naturais, keyword + 1 sinônimo, com CTA suave):\n- ALT TEXT (máx. 200 caracteres, descrevendo a imagem):\n- TEXTO DO OVERLAY (5 a 8 palavras, bold, legível no tamanho de thumbnail):\n- PROMPT DA IMAGEM (em inglês, ver regras abaixo):\n- NOME DO ARQUIVO (palavra-chave-com-hifens.png):\n- BOARD SUGERIDO:\n- HASHTAGS (máx. 5):\n\nREGRAS DO PROMPT DE IMAGEM\n- Comece sempre pelo estilo visual: \"[ESTILO]\"\n- Descreva: sujeito, ação, cenário, iluminação, cores, composição e o espaço\n  negativo para o texto.\n- Composição vertical 2:3 (1000x1500). Deixe o terço superior limpo.\n- NUNCA peça texto dentro da imagem (o texto entra depois, no Canva).\n- Sem logo, sem marca real, sem rosto de celebridade, sem mão deformada.\n- Escreva em INGLÊS (os modelos de imagem respondem melhor em inglês),\n  mesmo que a copy esteja em português.\n\nREGRAS\n- Os 5 pins devem diferir em: ângulo do título, composição visual e fundo —\n  não apenas em palavras.\n- Termine com a ordem de publicação recomendada em 5 boards diferentes.</pre>\n<hr>\n<h2>6.5 PROMPT 5 — Validador de Visual</h2>\n<p><strong>Quando usar:</strong> Etapa 4, antes de gerar as imagens.</p>\n<p><strong>O que fazer com a saída:</strong> escolher 1-2 estilos para a conta e usar a ficha de execução no Canva.</p>\n<pre class=\"prompt curto\">Atue como diretor de arte especializado em criativos de Pinterest que convertem,\ncom conhecimento dos dados de benchmark de 2026.\n\nCONTEXTO\nNicho: [NICHO] | Sub-nicho: [SUB] | Público: [PÚBLICO]\nEstilo escolhido: [ESTILO]\nOferta: [OFERTA]\n\nENTREGUE 4 SAÍDAS\n\nSAÍDA 1 · DIAGNÓSTICO DE ESTILO\nDiga se o estilo escolhido combina com este nicho e público. Se não, aponte as\n2 melhores alternativas. Baseie-se em: 2:3 vertical (+45% impressões, +22%\ncliques vs quadrado); overlay de 5-8 palavras em bold (+110% cliques vs sem\ntexto); fundo claro/quente (+38% saves); pessoa em contexto (+14% impressões);\nborda grossa (-9% impressões).\n\nSAÍDA 2 · 3 PROMPTS DE IMAGEM (em inglês, prontos para colar)\nTrês abordagens visuais diferentes para a MESMA mensagem. Cada prompt com:\nsujeito + ação + cenário + direção da luz + paleta + composição + onde fica o\nespaço negativo + proporção 2:3 + \"no text, no logos, no watermark\" + termos\nde qualidade. Cada um com 60 a 90 palavras.\n\nSAÍDA 3 · FICHA DE EXECUÇÃO NO CANVA\n- Par de fontes gratuitas no Canva\n- Paleta exata em hexadecimal (fundo, texto, destaque)\n- Tamanho relativo da caixa de texto e margem de segurança (8-10%)\n- 3 regras de consistência para 50 pins\n\nSAÍDA 4 · LISTA DE MORTE\n6 erros visuais que fariam esses pins fracassarem NESTE nicho.\n\nSeja opinativo: escolha um favorito dos três e defenda em 2 linhas.</pre>\n<hr>\n<h2>6.6 PROMPT 6 — Laboratório de Títulos</h2>\n<p><strong>Quando usar:</strong> quando um pin não performa e você quer testar variações.</p>\n<p><strong>O que fazer com a saída:</strong> publicar o top 3 como pins frescos diferentes.</p>\n<pre class=\"prompt curto\">Atue como redator de headlines para Pinterest.\n\nEscreva 20 títulos diferentes para o MESMO pin e depois ranqueie.\n\nCONTEXTO: [NICHO] | KEYWORD: [KEYWORD] | OFERTA: [OFERTA]\nTítulo atual: [TÍTULO ATUAL]\n\nREGRAS PARA CADA TÍTULO\n- 40 a 60 caracteres\n- Contém a palavra-chave principal de forma natural\n- Promete benefício concreto ou abre lacuna de curiosidade — nunca mente\n- Sem CAIXA ALTA, sem excesso de emoji (máx. 1), sem clickbait de saúde/renda\n\nSAÍDA: tabela | # | Título | Caracteres | Gatilho usado |\n\nDEPOIS:\n1. Top 5 com justificativa de uma linha cada\n2. Para o nº 1: 3 descrições alternativas de 2-4 linhas (CTAs diferentes)\n3. O pior título dos 20 e por que fracassaria\n4. 5 palavras-chave long-tail relacionadas para os próximos pins</pre>\n<hr>\n<h2>6.7 PROMPT 7 — Página de Destino / Artigo</h2>\n<p><strong>Quando usar:</strong> Etapa 7. É aqui que o link de afiliado entra — e o aviso de afiliado é obrigatório.</p>\n<p><strong>O que fazer com a saída:</strong> publicar no seu blog/Notion/Gumroad e marcar <code>[INSERIR LINK AQUI]</code>.</p>\n<pre class=\"prompt curto\">Atue como redator SEO e copywriter de conversão.\n\nEscreva uma página de destino (ou artigo) completa que receba tráfego do\nPinterest e converta, para esta oferta.\n\nCONTEXTO: [NICHO] | KEYWORD: [KEYWORD] | OFERTA: [PRODUTO]\nPÚBLICO: [PÚBLICO]\nLink de afiliado (colado manualmente depois): [LINK]\n\nESTRUTURA OBRIGATÓRIA\n1. H1 com a palavra-chave principal (a MESMA promessa do pin)\n2. AVISO DE AFILIADO visível ANTES do primeiro link de afiliado\n3. Introdução curta (3-4 linhas) confirmando que o leitor está no lugar certo\n4. 4 a 6 seções H2 respondendo às dúvidas reais do público\n5. Uma tabela comparativa ou lista de critérios\n6. Prós e contras honestos da oferta\n7. FAQ com 5 perguntas (H3 + resposta de 2-3 linhas)\n8. Um único CTA final, claro\n9. Espaço marcado EXATAMENTE como [INSERIR LINK AQUI]\n\nREGRAS\n- Escreva como humano: parágrafos curtos, sem enrolação.\n- Sem promessa irreal. Sem depoimento pessoal falso.\n- 800 a 1200 palavras.\n- Termine com 5 títulos de Pinterest para divulgar esta página.</pre>\n<hr>\n<h2>6.8 PROMPT 8 — Roteiro de Vídeo Pin</h2>\n<p><strong>Quando usar:</strong> Etapa 6, para os 20-30% de vídeo do seu mix.</p>\n<pre class=\"prompt curto\">Atue como diretor de vídeos curtos especializado em video pins do Pinterest.\n\nCONTEXTO: [NICHO] | KEYWORD: [KEYWORD] | OFERTA: [OFERTA] | ÂNGULO: [ÂNGULO]\n\nENTREGUE UM ROTEIRO PLANO A PLANO para um vídeo vertical (1080x1920) de 6 a 15\nsegundos SEM narração (a maioria assiste sem som):\n\n- 0-2s: GANCHO — o que precisa estar na tela para parar o scroll\n- 2-6s: valor / processo / transformação\n- 6-12s: a recompensa ou o \"antes/depois\"\n- últimos 1-2s: cartela de CTA\n\nENTREGUE TAMBÉM\n1. Textos de overlay de cada plano (máx. 6 palavras, bold, alto contraste)\n2. Sugestão de trilha por clima (estilo royalty-free)\n3. Como produzir cada plano DE GRAÇA (qual ferramenta, qual editor grátis)\n4. Os 3 prompts de imagem (em inglês) para os quadros-chave\n5. Legenda + título + 5 hashtags deste video pin\n6. Instrução para a imagem de capa (o quadro do feed — precisa ter o overlay)</pre>\n<hr>\n<h2>6.9 PROMPT 9 — Pin em Carrossel (5 slides)</h2>\n<p><strong>Quando usar:</strong> Etapa 6, para variação de formato (10% do mix).</p>\n<pre class=\"prompt curto\">Atue como estrategista de carrossel para Pinterest.\n\nDesenhe um carrossel de 5 slides para esta oferta.\nCONTEXTO: [NICHO] | KEYWORD: [KEYWORD] | OFERTA: [OFERTA]\n\nPARA CADA SLIDE:\n- Número e função na história (gancho → contexto → prova → objeção → CTA)\n- Manchete do slide (máx. 6 palavras)\n- Texto de apoio (máx. 15 palavras)\n- Descrição visual + prompt de imagem em inglês (2:3, 1000x1500)\n- Por que este slide faz a pessoa deslizar para o próximo\n\nALÉM DISSO:\n1. Título do carrossel (40-60 car.) e descrição do pin inteiro\n2. Regra de consistência para os 5 slides parecerem da mesma família\n3. Como montar no Canva grátis, passo a passo (máx. 10 passos)\n4. 5 ganchos alternativos para o slide 1\n\nO slide 5 precisa ter o CTA. Nunca coloque o link dentro da imagem.</pre>\n<hr>\n<h2>6.10 PROMPT 10 — Produto Digital Próprio</h2>\n<p><strong>Quando usar:</strong> Etapa 9, depois que o fluxo de afiliado já está rodando. É a via de margem 100%.</p>\n<pre class=\"prompt curto\">Atue como estrategista de produto digital.\n\nDesenhe um produto digital que eu consiga criar HOJE com IA grátis e vender\npelo Pinterest com margem de ~100%.\nCONTEXTO: [NICHO] | [SUB-NICHO] | [PÚBLICO]\n\nENTREGUE\n1. Três ideias: um printable, um template e um mini-ebook. Para cada: nome\n   exato, o que resolve, faixa de preço (R$ 27 a R$ 97) e a promessa de\n   \"valor imediato\".\n2. Escolha a melhor e detalhe:\n   - Sumário completo / lista de páginas\n   - O que eu gero com IA (texto) e o que eu desenho no Canva\n   - Os prompts exatos, na ordem, para produzir cada parte de graça\n   - Configuração de entrega na Gumroad ou Payhip (máx. 10 passos)\n   - A escada de preço: isca grátis → produto principal → combo\n3. Um plano de 20 pins para vender (5 ângulos × 4 designs)\n4. As 5 descrições de Pinterest que mais convertem em venda de produto\n5. Higiene jurídica: avisos a incluir, o que não posso prometer e como\n   escrever uma licença simples para o comprador\n\nTudo precisa ser factível em um dia de trabalho. Sem plágio: escreva do zero.</pre>\n<hr>\n<h2>6.11 PROMPT 11 — Calendário de 30 Dias</h2>\n<pre class=\"prompt curto\">Atue como planejador de conteúdo de Pinterest.\n\nMonte um calendário de publicação de 30 dias.\nCONTEXTO: [NICHO] | [KEYWORD] | Ofertas: [1 principal + 2 secundárias]\n\nENTREGUE UMA TABELA:\n| Dia | Título do pin | Ângulo | Formato | Board | Destino | Pronto? |\n\nREGRAS\n- 3 a 5 pins por dia. Comece com 3/dia na semana 1 e escale.\n- Nunca 2 pins do mesmo link no mesmo board no mesmo dia.\n- Mínimo 72h entre pins do mesmo link.\n- 70% evergreen e 30% ofertas/afiliado.\n- Sazonal publicado 30-60 dias antes do pico.\n- Mix: 60-70% estático, 20-30% vídeo, resto carrossel.\n- Cada semana tem 1 dia de manutenção (escrever em lote) e 1 de revisão.\n\nALÉM DISSO:\n1. Fluxo de produção em blocos de 1 hora (quantos pins por bloco)\n2. Rotação entre 5-10 boards para nenhum parecer spam\n3. O que fazer num dia sem tempo: a ação mínima viável</pre>\n<hr>\n<h2>6.12 PROMPT 12 — Diagnóstico de Funil</h2>\n<p><strong>Quando usar:</strong> Todo fim de mês, e obrigatoriamente quando algo travar.</p>\n<pre class=\"prompt curto\">Atue como analista de crescimento de Pinterest. Diagnostique meu funil.\n\nMEUS NÚMEROS (últimos 30 dias)\nimpressões: ___ | saves: ___ | cliques de saída: ___ | sessões: ___ |\nvendas: ___ | receita: R$ ___\n\nCONTEXTO: [NICHO] | [KEYWORD] | [OFERTA] | [ESTILO]\n\nTAREFA\n1. Calcule CTR (cliques/impressões), taxa de save por 1k, conversão\n   (vendas/cliques) e receita por 1.000 impressões.\n2. Compare com: CTR de saída 0,3%-1%; save 5+/1k em estático; conversão\n   0,5%-2%; vídeo +185% impressões mas 3x menos cliques que estático.\n3. Aponte O MAIOR vazamento (um só) e ranqueie os outros.\n4. Para cada vazamento, 3 correções concretas por ordem de impacto/esforço.\n5. Diga claramente: ESCALAR, PIVOTAR ou MATAR? Justifique.\n6. Plano exato da próxima semana: o que produzir, quantos, formato, destino.\n7. Os 3 números que devo acompanhar semanalmente e qual valor me faria\n   comemorar versus entrar em pânico.</pre>\n<hr>\n<h2>6.13 PROMPT 13 — Perfil e Boards</h2>\n<pre class=\"prompt curto\">Atue como otimizador de perfil de Pinterest.\n\nMonte a estrutura inteira da minha conta.\nCONTEXTO: [NICHO] | [PÚBLICO] | [MARCA]\n\nENTREGUE\n1. Nome da conta (máx. 40 caracteres) combinando marca + palavra-chave\n2. Bio (máx. 160 caracteres) com palavras-chave e uma promessa clara\n3. 8 boards: título exato (palavra-chave primeiro), descrição (2 linhas com\n   keywords) e o que entra em cada um\n4. Ordem dos boards (mais importante primeiro) e qual destacar\n5. Quais 3 boards eu NÃO devo criar (boards-armadilha que diluem a conta)\n6. Instruções para reivindicar (claim) o site e por que importa\n7. Regras de foto de perfil e capa para parecer confiável no nicho\n8. Checklist de 10 itens antes de publicar o primeiro pin</pre>\n<hr>\n<h2>6.14 PROMPT 14 — Auditoria de Compliance</h2>\n<p><strong>Quando usar:</strong> antes de escalar e sempre que receber um aviso.</p>\n<pre class=\"prompt curto\">Atue como auditor de compliance para marketing de afiliados no Pinterest.\nAudite meu conteúdo antes de eu escalar.\n\nMATERIAL PARA AUDITAR\nTítulo: [TÍTULO]\nDescrição: [DESCRIÇÃO]\nLink de destino: [LINK]\nCategoria da oferta: [CATEGORIA]\n\nAUDITE CONTRA ESTAS REGRAS\n- Link de afiliado é permitido, MAS deve estar revelado e agregar valor original.\n- Encurtadores (bit.ly, tinyurl) são bloqueados/marcados.\n- Sem padrão repetitivo e spam de afiliado; volume diário importa.\n- Alguns programas proíbem link direto a partir de redes (Etsy é o exemplo).\n- Categorias proibidas: arma, tabaco, conteúdo adulto, aposta, alegação\n  enganosa de saúde ou de finanças.\n- Transparência publicitária: a relação comercial deve estar clara e perto do link.\n\nENTREGUE\n1. Tabela de risco: | Regra | Situação (OK/Risco/Bloqueio) | Correção exata |\n2. Uma descrição reescrita que seja compliant E ainda converta\n3. A frase exata de aviso para o pin e para a página de destino\n4. Lista de tudo que devo parar de fazer imediatamente\n5. Autoauditoria de 10 perguntas para rodar todo mês\n6. O que fazer se a conta receber um aviso: plano de recuperação passo a passo</pre>\n<hr>\n<h2>6.15 PROMPT 15 — Pacote de 10 Prompts de Imagem</h2>\n<p><strong>Quando usar:</strong> Etapa 4, para produzir o banco de imagens de uma vez.</p>\n<pre class=\"prompt curto\">Atue como engenheiro de prompt especializado em imagens de Pinterest geradas\npor ferramentas de IA grátis.\n\nCONTEXTO: [NICHO] | [KEYWORD] | ESTILO VISUAL: [ESTILO]\n\nEscreva 10 prompts de imagem para colar em gerador grátis\n(Bing Image Creator / Microsoft Designer, Ideogram, Leonardo, Adobe Firefly).\n\nPARA CADA PROMPT:\n1. O prompt completo em INGLÊS, 60 a 90 palavras, sempre terminando com:\n   \"vertical 2:3 composition, clean top third for text overlay, no text,\n   no watermark, no logos, no distorted hands, high resolution\"\n2. Por que essa imagem vence uma genérica neste nicho\n3. Qual ferramenta grátis vai lidar melhor com ela e por quê\n\nMATRIZ DE VARIEDADE — cubra: 2 close/macro, 2 plano aberto, 2 com pessoa em\ncontexto lifestyle (sem rosto de celebridade), 2 de processo/passo a passo,\n2 aspiracionais/\"depois\".\n\nNunca peça marca reconhecível, pessoa real ou personagem protegido.\nAjuste luz e paleta ao estilo escolhido para os 10 parecerem da mesma conta.</pre>\n<hr>\n<h2>6.16 Prompts de emergência (bônus)</h2>\n<p><strong>Quando o pin não performa:</strong></p>\n<pre class=\"prompt curto\">Analise este pin e me diga por que ele não performou. Contexto: [MÉTRICAS].\nConsidere: proporção 2:3, contraste do overlay (5-8 palavras), clareza do foco\nvisual, alinhamento entre promessa do título e destino, presença de keyword no\ntítulo/descrição/nome do arquivo. Entregue: os 3 problemas mais prováveis, em\nordem de probabilidade, e a correção exata de cada um.</pre>\n<p><strong>Quando você tem 15 minutos e precisa publicar algo:</strong></p>\n<pre class=\"prompt curto\">Me dê 3 pins de emergência para publicar hoje em 15 minutos de execução, usando\napenas: 1 imagem do meu banco, o template do Canva que eu já tenho e o texto\ngerado por IA. Contexto: [NICHO] | [KEYWORD] | [OFERTA]. Entregue título,\ndescrição, overlay e board para cada um.</pre>\n<p><strong>Quando quer entrar em um idioma novo (inglês/espanhol):</strong></p>\n<pre class=\"prompt curto\">Pegue estas 10 copies em português e adapte para o inglês (não traduza ao pé da\nletra — localize). Regras: título de 40-60 caracteres, keyword em inglês com\nvolume de busca, descrição natural de 2-4 linhas, 5 hashtags locais. Explique\nbrevemente cada adaptação que você fez além da tradução literal.\n[COLE AS 10 COPIES]</pre>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"07-ferramentas-gratis.md\">07 · Ferramentas Grátis e Integrações</a></p>"},{"arquivo":"07-ferramentas-gratis.md","titulo":"Ferramentas Grátis e Integrações — o stack de custo zero","html":"<h1>07 · Ferramentas Grátis e Integrações — o stack de custo zero</h1>\n<hr>\n<h2>7.1 O stack completo (R$ 0)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Etapa</th><th>Ferramenta</th><th>O que dá no plano grátis</th><th>Limitação honesta</th></tr></thead><tbody><tr><td><strong>Texto / estratégia</strong></td><td>ChatGPT, Gemini, Claude</td><td>Chat ilimitado com limites de mensagem</td><td>Modelos mais fortes limitam uso por janela de tempo</td></tr><tr><td><strong>Imagem 2:3</strong></td><td>Bing Image Creator / Microsoft Designer</td><td>Gerações lentas praticamente ilimitadas + boosts semanais</td><td>⚠️ Termos do Designer de consumidor restringem uso comercial — confira antes de monetizar</td></tr><tr><td><strong>Imagem 2:3</strong></td><td>Leonardo AI</td><td>~150 tokens/dia (≈30-50 imagens)</td><td>Saída fica pública no plano grátis</td></tr><tr><td><strong>Imagem 2:3</strong></td><td>Ideogram</td><td>~10 a 25/dia (fila lenta)</td><td>Fila lenta; melhor para texto dentro da imagem</td></tr><tr><td><strong>Imagem 2:3</strong></td><td>Adobe Firefly</td><td>~25 créditos/mês</td><td>Segurança jurídica máxima, volume baixo</td></tr><tr><td><strong>Design do pin</strong></td><td>Canva grátis</td><td>Designs ilimitados, milhares de templates</td><td>Recursos de IA premium são pagos</td></tr><tr><td><strong>Vídeo</strong></td><td>CapCut desktop</td><td>Editor completo, exporta em 1080p/4K sem marca d'água</td><td>Efeitos premium são pagos</td></tr><tr><td><strong>Vídeo</strong></td><td>Canva grátis</td><td>Editor simples, templates de vídeo</td><td>Menos controle fino</td></tr><tr><td><strong>Vídeo com IA</strong></td><td>Kling AI</td><td>~66 créditos/dia (~3-6 clipes de 5s)</td><td>Marca d'água e <strong>sem uso comercial</strong> no grátis</td></tr><tr><td><strong>Vídeo com IA</strong></td><td>Hailuo / MiniMax</td><td>~3-5 gerações/dia</td><td>Marca d'água e sem uso comercial no grátis</td></tr><tr><td><strong>Agendamento</strong></td><td>Agendador nativo do Pinterest</td><td>Até 10 pins na fila; 14 dias (desktop) / 30 dias (app)</td><td>Fila pequena</td></tr><tr><td><strong>Agendamento</strong></td><td>Metricool</td><td>~20 publicações/mês</td><td>Limite mensal baixo</td></tr><tr><td><strong>Agendamento</strong></td><td>Buffer</td><td>Até 10 posts na fila por canal</td><td>Pouco recurso específico de Pinterest</td></tr><tr><td><strong>Pesquisa</strong></td><td>Pinterest Trends</td><td>Grátis, sem login</td><td>Só dados dos EUA na maior parte</td></tr><tr><td><strong>Pesquisa</strong></td><td>Busca guiada do Pinterest</td><td>Grátis e o mais útil</td><td>Manual</td></tr><tr><td><strong>Página de destino</strong></td><td>Notion público, Gumroad, Payhip, Blogger, Substack</td><td>Grátis</td><td>Limites de customização</td></tr><tr><td><strong>Venda de digital</strong></td><td>Gumroad, Payhip, Ko-fi</td><td>Grátis (taxa por venda)</td><td>Taxa sobre cada venda</td></tr><tr><td><strong>Analytics</strong></td><td>Pinterest Analytics (conta business)</td><td>Nativo e grátis</td><td>Janela limitada de histórico</td></tr><tr><td><strong>Organização</strong></td><td>Este app (PinMind) + planilha</td><td>Ilimitado</td><td>Salva no seu navegador</td></tr></tbody></table></div>\n<hr>\n<h2>7.2 O fluxo de trabalho em 1 hora (o \"bloco de produção\")</h2>\n<p>Este é o processo que transforma IA grátis em 15-20 pins por sessão:</p>\n<pre class=\"prompt curto\">┌─ 0-10 min · PLANEJAMENTO ────────────────────────────────┐\n│ Abra o app na etapa 9, escolha a ficha da semana.        │\n│ Defina: 1 oferta principal + 3 ângulos.                   │\n└──────────────────────────────────────────────────────────┘\n┌─ 10-20 min · TEXTO ──────────────────────────────────────┐\n│ Prompt 4 (Fábrica de Pins) no ChatGPT → 5 pins por ângulo │\n│ = 15 pins com título, descrição, alt, overlay, arquivo    │\n└──────────────────────────────────────────────────────────┘\n┌─ 20-40 min · IMAGEM ─────────────────────────────────────┐\n│ Cole cada prompt de imagem no gerador grátis.             │\n│ Gere 2-3 variações por prompt. Salve as 15 melhores.      │\n└──────────────────────────────────────────────────────────┘\n┌─ 40-55 min · DESIGN ─────────────────────────────────────┐\n│ Canva: template mestre → duplicar → trocar imagem+texto.  │\n│ Exportar PNG. Renomear com a keyword.                     │\n└──────────────────────────────────────────────────────────┘\n┌─ 55-60 min · PUBLICAR ───────────────────────────────────┐\n│ Publicar/agendar 5 pins. Colar o link na mão em cada um.  │\n│ Registrar o que foi publicado.                            │\n└──────────────────────────────────────────────────────────┘</pre>\n<p><strong>Quantidade realista:</strong> 15 pins em 1 hora por sessão. Três sessões por semana = 45 pins/semana = ~180 pins/mês. É exatamente o volume necessário para o acervo que rende no mês 3.</p>\n<hr>\n<h2>7.3 Integrações e APIs (para quem quer ir além)</h2>\n<h3>7.3.1 Pinterest API v5 — o que é possível e o que não é</h3>\n<p>A API do Pinterest é <strong>gratuita</strong>, mas tem dois degraus:</p>\n<div class=\"rolagem\"><table><thead><tr><th></th><th><strong>Trial access</strong></th><th><strong>Standard access</strong></th></tr></thead><tbody><tr><td>Como obter</td><td>Aprovação simples do app em <code>developers.pinterest.com</code></td><td>Requer revisão com <strong>vídeo demonstrando o fluxo OAuth</strong></td></tr><tr><td>Pins e boards criados</td><td>Ficam <strong>visíveis só para você</strong> (entidades sandbox)</td><td>Públicos, como qualquer pin</td></tr><tr><td>Limite</td><td>1.000 requisições/dia por app</td><td>100 requisições/s por usuário</td></tr><tr><td>Criação de pins (<code>org_write</code>)</td><td>300/dia</td><td>100/minuto</td></tr><tr><td>Sandbox</td><td><code>api-sandbox.pinterest.com/v5</code> (não cria video pins)</td><td>—</td></tr></tbody></table></div>\n<p><strong>Escopos necessários para criar um pin:</strong> <code>boards:read</code>, <code>boards:write</code>, <code>pins:read</code>, <code>pins:write</code>.</p>\n<p><strong>Token:</strong> dura 30 dias com refresh de 60 dias. Exige OAuth 2.0.</p>\n<p><strong>Exemplo de criação de pin (imagem):</strong></p>\n<pre class=\"prompt curto\">curl -X POST \"https://api.pinterest.com/v5/pins\" \\\n  -H \"Authorization: Bearer SEU_TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"board_id\": \"ID_DO_BOARD\",\n    \"title\": \"Organização de Cozinha Pequena em 6 Passos\",\n    \"description\": \"Passo a passo para organizar cozinha pequena sem gastar muito. Contém link de afiliado.\",\n    \"alt_text\": \"Cozinha pequena organizada com potes empilháveis e prateleira suspensa\",\n    \"link\": \"https://sua-pagina.com/organizacao-cozinha\",\n    \"media_source\": { \"source_type\": \"image_url\", \"url\": \"https://.../pin.jpg\" }\n  }'</pre>\n<h3>⛔ A regra que você PRECISA conhecer antes de automatizar</h3>\n<p>As diretrizes de desenvolvedor do Pinterest proíbem aplicações que <strong>permitem ao usuário final iniciar ações automaticamente, sem considerar especificamente cada ação</strong>. Na prática:</p>\n<ul>\n<li>❌ Script que publica 50 pins sozinho, sem revisão → <strong>viola os termos</strong></li>\n<li>✅ Ferramenta que monta o pin e você aprova um por um → <strong>permitido</strong></li>\n</ul>\n<p><strong>Conclusão pragmática:</strong> para 95% das pessoas, <strong>publicar pela interface do Pinterest é mais rápido, mais seguro e mais barato</strong> do que construir integração. Use a API apenas se você tiver um volume que justifique o trabalho de engenharia — e mesmo assim, com revisão humana pin a pin.</p>\n<h3>7.3.2 Quando a API realmente vale a pena</h3>\n<div class=\"rolagem\"><table><thead><tr><th>Cenário</th><th>Vale a pena?</th><th>Alternativa</th></tr></thead><tbody><tr><td>Publicar 3-5 pins/dia sozinho</td><td>❌ Não</td><td>Interface + agendador nativo</td></tr><tr><td>Agendar 30 pins de uma vez</td><td>❌ Não</td><td>Metricool grátis / Buffer grátis</td></tr><tr><td>Gerenciar Pinterest de 5 clientes</td><td>✅ Sim</td><td>API + aprovação humana por pin</td></tr><tr><td>Puxar analytics automaticamente</td><td>✅ Talvez</td><td>API de analytics ou exportar CSV nativo</td></tr><tr><td>Publicar 200 pins/dia</td><td>❌ Violaria os termos</td><td>Não faça</td></tr></tbody></table></div>\n<h3>7.3.3 Outras integrações úteis</h3>\n<div class=\"rolagem\"><table><thead><tr><th>Integração</th><th>Para quê</th><th>Como</th></tr></thead><tbody><tr><td><strong>Rich Pins</strong></td><td>Puxa metadados do seu site automaticamente</td><td>Reivindicar domínio + validar com o Rich Pin Validator</td></tr><tr><td><strong>Google Analytics / GA4</strong></td><td>Ver o tráfego que vem do Pinterest e onde ele converte</td><td>UTM: <code>?utm_source=pinterest&amp;utm_medium=organic&amp;utm_campaign=nome_do_pin</code></td></tr><tr><td><strong>Webhook do Gumroad/Payhip</strong></td><td>Saber na hora que vendeu</td><td>Painel do produto → notificações</td></tr><tr><td><strong>Zapier/Make (grátis limitado)</strong></td><td>Ligar venda → Google Sheets → notificação</td><td>Automação simples de 2 passos</td></tr><tr><td><strong>API de IA (opcional)</strong></td><td>Gerar texto direto pelo app PinMind</td><td>Aba Integrações do app</td></tr></tbody></table></div>\n<h3>7.3.4 UTMs: como saber qual pin vendeu</h3>\n<p>Cole sempre na URL de destino:</p>\n<pre class=\"prompt curto\">https://sua-pagina.com/organizacao-cozinha?utm_source=pinterest&amp;utm_medium=organic&amp;utm_campaign=org-cozinha-v1</pre>\n<p>Troque <code>utm_campaign</code> a cada pin/pack. Assim você descobre <strong>qual pin</strong> trouxe a venda — não só \"o Pinterest\". Sem isso, você voa às cegas.</p>\n<hr>\n<h2>7.4 O que NÃO vale a pena (economize seu tempo)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Tentação</th><th>Por que evitar</th></tr></thead><tbody><tr><td>Comprar seguidores</td><td>Seguidores não influenciam distribuição (97% das buscas são não-marcadas)</td></tr><tr><td>Ferramenta paga de \"pins ilimitados\"</td><td>Os limites do Pinterest são o gargalo, não a ferramenta</td></tr><tr><td>Bot de auto-follow / auto-comment</td><td>Padrão de spam → limitação de conta</td></tr><tr><td>Encurtador de link</td><td>Bloqueado/marcado</td></tr><tr><td>Gerador de \"pin automático em massa\"</td><td>Gera criativo repetitivo = o oposto de pin fresco</td></tr><tr><td>Comprar lista de \"melhores produtos\"</td><td>O que funciona em 2026 muda em 2 meses</td></tr><tr><td>Curso de Pinterest de R$ 2.000 antes de faturar</td><td>Você tem a Bíblia e o app. Execute 90 dias primeiro</td></tr></tbody></table></div>\n<hr>\n<h2>7.5 Ordem de aquisição de ferramentas (se você for evoluir)</h2>\n<p>Quando o projeto começar a dar dinheiro, esta é a ordem de investimento com melhor retorno:</p>\n<div class=\"rolagem\"><table><thead><tr><th>Prioridade</th><th>Investimento</th><th>Quando</th><th>Por quê</th></tr></thead><tbody><tr><td>6º</td><td>Domínio próprio (~R$ 40/ano)</td><td>Ao criar o blog</td><td>Credibilidade + claim + e-mail</td></tr><tr><td>5º</td><td>Hospedagem de blog (~R$ 15/mês)</td><td>Ao passar de 5 páginas de destino</td><td>Você deixa de depender de terceiros</td></tr><tr><td>4º</td><td>Canva Pro (~R$ 40/mês)</td><td>Ao passar de 100 pins</td><td>Redimensionamento e recursos de IA</td></tr><tr><td>3º</td><td>Gerador de imagem pago</td><td>Quando o grátis limitar volume</td><td>Consistência e velocidade</td></tr><tr><td>2º</td><td>Agendador (Tailwind/Metricool)</td><td>Ao passar de 5 pins/dia</td><td>Constância sem esforço diário</td></tr><tr><td>1º</td><td><strong>API de IA (US$ 5-20/mês)</strong></td><td><strong>Assim que houver receita</strong></td><td>Elimina o copiar-e-colar: maior ganho de tempo por real gasto</td></tr></tbody></table></div>\n<p>⚠️ <strong>Só invista depois que houver receita.</strong> Ferramenta paga antes de faturamento é o erro mais comum e mais caro de quem começa.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"08-compliance-e-risco.md\">08 · Compliance e Risco</a></p>"},{"arquivo":"08-compliance-e-risco.md","titulo":"Compliance e Risco — o que derruba contas (e como não perder a sua)","html":"<h1>08 · Compliance e Risco — o que derruba contas (e como não perder a sua)</h1>\n<blockquote>Este capítulo parece chato. É o que separa quem fatura por 5 anos de quem perde a conta no mês 3.</blockquote>\n<hr>\n<h2>8.1 A regra base do Pinterest sobre afiliados</h2>\n<p>O Pinterest <strong>permite</strong> conteúdo de afiliado. A formulação oficial vai nesta direção:</p>\n<blockquote><em>\"Conteúdo de afiliado deve ser original e agregar valor único para os Pinners. Seja transparente sobre a natureza comercial do seu conteúdo e sobre seus links e o comportamento deles. Alguns serviços de encurtamento não são suportados — se o link do seu Pin estiver bloqueado, você pode editá-lo.\"</em></blockquote>\n<p>Traduzindo em regras operacionais:</p>\n<div class=\"rolagem\"><table><thead><tr><th>✅ Permitido</th><th>❌ Proibido / penalizado</th></tr></thead><tbody><tr><td>Link de afiliado no campo de destino do pin</td><td>Encurtadores (bit.ly, tinyurl, cutt.ly)</td></tr><tr><td>Link de afiliado em descrição, com aviso</td><td>Afiliado sem revelar a relação comercial</td></tr><tr><td>Pins de afiliado balanceados com conteúdo útil</td><td>Padrão repetitivo e em massa de pins promocionais</td></tr><tr><td>Amazon, Hotmart, Kiwify, ShareASale, ClickBank etc.</td><td>Página de destino com excesso de anúncios</td></tr><tr><td>Link para o seu blog com afiliados dentro</td><td>Produtos de categoria proibida</td></tr><tr><td>Comparativos e resenhas</td><td>Alegações enganosas sobre o produto</td></tr></tbody></table></div>\n<h3>A regra do 80/20</h3>\n<p><strong>80% conteúdo útil e não promocional / 20% pins de oferta direta.</strong> Contas que só empurram produto são penalizadas. Isso não é etiqueta — é mecanismo de distribuição.</p>\n<hr>\n<h2>8.2 Transparência: a exigência legal (não é opcional)</h2>\n<p>Tanto as diretrizes de plataforma quanto as regras de publicidade (FTC nos EUA, e o princípio de transparência do CDC no Brasil) exigem que a relação comercial esteja <strong>clara e perto do link</strong>.</p>\n<h3>Modelos prontos (copie)</h3>\n<p><strong>Na descrição do pin:</strong></p>\n<pre class=\"prompt curto\">Este conteúdo contém link de afiliado. Se você comprar por ele, eu posso\nreceber uma comissão, sem nenhum custo extra para você. #afiliado #ad</pre>\n<p><strong>Na página de destino (antes do primeiro link):</strong></p>\n<pre class=\"prompt curto\">AVISO DE PUBLICIDADE\nEsta página contém links de afiliado. Se você comprar através deles, eu posso\nreceber uma comissão sem custo adicional para você. Isso não influencia o preço\nque você paga.\n\nComo associado(a) [Amazon/plataforma], eu ganho por compras qualificadas.</pre>\n<p><strong>Em inglês:</strong></p>\n<pre class=\"prompt curto\">This post contains affiliate links. If you buy through them, I may earn a\ncommission at no extra cost to you. #affiliate #ad\n\nAs an Amazon Associate I earn from qualifying purchases.</pre>\n<blockquote>⚠️ <strong>Detalhe técnico que muita gente erra:</strong> o aviso precisa estar <strong>antes</strong> do link, não escondido no rodapé, e não pode ser fonte minúscula cinza-claro. Se for preciso rolar para achá-lo, não conta como aviso.</blockquote>\n<hr>\n<h2>8.3 Os bloqueios absolutos (isso derruba ou limita a conta)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>❌ Nunca faça</th><th>Consequência real</th></tr></thead><tbody><tr><td>Produtos de <strong>arma, munição, tabaco, vape, álcool destilado</strong></td><td>Remoção + possível suspensão</td></tr><tr><td>Conteúdo <strong>adulto</strong> ou sexualmente sugestivo</td><td>Suspensão da conta</td></tr><tr><td><strong>Aposta / jogos de azar</strong> não licenciados</td><td>Suspensão</td></tr><tr><td><strong>Suplementos com alegação de cura</strong> (\"cura diabetes\", \"elimina o câncer\")</td><td>Remoção + risco jurídico</td></tr><tr><td><strong>Promessa de renda</strong> (\"ganhe R$ 5.000 por semana garantido\")</td><td>Remoção + risco jurídico</td></tr><tr><td><strong>Antes/depois</strong> de emagrecimento extremo ou \"resultado em 3 dias\"</td><td>Remoção</td></tr><tr><td><strong>Encurtador de link</strong></td><td>Link bloqueado, pin marcado como spam</td></tr><tr><td><strong>Marca d'água</strong> de TikTok/Instagram em vídeo</td><td>Redução de alcance</td></tr><tr><td><strong>Cópia 1:1</strong> de criativo de concorrente</td><td>Denúncia de DMCA</td></tr><tr><td><strong>Automação</strong> que publica sem consideração individual</td><td>Violação de diretriz de desenvolvedor</td></tr><tr><td>Publicar o <strong>mesmo link</strong> dezenas de vezes por dia</td><td>Filtro de spam</td></tr><tr><td><strong>Mais de 150 links de afiliado/dia</strong></td><td>Padrão de spam automatizado</td></tr></tbody></table></div>\n<hr>\n<h2>8.4 Links: as 6 regras de ouro</h2>\n<ol>\n<li><strong>Nunca use encurtador.</strong> Cole a URL completa do afiliado. Se quiser rastrear, use parâmetros UTM na sua própria página — isso é permitido.</li>\n<li><strong>Confirme se o programa permite link direto em redes sociais.</strong> Alguns exigem intermediação (Etsy é o caso clássico: os termos de afiliado não permitem postar link direto no Pinterest — é preciso um blog/post no meio).</li>\n<li><strong>Teste todo link em janela anônima</strong> antes de publicar. Link quebrado derruba a confiança do domínio.</li>\n<li><strong>Um destino por pin.</strong> Não coloque 3 links diferentes na mesma descrição.</li>\n<li><strong>A promessa do pin tem que casar com a página.</strong> Pin sobre \"organização de cozinha\" que leva para \"curso de marketing\" = queda de relevância.</li>\n<li><strong>Mantenha 72h de intervalo</strong> entre pins que apontam para a mesma URL.</li>\n</ol>\n<hr>\n<h2>8.5 Imagens e IA: o que você pode usar comercialmente</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Ferramenta</th><th>Uso comercial no plano grátis</th><th>Observação</th></tr></thead><tbody><tr><td><strong>Adobe Firefly</strong> (modelos próprios)</td><td>✅ Sim</td><td>Treinado em conteúdo licenciado — o mais seguro juridicamente</td></tr><tr><td><strong>Ideogram</strong></td><td>✅ Sim (confirme os termos atuais)</td><td>Verifique restrições de conteúdo</td></tr><tr><td><strong>Leonardo AI</strong></td><td>✅ Sim, licença não exclusiva</td><td>Outputs do plano grátis ficam públicos</td></tr><tr><td><strong>Bing Image Creator</strong></td><td>⚠️ Verifique</td><td>Os termos do Designer de consumidor restringem uso comercial</td></tr><tr><td><strong>Kling / Hailuo (vídeo)</strong></td><td>❌ Não no grátis</td><td>Exige plano pago para uso comercial</td></tr><tr><td><strong>CapCut (desktop)</strong></td><td>✅ Sim, para conteúdo seu</td><td>Livre de marca d'água</td></tr><tr><td><strong>Canva grátis</strong></td><td>✅ Sim, para os seus designs</td><td>Sujeito aos termos do Canva</td></tr></tbody></table></div>\n<p><strong>Regras de segurança:</strong></p>\n<ul>\n<li>Nunca gere <strong>pessoa real, celebridade ou personagem protegido</strong>.</li>\n<li>Nunca gere <strong>logo de marca</strong> em contexto que sugira endosso.</li>\n<li>Nunca use foto de terceiro (Google Imagens, Instagram) sem licença.</li>\n<li>Se o seu negócio crescer, migre a produção de imagem para Firefly (ou equivalente com licença clara) para ter rastreabilidade.</li>\n</ul>\n<hr>\n<h2>8.6 O que fazer se você receber um aviso</h2>\n<p><strong>Plano de recuperação, em ordem:</strong></p>\n<ol>\n<li><strong>Não recorra no impulso.</strong> Espere 24h. Recursos emocionais raramente funcionam.</li>\n<li><strong>Identifique o padrão.</strong> Abra o painel de avisos e leia qual regra foi citada. Na maioria dos casos é: (a) encurtador, (b) conteúdo afiliado sem transparência, (c) volume/repetição, (d) categoria proibida.</li>\n<li><strong>Corrija TODOS os pins afetados</strong> — não só o pin denunciado. Se um encurtador foi o problema, troque em todos.</li>\n<li><strong>Pause publicações por 72 horas.</strong> Deixe a conta \"respirar\". Continue salvando conteúdo de terceiros e interagindo normalmente.</li>\n<li><strong>Reduza o volume</strong> e aumente a proporção de conteúdo não promocional (volte para 80/20).</li>\n<li><strong>Volte em ritmo reduzido:</strong> 1-2 pins/dia por 2 semanas, aumentando gradualmente.</li>\n<li><strong>Se for suspensão</strong>, use o formulário oficial de recurso na Central de Ajuda, seja objetivo, assuma o erro específico, descreva a correção e mostre que já implementou.</li>\n<li><strong>Plano B sempre pronto:</strong> mantenha um segundo nicho mapeado e 2 ofertas alternativas. Dependência de uma única conta é risco de negócio, não de plataforma.</li>\n</ol>\n<p><strong>O que NÃO fazer:</strong> criar conta nova para contornar punição. Isso é evasão de banimento e resulta em banimento permanente do dispositivo/rede.</p>\n<hr>\n<h2>8.7 Autoauditoria mensal de 10 perguntas</h2>\n<p>Rode todo dia 1º do mês. Se qualquer resposta for \"não\" ou \"não sei\", corrija antes de continuar.</p>\n<pre class=\"prompt curto\">1. Todos os meus pins de afiliado têm aviso de transparência visível?\n2. Minha página de destino avisa ANTES do primeiro link?\n3. Nenhum link encurtado em uso?  (conferi os últimos 20 pins)\n4. Testei os 10 links mais clicados em janela anônima este mês?\n5. Algum produto que promovo entrou em categoria proibida?\n6. Estou respeitando o 80/20 (conteúdo útil vs promocional)?\n7. Estou mantendo 72h+ entre pins do mesmo link?\n8. Meu volume diário está abaixo de 150 links de afiliado?\n9. Confirmei os termos atualizados dos meus programas de afiliado?\n10. Tenho um segundo nicho e uma segunda oferta mapeados?</pre>\n<hr>\n<h2>8.8 Tabela de risco por decisão</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Decisão</th><th>Risco</th><th>Nível</th><th>Mitigação</th></tr></thead><tbody><tr><td>Link direto de afiliado no pin</td><td>Programa pode proibir</td><td>🟡 Médio</td><td>Confirme os termos; use página intermediária se houver dúvida</td></tr><tr><td>Link via página própria</td><td>Quase nenhum</td><td>🟢 Baixo</td><td>Método recomendado</td></tr><tr><td>Usar 5 hashtags</td><td>Nenhum</td><td>🟢 Baixo</td><td>Máximo 5</td></tr><tr><td>Usar 30 hashtags</td><td>Filtro de spam</td><td>🔴 Alto</td><td>Nunca</td></tr><tr><td>Publicar 3-5 pins/dia</td><td>Nenhum</td><td>🟢 Baixo</td><td>Faixa segura</td></tr><tr><td>Publicar 50 pins/dia</td><td>Marcação como spam</td><td>🔴 Alto</td><td>Não faça</td></tr><tr><td>Vídeo gerado com IA grátis</td><td>Licença não comercial</td><td>🟡 Médio</td><td>Anime você mesmo no CapCut</td></tr><tr><td>Imagem de gerador com uso comercial</td><td>Nenhum</td><td>🟢 Baixo</td><td>Prefira Firefly/Ideogram/Leonardo</td></tr><tr><td>Promover infoproduto de saúde</td><td>Alegação médica</td><td>🔴 Alto</td><td>Nunca prometa cura</td></tr><tr><td>Produto físico via Amazon</td><td>Cookie de 24h</td><td>🟡 Médio</td><td>Escolha produto de compra por impulso</td></tr><tr><td>Programa com mensalidade de inatividade</td><td>Custo silencioso</td><td>🟡 Médio</td><td>Só entre com volume</td></tr></tbody></table></div>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"09-monetizacao-7-vias.md\">09 · As 7 Vias de Monetização</a></p>"},{"arquivo":"09-monetizacao-7-vias.md","titulo":"As 7 Vias de Monetização — todas as possibilidades","html":"<h1>09 · As 7 Vias de Monetização — todas as possibilidades</h1>\n<blockquote>O Pinterest não paga você. Ele te dá <strong>atenção qualificada</strong>. Quem paga são as 7 vias abaixo — e você pode (e deve) empilhar várias.</blockquote>\n<hr>\n<h2>Panorama comparativo</h2>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Via</th><th>Rampa</th><th>Ticket</th><th>Margem</th><th>Escala</th><th>Dificuldade</th></tr></thead><tbody><tr><td>1</td><td><strong>Afiliado de infoproduto</strong></td><td>Rápida (dias)</td><td>R$ 27-1.200</td><td>30-80%</td><td>Alta</td><td>🟢 Fácil</td></tr><tr><td>2</td><td><strong>Afiliado físico</strong></td><td>Rápida</td><td>R$ 30-500</td><td>1-16%</td><td>Alta (volume)</td><td>🟢 Fácil</td></tr><tr><td>3</td><td><strong>Afiliado SaaS recorrente</strong> ⭐</td><td>Média</td><td>US$ 20-500/mês</td><td>30-60% <strong>recorrente</strong></td><td>Muito alta</td><td>🟡 Média</td></tr><tr><td>4</td><td><strong>Produto digital próprio</strong> ⭐</td><td>Média (1 semana)</td><td>R$ 27-197</td><td>80-100%</td><td>Alta</td><td>🟡 Média</td></tr><tr><td>5</td><td><strong>Print on demand</strong></td><td>Média</td><td>R$ 60-200</td><td>20-50%</td><td>Média</td><td>🟡 Média</td></tr><tr><td>6</td><td><strong>Blog + anúncios</strong></td><td>Lenta (3-6 meses)</td><td>RPM US$ 5-40</td><td>alta</td><td>Muito alta</td><td>🟠 Trabalhosa</td></tr><tr><td>7</td><td><strong>Serviço próprio</strong> ⭐</td><td>Imediata</td><td>R$ 500-5.000/mês</td><td>~100%</td><td>Baixa (tempo)</td><td>🟢 Fácil</td></tr><tr><td>+</td><td><strong>Lead-gen / lista de e-mail</strong></td><td>Média</td><td>varia</td><td>varia</td><td>Alta</td><td>🟡 Média</td></tr><tr><td>+</td><td><strong>PLR / conteúdo licenciado</strong></td><td>Rápida</td><td>R$ 27-97</td><td>~100%</td><td>Alta</td><td>🟢 Fácil</td></tr></tbody></table></div>\n<p><strong>A estratégia vencedora não é escolher uma — é empilhar.</strong> O fluxo clássico:</p>\n<pre class=\"prompt curto\">Via 7 (serviço) financia o tempo\n      ↓\nVias 1/2/3 (afiliado) provam o nicho e geram caixa\n      ↓\nVia 4 (produto próprio) captura margem máxima\n      ↓\nVia 6 (blog) vira o ativo de longo prazo</pre>\n<hr>\n<h2>Via 1 — Afiliado de infoproduto</h2>\n<p><strong>O que é:</strong> você promove curso, e-book ou mentoria de terceiros e recebe de 10% a 80%.</p>\n<p><strong>Onde:</strong> Hotmart (líder, catálogo enorme, comissões médias de 40-60%), Kiwify (até 70-85%, ciclo de caixa em 15 dias), Monetizze (forte em físico + digital), Eduzz, Braip.</p>\n<p><strong>Como fazer:</strong></p>\n<ol>\n<li>Criar conta de afiliado (grátis) na plataforma.</li>\n<li>Buscar produtos por nicho, filtrando por <strong>temperatura alta</strong> e <strong>100+ vendas</strong>.</li>\n<li>Verificar: comissão ≥ 40%, ticket entre R$ 47 e R$ 997, página de vendas profissional, produtor com boa reputação.</li>\n<li>Pedir afiliação (geralmente automática).</li>\n<li>Copiar seu link e colar na sua página de destino.</li>\n<li>Produzir 15-25 pins apontando para essa página.</li>\n</ol>\n<p><strong>Números de referência:</strong></p>\n<pre class=\"prompt curto\">R$ 97 × 50% = R$ 48,50 por venda\nPara R$ 1.000/mês → ~21 vendas → ~2.100 cliques → ~525.000 impressões/mês</pre>\n<p>Isso exige um acervo de 500-700 pins trabalhando. É atingível em 4-6 meses com 3-5 pins/dia.</p>\n<p><strong>Erros comuns:</strong> escolher produto de R$ 27 com 20% de comissão (R$ 5,40/venda); promover produto sem avaliações; depender de um único produtor.</p>\n<hr>\n<h2>Via 2 — Afiliado de produto físico</h2>\n<p><strong>O que é:</strong> você promove produto tangível e recebe uma porcentagem.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Programa</th><th>Comissão</th><th>Cookie</th><th>Ponto forte</th></tr></thead><tbody><tr><td>Amazon Associados</td><td>1% a 15% (moda ~10%, livro 4,5%)</td><td><strong>24 horas</strong></td><td>Vitrine gigante, entrega rápida</td></tr><tr><td>Mercado Livre Afiliados</td><td>até ~16%</td><td>30 dias</td><td>Catálogo enorme no Brasil</td></tr><tr><td>Shopee Afiliados</td><td>3% a 15%</td><td>7 dias</td><td>Preço baixo, compra por impulso</td></tr><tr><td>Parceiro Magalu</td><td>1% a 12%</td><td>30 dias</td><td>Confiança da marca no BR</td></tr><tr><td>Braip</td><td>variável</td><td>não divulgado</td><td>Físico + pagamento em 24h</td></tr></tbody></table></div>\n<p><strong>A matemática que importa:</strong> cookie de 24h (Amazon) significa que o cliente precisa comprar <strong>no mesmo dia</strong>. Isso funciona para <strong>produto de compra por impulso</strong> (utilidade doméstica, acessório, presente), não para compra planejada.</p>\n<p><strong>Como fazer render:</strong></p>\n<ul>\n<li>Pin com o produto em contexto real de uso (não foto de catálogo).</li>\n<li>Título com o problema, não com o produto: \"adeus bagunça na pia\" &gt; \"escorredor de louças inox\".</li>\n<li>Link direto para a página do produto (se o programa permitir) ou para um artigo \"melhores X para Y\" na sua página.</li>\n</ul>\n<p><strong>Vantagem escondida:</strong> produto físico converte melhor em público frio porque o preço é baixo e a decisão é rápida.</p>\n<hr>\n<h2>Via 3 — Afiliado de SaaS com comissão recorrente ⭐</h2>\n<p><strong>A melhor via que quase ninguém usa.</strong> Você indica uma ferramenta; o cliente assina; <strong>você recebe todo mês</strong> enquanto ele ficar.</p>\n<p><strong>Estruturas típicas de mercado (confirme os valores atuais):</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Ferramenta</th><th>Comissão</th><th>Tipo</th></tr></thead><tbody><tr><td>ConvertKit</td><td>~30% recorrente por 24 meses</td><td>Recorrente</td></tr><tr><td>SEMrush</td><td>comissão alta por venda (ticket citado de US$ 200) + valor por trial</td><td>Única</td></tr><tr><td>Hostinger</td><td>até ~60% por venda + recorrência em assinaturas</td><td>Única + recorrência</td></tr><tr><td>Elementor</td><td>~50% por venda</td><td>Única</td></tr><tr><td>Canva Pro</td><td>até ~36% por assinatura</td><td>Única</td></tr><tr><td>GoHighLevel</td><td>~40% recorrente</td><td>Recorrente</td></tr></tbody></table></div>\n<p><strong>Por que é imbatível:</strong></p>\n<pre class=\"prompt curto\">1 cliente assinando US$ 29/mês com 30% de comissão = US$ 8,70/mês\n× 100 clientes = US$ 870/mês (≈ R$ 4.800) — recorrente, todo mês</pre>\n<p>Comparado a 100 vendas de e-book de R$ 30 (R$ 2.400 uma vez só).</p>\n<p><strong>Nichos que casam:</strong> IA &amp; Ferramentas (o mais forte), Negócios &amp; Marketing, Produtividade, Finanças, Design.</p>\n<p><strong>Como fazer:</strong></p>\n<ol>\n<li>Escolha 2-3 ferramentas que você realmente usaria.</li>\n<li>Escreva conteúdo <strong>útil</strong> sobre elas: comparativo, \"como fiz X\", \"ferramenta que uso para Y\". Conteúdo de ajuda converte muito mais que promoção.</li>\n<li>Pin com o resultado (print da tela, mockup, checklist), apontando para o seu comparativo.</li>\n<li>Empilhe várias ferramentas do mesmo público: 5 clientes em cada uma de 6 ferramentas = 30 assinaturas recorrentes.</li>\n</ol>\n<hr>\n<h2>Via 4 — Produto digital próprio ⭐</h2>\n<p><strong>Margem de 80% a 100%. Custo marginal zero. Você cria uma vez, vende infinitas vezes.</strong></p>\n<p><strong>O que vender (criado com IA + Canva):</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Produto</th><th>Preço</th><th>Como fazer em 1 dia</th></tr></thead><tbody><tr><td><strong>Printable</strong> (planner, checklist, planner de rotina)</td><td>R$ 17-47</td><td>Prompt 10 → Canva → PDF → Gumroad</td></tr><tr><td><strong>Template</strong> (Notion, planilha, apresentação)</td><td>R$ 27-97</td><td>Prompt 10 → adaptar → duplicar link</td></tr><tr><td><strong>Mini-ebook / guia</strong></td><td>R$ 27-67</td><td>Prompt 10 → revisar → PDF no Canva</td></tr><tr><td><strong>Pack de prompts</strong></td><td>R$ 27-97</td><td>Compilar seus melhores prompts</td></tr><tr><td><strong>Pack de imagens</strong></td><td>R$ 17-47</td><td>50-100 imagens geradas + licença</td></tr><tr><td><strong>Curso curto em vídeo</strong></td><td>R$ 97-497</td><td>Roteiro por IA + CapCut + Hotmart</td></tr></tbody></table></div>\n<p><strong>Onde vender:</strong> Gumroad (grátis, taxa por venda), Payhip (grátis), Etsy (público comprador enorme, mas <strong>não permite link direto do Pinterest</strong> — exige intermediário), Hotmart como produtor, Ko-fi.</p>\n<p><strong>A escada de preço (o segredo):</strong></p>\n<pre class=\"prompt curto\">ISCA GRÁTIS          → captura e-mail (checklist de 1 página)\nPRODUTO PRINCIPAL    → R$ 27-47 (planner completo de 20 páginas)\nCOMBO / UPGRADE      → R$ 97-147 (planner + template + pack de bônus)</pre>\n<p>Cada pin pode apontar para o degrau que fizer sentido. Quem não compra o produto principal hoje, compra o combo amanhã — desde que você tenha o e-mail.</p>\n<p><strong>Higiene jurídica mínima:</strong> inclua uma página de licença dizendo o que o comprador pode (uso pessoal) e o que não pode (revender o arquivo). Nunca copie conteúdo de terceiros — a IA deve escrever do zero.</p>\n<hr>\n<h2>Via 5 — Print on demand</h2>\n<p><strong>O que é:</strong> você cria o design; a plataforma imprime e envia quando alguém compra. Sem estoque, sem logística.</p>\n<p><strong>Ferramentas:</strong> Printful ou Printify (integrados a lojas), Redbubble (marketplace próprio), Etsy + Printify.</p>\n<p><strong>Produtos que funcionam no Pinterest:</strong> pôsteres, quadros, canecas, camisetas com frase, planners físicos.</p>\n<p><strong>Como fazer:</strong></p>\n<ol>\n<li>Identifique a frase/tema que o nicho ama (frases de motivação para home office, citações de cozinha, arte para quarto de bebê).</li>\n<li>Gere a arte no Canva (não use imagem de IA direto sem editar — tipografia é o que vende).</li>\n<li>Cadastre o produto na plataforma.</li>\n<li>Faça pins mostrando o produto <strong>em ambiente real</strong> (mockup na parede da sala, na mesa do escritório).</li>\n</ol>\n<p><strong>Margem:</strong> 20% a 50%. Volume menor que produto digital, mas o cliente recebe algo físico — satisfação e recompra maiores.</p>\n<hr>\n<h2>Via 6 — Blog + anúncios (AdSense e redes premium)</h2>\n<p><strong>O modelo:</strong> pin → seu artigo → anúncios na página.</p>\n<p><strong>Plataformas:</strong> Google AdSense (a porta de entrada), Ezoic, Mediavine (exige ~50k sessões/mês), Journey, Raptive (exige volume alto). RPM típico: US$ 5 a US$ 40 dependendo do nicho e do país do visitante (tráfego dos EUA paga muito mais).</p>\n<p><strong>Por que vale a pena mesmo sendo lento:</strong></p>\n<ul>\n<li>Você não depende de nenhum produtor de afiliado.</li>\n<li>O artigo ranqueia também no Google (dupla fonte de tráfego).</li>\n<li>Vira um ativo vendável (blogs de conteúdo são negociados por múltiplos de receita).</li>\n</ul>\n<p><strong>Como fazer rápido:</strong></p>\n<ol>\n<li>Blog grátis no começo (Blogger, Substack, Medium) ou hospedagem barata (R$ 15/mês).</li>\n<li>1 artigo por pin importante (o mesmo conteúdo, expandido).</li>\n<li>Cada artigo com 800-1.200 palavras, imagens do próprio pin, e CTA para a oferta de afiliado também (dupla monetização: anúncio + comissão).</li>\n<li>Meta: 50 artigos em 6 meses.</li>\n</ol>\n<p>⚠️ <strong>Requisito de compliance:</strong> página de destino com <strong>excesso de anúncios</strong> é penalizada pelo Pinterest. Equilibre: 2-3 blocos de anúncio por artigo, nunca uma página que é só propaganda.</p>\n<hr>\n<h2>Via 7 — Serviço próprio ⭐ (a via do dinheiro rápido)</h2>\n<p><strong>Você vende o que acabou de aprender.</strong> Receita imediata, sem depender de algoritmo.</p>\n<p><strong>O que vender:</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Serviço</th><th>Preço</th><th>Tempo de entrega</th></tr></thead><tbody><tr><td>Gestão de Pinterest (1 cliente)</td><td>R$ 800-2.500/mês</td><td>5-8 h/semana</td></tr><tr><td>Criação de 30 pins</td><td>R$ 400-1.200</td><td>3-4 h</td></tr><tr><td>Setup completo de conta (perfil + boards + 20 pins)</td><td>R$ 500-1.500</td><td>1-2 dias</td></tr><tr><td>Auditoria de perfil + plano de conteúdo</td><td>R$ 300-800</td><td>4 h</td></tr><tr><td>Criação de página de destino</td><td>R$ 400-1.500</td><td>1 dia</td></tr></tbody></table></div>\n<p><strong>Como conseguir os primeiros clientes usando o que você tem:</strong></p>\n<ol>\n<li>Seus próprios pins são o <strong>portfólio</strong>. Publique 100 pins primeiro.</li>\n<li>Aborde pequenos negócios locais que têm Instagram mas não Pinterest (lojas de decoração, ateliês, nutricionistas, e-commerces pequenos).</li>\n<li>Mostre o número: \"seu concorrente tem X impressões no Pinterest; você tem zero\".</li>\n<li>Comece com um pacote de teste (R$ 400 por 20 pins) e um contrato mensal depois.</li>\n</ol>\n<p><strong>Por que essa via é subestimada:</strong> R$ 1.500/mês de um cliente equivale a <strong>~31 vendas</strong> de um infoproduto de R$ 97 com 50% de comissão. Um cliente é mais fácil de conseguir que 31 vendas de tráfego frio.</p>\n<hr>\n<h2>Via 8 (bônus) — Lead-gen e lista de e-mail</h2>\n<p><strong>O que é:</strong> o pin oferece algo grátis (checklist, planner, mini-guia) em troca do e-mail.</p>\n<p><strong>Por que é a via mais defensiva:</strong> mesmo que o Pinterest mude as regras ou o link caia, <strong>a lista é sua</strong>. É o único ativo que ninguém pode bloquear.</p>\n<p><strong>Como fazer:</strong></p>\n<ol>\n<li>Crie a isca (printable de 1 página) com o Prompt 10.</li>\n<li>Use MailerLite (grátis até 1.000 inscritos) ou Brevo.</li>\n<li>Página de captura simples → entrega o arquivo → sequência de 5 e-mails → oferta.</li>\n<li>Pins apontando para essa página com títulos tipo \"checklist grátis\".</li>\n</ol>\n<p><strong>Números:</strong> conversão típica de página de captura em tráfego de Pinterest fica entre 10% e 30% (o público já está com intenção). Uma lista de 1.000 pessoas pode render de R$ 500 a R$ 5.000 em uma única oferta.</p>\n<hr>\n<h2>Via 9 (bônus) — PLR e conteúdo licenciado</h2>\n<p><strong>O que é:</strong> você compra um pacote de conteúdo com direito de revenda e adapta para o seu nicho.</p>\n<p><strong>Onde:</strong> PLR Databases, IDPLR, packs de prompts, packs de printables.</p>\n<p><strong>A regra crítica:</strong> confira a licença. Existem 4 níveis comuns:</p>\n<ol>\n<li><strong>Uso pessoal</strong> — você não pode vender.</li>\n<li><strong>Uso comercial</strong> — pode vender, não pode revender direitos.</li>\n<li><strong>Revenda (RR)</strong> — pode vender e o comprador não pode revender.</li>\n<li><strong>Direitos de revenda master (MRR)</strong> — o comprador pode revender.</li>\n</ol>\n<p>Compre só se puder revender (3 ou 4). E <strong>sempre adapte</strong>: PLR cru é encontrado em 20 lugares diferentes, o que destrói preço e credibilidade. Use a IA para reescrever, atualizar e ajustar ao seu público.</p>\n<hr>\n<h2>Como empilhar: o plano de 90 dias por via</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Período</th><th>Via ativa</th><th>Objetivo</th></tr></thead><tbody><tr><td>Dias 1-30</td><td>Via 1 ou 2 (afiliado)</td><td>Publicar 120 pins, validar qual ângulo converte</td></tr><tr><td>Dias 31-60</td><td>+ Via 7 (serviço)</td><td>Usar o portfólio pronto para vender 1 cliente</td></tr><tr><td>Dias 61-90</td><td>+ Via 4 (produto próprio)</td><td>Lançar 1 printable com margem 100%</td></tr><tr><td>Mês 4-6</td><td>+ Via 3 (SaaS recorrente)</td><td>Construir renda recorrente</td></tr><tr><td>Mês 5-9</td><td>+ Via 6 (blog)</td><td>Ativo de longo prazo, dupla monetização</td></tr><tr><td>Sempre</td><td>Via 8 (lista de e-mail)</td><td>Blindagem contra bloqueio</td></tr></tbody></table></div>\n<p><strong>Regra de ouro do empilhamento:</strong> só comece uma via nova quando a anterior estiver <strong>funcionando e não mais exigindo sua atenção diária</strong>. Quem tenta 4 vias na semana 1 não fatura em nenhuma.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"10-plano-30-60-90.md\">10 · Plano 30-60-90</a></p>"},{"arquivo":"10-plano-30-60-90.md","titulo":"Plano 30-60-90 — o cronograma dia a dia","html":"<h1>10 · Plano 30-60-90 — o cronograma dia a dia</h1>\n<blockquote>Este é o plano executável. 30 a 60 minutos por dia. Se você seguir só este capítulo e o app, já está à frente de 95% das pessoas.</blockquote>\n<hr>\n<h2>Pré-requisitos (antes do dia 1)</h2>\n<ul class=\"lista-check\">\n<li>☐ Conta Pinterest criada (ou a que você já tem convertida em business)</li>\n<li>☐ E-mail dedicado ao projeto (separe da vida pessoal)</li>\n<li>☐ 30 a 60 minutos livres por dia</li>\n<li>☐ R$ 0,00 de investimento — o plano inteiro roda com ferramentas grátis</li>\n</ul>\n<hr>\n<h1>FASE 1 · DIAS 1-30 — Fundação e primeiros 120 pins</h1>\n<p><strong>Meta da fase:</strong> conta montada, nicho validado, oferta aprovada, 90-120 pins publicados.</p>\n<p><strong>Nada de receita relevante aqui. O objetivo é construir o acervo e aprender o processo.</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Dia</th><th>Tarefa</th><th>Tempo</th><th>Portão de saída</th></tr></thead><tbody><tr><td>1</td><td>Converter em conta business. Escrever bio com keyword. Escolher foto/capa</td><td>40 min</td><td>Conta com aparência profissional</td></tr><tr><td>2</td><td>Criar 5 boards temáticos (título + descrição com keyword)</td><td>40 min</td><td>5 boards prontos</td></tr><tr><td>3</td><td>Rodar Prompt 1 (Máquina de Nichos) → 3 candidatos</td><td>30 min</td><td>3 nichos na mão</td></tr><tr><td>4</td><td>Validar demanda dos 3 na busca guiada + Pinterest Trends</td><td>30 min</td><td>1 nicho escolhido</td></tr><tr><td>5</td><td>Levantar 5-10 ofertas no nicho (Prompt 2)</td><td>40 min</td><td>Lista de ofertas</td></tr><tr><td>6</td><td>Rodar a validação dos 12 critérios em cada oferta</td><td>40 min</td><td>1 principal + 2 secundárias</td></tr><tr><td>7</td><td>Cadastrar nos programas de afiliado, pegar os links</td><td>30 min</td><td>Links aprovados</td></tr><tr><td>8</td><td>Rodar Prompt 3 (1 keyword → 10 ângulos)</td><td>30 min</td><td>10 ângulos mapeados</td></tr><tr><td>9</td><td>Marcar 5 ângulos e escrever a ficha de cada um</td><td>30 min</td><td>5 ângulos com destino definido</td></tr><tr><td>10</td><td>Rodar Prompt 5 (Validador de Visual) e escolher 1-2 estilos</td><td>40 min</td><td>Estilo fixo da conta</td></tr><tr><td>11</td><td>Rodar Prompt 15: gerar as 10 primeiras imagens grátis</td><td>45 min</td><td>10 imagens salvas</td></tr><tr><td>12</td><td>Canva: criar o template mestre 1000×1500</td><td>45 min</td><td>Template reutilizável</td></tr><tr><td>13</td><td>Montar os 5 primeiros pins completos e publicar</td><td>50 min</td><td><strong>5 pins no ar</strong></td></tr><tr><td>14</td><td>Rodar Prompt 7 (página de destino) e publicar a página</td><td>60 min</td><td>Página com aviso de afiliado</td></tr><tr><td>15</td><td>Publicar 5 pins apontando para a página. Testar todos os links</td><td>40 min</td><td><strong>10 pins no ar</strong></td></tr><tr><td>16</td><td>Primeira leitura de analytics (só observar, não concluir nada)</td><td>15 min</td><td>Baseline anotado</td></tr><tr><td>17</td><td>Rodar Prompt 6 (20 títulos) e escolher o top 5</td><td>30 min</td><td>5 headlines testadas</td></tr><tr><td>18</td><td>Publicar 5 pins com as novas headlines</td><td>40 min</td><td><strong>15 pins</strong></td></tr><tr><td>19</td><td>Rodar Prompt 8 (roteiro de vídeo) e gravar/gerar 1 video pin</td><td>50 min</td><td>1 vídeo publicado</td></tr><tr><td>20</td><td>5 pins novos + fixar o melhor no topo do board principal</td><td>40 min</td><td><strong>21 pins</strong></td></tr><tr><td>21</td><td><strong>DIA DE MANUTENÇÃO em lote:</strong> gerar 20 imagens de uma vez</td><td>60 min</td><td>Banco de imagens cheio</td></tr><tr><td>22</td><td>Montar 5 pins usando o banco de imagens (Canva)</td><td>45 min</td><td><strong>26 pins</strong></td></tr><tr><td>23</td><td>Publicar 5 pins + agendar 5 no agendador nativo</td><td>40 min</td><td><strong>31 pins</strong></td></tr><tr><td>24</td><td>Rodar Prompt 9 (carrossel) e montar 1 carrossel</td><td>45 min</td><td>1 carrossel publicado</td></tr><tr><td>25</td><td>Publicar 5 pins</td><td>30 min</td><td><strong>37 pins</strong></td></tr><tr><td>26</td><td>Rodar Prompt 12 (diagnóstico) com os dados que já tem</td><td>30 min</td><td>Vazamento identificado</td></tr><tr><td>27</td><td>Corrigir o que o diagnóstico apontou</td><td>45 min</td><td>Correção aplicada</td></tr><tr><td>28</td><td><strong>DIA DE MANUTENÇÃO em lote:</strong> 20 imagens + 20 títulos</td><td>60 min</td><td>Banco reabastecido</td></tr><tr><td>29</td><td>Publicar 6 pins (recuperando o ritmo)</td><td>40 min</td><td><strong>43 pins</strong></td></tr><tr><td>30</td><td><strong>RELATÓRIO DA FASE:</strong> pins publicados, impressões, cliques, saves</td><td>45 min</td><td>Próxima fase planejada</td></tr></tbody></tab
