le></div>\n<blockquote><strong>Se você atrasar:</strong> não pule o portão de saída. Prefira estender a fase 1 em uma semana a publicar 100 pins de uma oferta não validada.</blockquote>\n<p><strong>Sinais de que está no caminho certo no dia 30:</strong></p>\n<ul>\n<li>40+ pins publicados ✅</li>\n<li>Impressões começando a subir ✅</li>\n<li>Primeiros saves e cliques ✅</li>\n<li>1-2 ângulos com desempenho visivelmente melhor ✅</li>\n<li>Nenhum aviso de violação ✅</li>\n</ul>\n<p><strong>Sinais de alerta:</strong></p>\n<ul>\n<li>❌ Zero cliques com 40 pins → problema provável: título/visual fraco ou destino desalinhado (rode Prompt 12)</li>\n<li>❌ Impressões paradas → conta pode estar com volume/repetição alto (reduza e varie)</li>\n<li>❌ Muitos saves e poucos cliques → sua promessa não pede clique (falta CTA)</li>\n</ul>\n<hr>\n<h1>FASE 2 · DIAS 31-60 — Volume, testes e primeira receita</h1>\n<p><strong>Meta da fase:</strong> 250-300 pins no acervo total, 2 ângulos vencedores identificados, primeira(s) comissão(ões).</p>\n<p><strong>Aqui você para de testar tudo e começa a dobrar no que funciona.</strong></p>\n<div class=\"rolagem\"><table><thead><tr><th>Período</th><th>Foco</th><th>Ações</th></tr></thead><tbody><tr><td><strong>Dias 31-35</strong></td><td>Produção em lote</td><td>3 sessões de 1 hora = 45 pins. Varie: 3 ângulos × 5 designs cada</td></tr><tr><td><strong>Dia 36</strong></td><td>Análise</td><td>Os 5 pins com melhor CTR de saída → o que eles têm em comum?</td></tr><tr><td><strong>Dias 37-42</strong></td><td>Dobrar no vencedor</td><td>Crie 15 variações do pin campeão (mesmo tema, fundo diferente, título diferente)</td></tr><tr><td><strong>Dia 43</strong></td><td>Segundo formato</td><td>3 video pins e 2 carrosséis sobre os mesmos temas</td></tr><tr><td><strong>Dias 44-50</strong></td><td>Segunda oferta</td><td>Valide e ative a oferta secundária. Teste-a com 15 pins</td></tr><tr><td><strong>Dia 51</strong></td><td>Página</td><td>Otimize a página de destino com base em onde as pessoas param</td></tr><tr><td><strong>Dias 52-58</strong></td><td>Volume</td><td>3 sessões de lote = mais 45 pins</td></tr><tr><td><strong>Dia 59</strong></td><td>Compliance</td><td>Rode a autoauditoria mensal de 10 perguntas (cap. 08)</td></tr><tr><td><strong>Dia 60</strong></td><td><strong>RELATÓRIO:</strong> conversão por oferta, receita, decisão de escalar/pivotar</td><td>—</td></tr></tbody></table></div>\n<p><strong>Estratégia de dobrada (o conceito-chave desta fase):</strong></p>\n<pre class=\"prompt curto\">Se o pin A teve CTR de 0,9% e o pin B teve 0,2%:\n  ❌ Errado: continuar produzindo A e B no mesmo ritmo\n  ✅ Certo: produzir 5 variações de A para cada nova variação de B</pre>\n<p>O Pinterest tem cauda longa: os 3 melhores ângulos de um nicho costumam gerar 70% do resultado.</p>\n<p><strong>Terceirização inteligente:</strong> se você tem pouco tempo, cortou o que dá menos retorno — <strong>descrição e hashtags</strong> (a IA faz em 1 minuto) — e investiu o tempo em <strong>imagem e título</strong> (que é onde o CTR se decide).</p>\n<hr>\n<h1>FASE 3 · DIAS 61-90 — Escala e diversificação</h1>\n<p><strong>Meta da fase:</strong> 500+ pins no acervo, 3 fontes de receita ativas, processo sistematizado.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Período</th><th>Foco</th><th>Ações</th></tr></thead><tbody><tr><td><strong>Dias 61-65</strong></td><td>Teste de idioma</td><td>Adaptive 20 pins para inglês (Prompt de adaptação — cap. 06)</td></tr><tr><td><strong>Dias 66-70</strong></td><td>Produto próprio</td><td>Rodar Prompt 10 e criar 1 printable. Publicar na Gumroad/Payhip</td></tr><tr><td><strong>Dias 71-75</strong></td><td>Pins para o produto</td><td>20 pins apontando para o produto próprio (margem 100%)</td></tr><tr><td><strong>Dia 76</strong></td><td>Lista de e-mail</td><td>Criar isca grátis + formulário (MailerLite grátis)</td></tr><tr><td><strong>Dias 77-82</strong></td><td>SaaS recorrente</td><td>Escolher 2 ferramentas, escrever 2 comparativos, produzir 15 pins</td></tr><tr><td><strong>Dias 83-88</strong></td><td>Reciclagem</td><td>Pegue os 10 melhores pins do mês 1 e refaça com design novo (pin fresco)</td></tr><tr><td><strong>Dia 89</strong></td><td>Auditoria completa</td><td>Compliance + links + perfil + boards</td></tr><tr><td><strong>Dia 90</strong></td><td><strong>RELATÓRIO TRIMESTRAL</strong></td><td>Receita por via, RPM por pin, decisão estratégica do trimestre 2</td></tr></tbody></table></div>\n<p><strong>A grande decisão do dia 90:</strong> olhe o RPM (receita por 1.000 impressões) de cada oferta e de cada via.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Situação</th><th>Decisão</th></tr></thead><tbody><tr><td>Uma via gera 70%+ da receita</td><td><strong>Dobre</strong> nela: todo o esforço para lá</td></tr><tr><td>Nenhuma via chegou a R$ 200/mês</td><td><strong>Revise a oferta</strong> (não o volume). Provavelmente é problema de validação</td></tr><tr><td>Boa receita, mas dependente de 1 conta/produtor</td><td><strong>Diversifique</strong> imediatamente</td></tr><tr><td>Receita subindo mês a mês</td><td><strong>Escale volume</strong> e comece a reciclar vencedores</td></tr></tbody></table></div>\n<hr>\n<h2>Metas realistas por fase</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Fase</th><th>Pins no acervo</th><th>Impressões/mês</th><th>Receita mensal esperada*</th></tr></thead><tbody><tr><td>Dia 30</td><td>40-60</td><td>5.000-30.000</td><td>R$ 0 a R$ 100</td></tr><tr><td>Dia 60</td><td>150-250</td><td>50.000-200.000</td><td>R$ 100 a R$ 800</td></tr><tr><td>Dia 90</td><td>350-500</td><td>150.000-500.000</td><td>R$ 300 a R$ 2.000</td></tr><tr><td>Mês 6</td><td>900-1.500</td><td>400.000-1.500.000</td><td>R$ 1.000 a R$ 6.000</td></tr><tr><td>Mês 12</td><td>2.000+</td><td>1M-5M</td><td>R$ 3.000 a R$ 20.000+</td></tr></tbody></table></div>\n<p>\\* Faixas amplas de propósito: dependem de nicho, ticket, comissão e oferta. <strong>Isto não é promessa</strong> — é referência de planejamento baseada em taxas de conversão de mercado (CTR 0,4% e conversão 1%). Resultados variam enormemente e a maioria dos projetos que falha o faz por parar antes do dia 60.</p>\n<hr>\n<h2>O \"dia sem tempo\" — ação mínima viável</h2>\n<p>Quando você não tem nem 30 minutos, faça <strong>só isto</strong> (leva 6 minutos):</p>\n<pre class=\"prompt curto\">1. Abra o app na etapa 9 (Pack já gerado)\n2. Copie 1 título + 1 descrição prontos\n3. Publique 1 pin com uma imagem do seu banco\n4. Anote no log</pre>\n<p><strong>Um pin por dia mantém a conta viva.</strong> O algoritmo premia constância muito mais que volume concentrado. 3 pins/dia durante 90 dias rende mais que 300 pins em uma semana e depois nada.</p>\n<hr>\n<h2>O que fazer quando empacar</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Sintoma</th><th>Causa provável</th><th>Ação imediata</th></tr></thead><tbody><tr><td>Impressões subiram, cliques não</td><td>Promessa/visual fracos</td><td>Rode Prompt 6 (20 títulos) e teste 5 pins novos com os melhores</td></tr><tr><td>Cliques subiram, vendas não</td><td>Página de destino ou oferta ruins</td><td>Rode Prompt 7 de novo, melhore a prova social e o CTA</td></tr><tr><td>Tudo travado há 3 semanas</td><td>Conta em \"modo suspeita\"</td><td>Reduza volume, aumente conteúdo não promocional para 90%, espere 2 semanas</td></tr><tr><td>Cansaço e desânimo</td><td>Falta de sistema, não de motivação</td><td>Faça uma sessão de lote (1h = 15 pins) e descanse 3 dias</td></tr><tr><td>Comparação com concorrente</td><td>Você está olhando o pin que deu certo, não os 500 que ele publicou</td><td>Olhe o acervo dele, não o resultado</td></tr></tbody></table></div>\n<hr>\n<h2>O dia 91 em diante (o que muda)</h2>\n<p>Depois do dia 90 você não está mais \"começando\". Você tem:</p>\n<ul>\n<li>Dados reais sobre o que funciona no <strong>seu</strong> nicho;</li>\n<li>Um processo de produção de 15 pins/hora;</li>\n<li>Um acervo que continua trabalhando.</li>\n</ul>\n<p>O trabalho passa a ser: <strong>1 sessão de produção por semana (1h = 15 pins) + 1 sessão de análise por mês (1h) + reciclagem contínua dos vencedores.</strong> É um negócio de manutenção, não de esforço heroico.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"11-metricas.md\">11 · Métricas e Diagnóstico</a></p>"},{"arquivo":"11-metricas.md","titulo":"Métricas e Diagnóstico — onde está o vazamento","html":"<h1>11 · Métricas e Diagnóstico — onde está o vazamento</h1>\n<blockquote>Você não precisa de mais pins. Precisa saber <strong>qual número está travando</strong>. Este capítulo é o manual de leitura.</blockquote>\n<hr>\n<h2>11.1 Os 8 KPIs que importam (e os 3 que não)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>✅ Meça isso</th><th>❌ Ignore isso</th></tr></thead><tbody><tr><td>Impressões (crescimento semanal)</td><td>Curtidas</td></tr><tr><td>CTR de saída (cliques ÷ impressões)</td><td>Seguidores</td></tr><tr><td>Saves por 1.000 impressões</td><td>Repins</td></tr><tr><td>Cliques de saída</td><td>Comentários</td></tr><tr><td>Conversão (vendas ÷ cliques)</td><td>Visualizações de perfil</td></tr><tr><td>Receita por 1.000 impressões (RPM)</td><td>\"Está viralizando?\"</td></tr><tr><td>Vida útil do pin (cliques no mês 3)</td><td></td></tr><tr><td>% de pins mortos</td><td></td></tr></tbody></table></div>\n<p><strong>Por que ignorar os outros:</strong> 97% das buscas do Pinterest são não-marcadas — seguidores não decidem distribuição. E o top 1% dos pins gera mais de 50% das impressões: seu trabalho é produzir tentativas, não colecionar aplausos.</p>\n<hr>\n<h2>11.2 Benchmarks de referência</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Métrica</th><th>Fraco</th><th>OK</th><th>Bom</th><th>Excelente</th></tr></thead><tbody><tr><td><strong>CTR de saída</strong></td><td>&lt; 0,2%</td><td>0,3%</td><td>0,5%</td><td>&gt; 1%</td></tr><tr><td><strong>Saves / 1k impressões (estático)</strong></td><td>&lt; 3</td><td>5</td><td>8</td><td>&gt; 15</td></tr><tr><td><strong>Saves / 1k (vídeo)</strong></td><td>&lt; 8</td><td>13</td><td>20</td><td>&gt; 30</td></tr><tr><td><strong>Conversão (vendas/cliques)</strong></td><td>&lt; 0,3%</td><td>0,5%</td><td>1%</td><td>&gt; 2%</td></tr><tr><td><strong>Vida útil do pin</strong></td><td>dias</td><td>semanas</td><td>3 meses</td><td>6+ meses</td></tr><tr><td><strong>Taxa de pins \"mortos\"</strong></td><td>—</td><td>~70-80% é normal</td><td>—</td><td>—</td></tr></tbody></table></div>\n<hr>\n<h2>11.3 Como calcular (fórmulas prontas)</h2>\n<pre class=\"prompt curto\">CTR de saída        = (cliques ÷ impressões) × 100\nTaxa de save        = (saves ÷ impressões) × 1000\nConversão           = (vendas ÷ cliques) × 100\nRPM (receita/1k)    = (receita ÷ impressões) × 1000\nReceita por clique  = receita ÷ cliques\nEPC (ganho por 100 cliques) = receita ÷ cliques × 100</pre>\n<p><strong>Exemplo prático:</strong></p>\n<pre class=\"prompt curto\">Impressões: 80.000 | Cliques: 320 | Saves: 480 | Vendas: 3 | Receita: R$ 145,50\n\nCTR de saída = 320/80.000 × 100 = 0,40%      → OK (dentro do esperado)\nTaxa de save = 480/80.000 × 1000 = 6,0/1k    → OK\nConversão    = 3/320 × 100 = 0,94%           → OK, quase bom\nRPM          = 145,50/80.000 × 1000 = R$ 1,82 → a régua do seu negócio</pre>\n<p><strong>A régua que importa:</strong> RPM. Se um pin tem RPM de R$ 1,82 e outro de R$ 0,40, produza 5 variações do primeiro para cada nova do segundo. É assim que se escala com dados em vez de intuição.</p>\n<hr>\n<h2>11.4 A árvore de diagnóstico (o fluxo completo)</h2>\n<pre class=\"prompt curto\">IMPRESSÕES ESTÃO SUBINDO?\n│\n├── NÃO → Problema de DISTRIBUIÇÃO\n│   ├── Publicando menos de 3 pins/dia? → aumente o volume\n│   ├── Pins repetidos/sem frescor? → crie designs genuinamente novos\n│   ├── Conta em suspeita (volume alto, muito afiliado)? → reduza, aumente 80/20\n│   ├── Densidade de keyword baixa? → título 40-60 car. + nome do arquivo + board\n│   └── Nada disso? → rode o Prompt 12 com os números\n│\n└── SIM → continuar\n    │\n    CLICKS DE SAÍDA ESTÃO SUBINDO?\n    │\n    ├── NÃO → Problema de PROMESSA ou VISUAL (a pessoa vê, não clica)\n    │   ├── Overlay com menos de 5 palavras? → aumente (5-8 palavras +110% cliques)\n    │   ├── Contraste fraco? → teste do brilho a 30%\n    │   ├── Promessa vaga? → rode o Prompt 6 (20 títulos)\n    │   ├── Imagem com \"cara de IA\"? → gere 5 e escolha a mais natural\n    │   └── Público errado? → olhe demografia do Pinterest Analytics\n    │\n    └── SIM → continuar\n        │\n        AS VENDAS ESTÃO ACONTECENDO?\n        │\n        ├── NÃO → Problema de PÁGINA ou OFERTA\n        │   ├── Link quebrado? → teste em janela anônima\n        │   ├── Promessa do pin ≠ conteúdo da página? → alinhe\n        │   ├── Aviso de afiliado ausente? → risco de compliance E queda de confiança\n        │   ├── Página longa/lenta/com excesso de anúncio? → simplifique\n        │   ├── Preço acima de R$ 297 em tráfego frio? → use uma isca grátis antes\n        │   ├── Oferta sem prova social? → troque de produto\n        │   └── Página boa e oferta boa? → o problema é o volume: 320 cliques/mês\n        │       ainda é pouco para julgar. Continue e acumule 2.000 cliques.\n        │\n        └── SIM → ESCALE\n            ├── Crie 5 variações do pin vencedor\n            ├── Replique o formato em outro ângulo\n            ├── Aplique os UTMs para saber QUAIS pins vendem\n            └── Aumente o ticket (upsell, combo, produto próprio)</pre>\n<hr>\n<h2>11.5 Os 5 vazamentos clássicos e a correção exata</h2>\n<h3>Vazamento 1 — Muito save, pouco clique</h3>\n<p><strong>Diagnóstico:</strong> o conteúdo é ótimo, mas é \"colecionável\" e não \"acionável\".</p>\n<p><strong>Correção:</strong> adicione um verbo de ação no overlay (\"teste\", \"veja o passo a passo\", \"copie a lista\") e garanta que a promessa só se complete na página. Um pin que entrega tudo na imagem não precisa de clique.</p>\n<h3>Vazamento 2 — CTR bom, conversão péssima</h3>\n<p><strong>Diagnóstico:</strong> quebra de expectativa. O pin promete A e a página entrega B.</p>\n<p><strong>Correção:</strong> alinhe palavra por palavra. Se o pin diz \"3 organizadores que cabem em qualquer cozinha\", a página precisa ter esses 3 organizadores acima da dobra.</p>\n<h3>Vazamento 3 — Poucas impressões com bons pins</h3>\n<p><strong>Diagnóstico:</strong> problema de frescor ou de keyword, não de qualidade.</p>\n<p><strong>Correção:</strong> confirme 5 elementos — título (40-60 car.), descrição, nome do arquivo, board e alt text. Depois publique 3-5 pins/dia por 30 dias sem alterar nada (constância é variável de teste).</p>\n<h3>Vazamento 4 — Nada funciona em nenhum ângulo</h3>\n<p><strong>Diagnóstico:</strong> a <strong>oferta</strong> está errada, não o conteúdo.</p>\n<p><strong>Correção:</strong> volte ao capítulo 04. Em 90% dos casos é: produto de ticket baixo com comissão baixa, ou produto que ninguém busca.</p>\n<h3>Vazamento 5 — Resultado ótimo que morre de repente</h3>\n<p><strong>Diagnóstico:</strong> punição de conta (volume, repetição, encurtador, categoria).</p>\n<p><strong>Correção:</strong> capítulo 08, plano de recuperação. Reduza volume, aumente conteúdo não promocional, espere 2 semanas.</p>\n<hr>\n<h2>11.6 Rotina de medição</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Frequência</th><th>O que fazer</th><th>Tempo</th></tr></thead><tbody><tr><td><strong>Diário</strong></td><td>Nada. Não olhe métricas todo dia — elas são ruído de curtíssimo prazo</td><td>0 min</td></tr><tr><td><strong>Semanal (segunda)</strong></td><td>Anote: impressões, cliques, saves, vendas, receita da semana. Compare com a anterior</td><td>10 min</td></tr><tr><td><strong>Mensal (dia 1)</strong></td><td>Rode o Prompt 12 com os dados do mês. Rode a autoauditoria de compliance. Decida: escalar / pivotar / matar</td><td>45 min</td></tr><tr><td><strong>Trimestral</strong></td><td>RPM por oferta e por via. Decisão estratégica de diversificação</td><td>2 h</td></tr></tbody></table></div>\n<p>⚠️ <strong>Regra do Pinterest:</strong> os números têm <strong>atraso de indexação</strong> e o pin forte continua crescendo por meses. Avaliar um pin na primeira semana é ler um livro pela capa. Dê <strong>30 dias</strong> antes de julgar qualquer coisa.</p>\n<hr>\n<h2>11.7 Modelo de planilha (copie no Sheets)</h2>\n<pre class=\"prompt curto\">| Data | Pins novos | Impressões | Saves | Cliques | Sessões | Vendas | Receita | CTR | Conv | RPM | Decisão |\n|------|-----------|-----------|-------|---------|---------|--------|---------|-----|------|-----|---------|\n| S1   | 21        | 3.200     | 18    | 9       | 8       | 0      | 0       |     |      |     |         |\n| S2   | 24        | 8.400     | 51    | 28      | 25      | 0      | 0       |     |      |     |         |\n| S3   | 19        | 15.100    | 96    | 55      | 49      | 1      | 48,50   |     |      |     |         |\n| S4   | 26        | 24.800    | 148   | 91      | 82      | 2      | 97,00   |     |      |     | Dobrar ângulo B |</pre>\n<p><strong>A coluna \"Decisão\" é a mais importante da planilha.</strong> Sem ela, você tem dados; com ela, você tem direção.</p>\n<hr>\n<h2>11.8 Sinais de que está na hora de pivotar</h2>\n<p>Pivote quando <strong>três</strong> destes forem verdadeiros ao mesmo tempo:</p>\n<ol>\n<li>Mais de 400 pins publicados no nicho;</li>\n<li>Menos de R$ 100 de receita acumulada em 90 dias;</li>\n<li>Taxa de conversão abaixo de 0,3% em uma amostra de 500+ cliques;</li>\n<li>Nenhuma oferta com RPM acima de R$ 0,50;</li>\n<li>Você já testou pelo menos 8 ângulos diferentes.</li>\n</ol>\n<p><strong>O que NÃO é sinal de pivô:</strong> \"não deu resultado em 3 semanas\". Isso é sinal de paciência, não de estratégia errada.</p>\n<p><strong>Como pivotar sem perder tudo:</strong></p>\n<ul>\n<li>Mantenha a conta e os boards (eles têm autoridade acumulada);</li>\n<li>Troque a <strong>oferta</strong> primeiro (é o maior impacto e o mais rápido);</li>\n<li>Troque o <strong>ângulo</strong> em segundo lugar;</li>\n<li>Só troque o <strong>nicho</strong> se os três anteriores falharem.</li>\n</ul>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"12-escala-e-automacao.md\">12 · Escala, Lotes e Automação</a></p>"},{"arquivo":"12-escala-e-automacao.md","titulo":"Escala, Lotes e Automação — produzir 100 pins em 1 hora","html":"<h1>12 · Escala, Lotes e Automação — produzir 100 pins em 1 hora</h1>\n<blockquote>O gargalo nunca foi criatividade. É <strong>processo</strong>. Este capítulo transforma o trabalho em linha de montagem.</blockquote>\n<hr>\n<h2>12.1 O princípio do lote (batching)</h2>\n<p><strong>Trabalho em lote sempre vence trabalho intercalado.</strong> Trocar de contexto custa caro: cada vez que você muda de \"pensar em títulos\" para \"gerar imagem\", perde 5 a 10 minutos de aquecimento mental.</p>\n<div class=\"rolagem\"><table><thead><tr><th>Modelo</th><th>Como funciona</th><th>Pins/hora</th></tr></thead><tbody><tr><td>❌ Intercalado</td><td>Faz 1 pin do início ao fim, 20 vezes</td><td>8-12</td></tr><tr><td>✅ Em lote</td><td>Todas as imagens → todos os textos → todos os designs → publicação</td><td><strong>40-60</strong></td></tr><tr><td>✅✅ Lote + templates</td><td>Banco de imagens já pronto + template mestre + textos em planilha</td><td><strong>60-100</strong></td></tr></tbody></table></div>\n<hr>\n<h2>12.2 O fluxo de produção em lote (1 hora = 15 pins)</h2>\n<h3>Bloco A · Preparação (10 min) — uma vez por mês</h3>\n<ol>\n<li>Monte a <strong>planilha mestre</strong> com as colunas: <code>#</code>, <code>título</code>, <code>descrição</code>, <code>overlay</code>, <code>arquivo</code>, <code>board</code>, <code>hashtags</code>, <code>prompt_imagem</code>, <code>destino</code>, <code>data_publicação</code>.</li>\n<li>Crie o <strong>template mestre no Canva</strong> (1000×1500) com 10 páginas: cada página é uma variação de layout.</li>\n<li>Crie uma <strong>pasta de imagens</strong> organizada por tema.</li>\n</ol>\n<h3>Bloco B · Geração de texto (10 min) — gera 15 pins</h3>\n<ol>\n<li>Abra o ChatGPT e cole o <strong>Prompt 4 (Fábrica de Pins)</strong> com o ângulo escolhido.</li>\n<li>Peça 5 pins. Repita para 3 ângulos = 15 pins.</li>\n<li>Cole tudo na planilha mestre (ou importe o CSV gerado pelo app).</li>\n</ol>\n<h3>Bloco C · Geração de imagens (20 min)</h3>\n<ol>\n<li>Copie os 15 prompts de imagem, um por um, no gerador grátis.</li>\n<li>Para cada prompt, gere <strong>2 variações</strong> (30 imagens) e escolha as 15 melhores.</li>\n<li>Salve com o nome do arquivo já definido na planilha.</li>\n</ol>\n<blockquote>💡 <strong>Truque de volume:</strong> no Leonardo/Ideogram, gere em lote de 4. Você aprova 1 e descarta 3 — é mais rápido que ajustar prompt.</blockquote>\n<h3>Bloco D · Design (15 min)</h3>\n<ol>\n<li>Canva → template mestre → duplicar página.</li>\n<li>Arraste a imagem, troque o texto do overlay (copie da planilha), exporte PNG.</li>\n<li>Repita 15 vezes. <strong>Sem pensar em design</strong>: você já decidiu isso no template.</li>\n</ol>\n<h3>Bloco E · Publicação (5 min)</h3>\n<ol>\n<li>Publique ou agende 5 pins (os outros 10 ficam no estoque).</li>\n<li>Cole o link manualmente em cada um.</li>\n<li>Marque na planilha a data.</li>\n</ol>\n<p><strong>Conta final:</strong> 15 pins prontos + 5 publicados em 60 minutos. Três sessões por semana = 45 pins/semana = ~180/mês.</p>\n<hr>\n<h2>12.3 Como multiplicar por 10 sem produzir 10x</h2>\n<h3>Multiplicador 1 — Reciclagem de vencedores (o mais rentável)</h3>\n<p>Pegue os 10 pins com melhor RPM e <strong>refaça</strong> cada um com:</p>\n<ul>\n<li>fundo diferente</li>\n<li>layout diferente</li>\n<li>título diferente (mesma promessa)</li>\n</ul>\n<p>Resultado: <strong>10 pins novos, custo quase zero</strong>, e a chance de acerto é muito maior porque você partiu de algo comprovado.</p>\n<h3>Multiplicador 2 — Um conteúdo, muitos formatos</h3>\n<pre class=\"prompt curto\">1 artigo de blog (ou 1 página de destino)\n    ├── 5 pins estáticos (5 designs diferentes)\n    ├── 2 video pins (9:16, 6-15s)\n    ├── 1 carrossel (5 slides)\n    ├── 1 post para a lista de e-mail\n    └── 1 pack de 10 stories/Reels adaptados</pre>\n<p><strong>Um esforço de escrita → 9 ativos distribuíveis.</strong></p>\n<h3>Multiplicador 3 — Um ângulo, cinco modificadores</h3>\n<p>Pegue o ângulo vencedor e aplique:</p>\n<ol>\n<li><strong>Por público</strong> (para iniciantes / para quem tem pouco espaço / para quem trabalha fora)</li>\n<li><strong>Por orçamento</strong> (até R$ 50 / sem gastar nada)</li>\n<li><strong>Por tempo</strong> (em 15 minutos / em um fim de semana / em 30 dias)</li>\n<li><strong>Por restrição</strong> (sem furar parede / sem equipamento / em apartamento)</li>\n<li><strong>Por estação</strong> (versão de verão / de inverno / de Natal)</li>\n</ol>\n<p><strong>5 modificadores × 5 designs = 25 pins frescos de um único ângulo comprovado.</strong></p>\n<h3>Multiplicador 4 — Idioma</h3>\n<p>Para cada 10 pins em português, gere 10 em inglês (e/ou espanhol). O custo é uma tradução localizada por IA (não literal!). O mercado anglófono tem CPM e comissões maiores — vale testar em paralelo com 20-30% do volume.</p>\n<h3>Multiplicador 5 — Sazonalidade antecipada</h3>\n<p>Todo conteúdo evergreen pode gerar uma versão sazonal:</p>\n<pre class=\"prompt curto\">\"Organização de cozinha pequena\" →\n   versão \"cozinha organizada para o Natal\"\n   versão \"cozinha em ordem na volta às aulas\"\n   versão \"cozinha limpa depois das festas\"</pre>\n<p>Cada versão entra no calendário 30-60 dias antes do pico.</p>\n<h3>Multiplicador 6 — Reaproveitamento em outras plataformas</h3>\n<p>Os mesmos ativos servem para: Google Discover/SEO (o artigo), Reels e Stories (o vídeo), LinkedIn (o carrossel), YouTube Shorts (o video pin). <strong>O Pinterest é a fábrica; as outras plataformas são distribuição adicional gratuita.</strong></p>\n<hr>\n<h2>12.4 Automação: a linha entre produtivo e proibido</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Tarefa</th><th>Automação</th><th>Status</th></tr></thead><tbody><tr><td>Geração de títulos e descrições em lote</td><td>✅ ChatGPT/Planilha</td><td>Seguro</td></tr><tr><td>Geração de imagens em lote</td><td>✅ Gerador de IA em batch</td><td>Seguro</td></tr><tr><td>Nomear arquivos em lote</td><td>✅ Script/planilha</td><td>Seguro</td></tr><tr><td>Redimensionar imagens em lote</td><td>✅ Canva (copiar estilos)</td><td>Seguro</td></tr><tr><td>Agendar publicação</td><td>✅ Agendador nativo/Metricool/Buffer</td><td>Seguro e recomendado</td></tr><tr><td>Publicar em massa sem revisão via API</td><td>❌ Viola diretrizes do Pinterest</td><td><strong>Proibido</strong></td></tr><tr><td>Auto-follow / auto-comment / auto-like</td><td>❌ Padrão de spam</td><td><strong>Proibido</strong></td></tr><tr><td>Bot que posta 50 pins/dia</td><td>❌ Spam</td><td><strong>Proibido</strong></td></tr><tr><td>Rotacionar proxies para burlar limites</td><td>❌ Evasão</td><td><strong>Proibido e permanente</strong></td></tr></tbody></table></div>\n<p><strong>A regra que resume tudo:</strong> automatize a <strong>produção</strong> sem limite; automatize a <strong>publicação</strong> apenas com revisão humana de cada item.</p>\n<hr>\n<h2>12.5 Sistemas anti-caos (o que separa amador de operador)</h2>\n<h3>1. A planilha mestre (a única fonte de verdade)</h3>\n<p>Uma planilha com todos os pins, status, board, data e link. Se não está na planilha, não existe. É o seu inventário.</p>\n<h3>2. O calendário de estoque</h3>\n<pre class=\"prompt curto\">Produza 15 pins por sessão.\nPublique 5 por dia.\nEstoque inicial: 0\nApós 1 semana (3 sessões): 45 produzidos, 35 publicados → estoque 10\nApós 1 mês: estoque de 30-50 pins de reserva</pre>\n<p>Ter estoque significa <strong>nunca ficar sem publicar por falta de tempo</strong>. Buffer de 30 pins = 6 dias de folga.</p>\n<h3>3. A biblioteca de templates</h3>\n<p>No Canva (grátis), mantenha uma pasta com:</p>\n<ul>\n<li>3 a 5 templates mestre (2:3, 9:16, carrossel)</li>\n<li>Paleta e fontes documentadas</li>\n<li>Elementos reutilizáveis (blocos de cor, ícones, molduras)</li>\n</ul>\n<h3>4. O arquivo de prompts vencedores</h3>\n<p>Um documento (ou o app) com os prompts que <strong>já deram certo</strong> para o seu nicho — em especial os prompts de imagem que geraram as melhores imagens. Reutilizar prompt comprovado economiza metade do tempo.</p>\n<h3>5. O registro de experimentos</h3>\n<pre class=\"prompt curto\">| Data | Teste | Hipótese | Resultado | Conclusão |\n|------|-------|----------|-----------|-----------|\n| 12/03 | Fundo escuro vs claro | Escuro dá mais save | Escuro 3,1/1k vs claro 6,8/1k | Usar claro |\n| 20/03 | 5 palavras vs 8 no overlay | Menos é mais | 8 palavras +40% CTR | Usar 6-8 |</pre>\n<p><strong>Sem registro, você repete o mesmo erro em 3 meses</strong> — e essa é a falha mais comum e mais cara.</p>\n<h3>6. O painel de links</h3>\n<p>Uma aba com todos os links de afiliado, oferta, data de verificação e status. Rode uma verificação mensal de todos (link quebrado em pin ativo = dinheiro perdido silenciosamente).</p>\n<hr>\n<h2>12.6 Terceirização (quando fizer sentido)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Tarefa</th><th>Custo de mercado</th><th>Vale terceirizar?</th></tr></thead><tbody><tr><td>Montagem de pins no Canva</td><td>R$ 3-8 por pin</td><td>✅ Quando passar de 100 pins/mês</td></tr><tr><td>Geração de imagens</td><td>R$ 2-5 por imagem</td><td>✅ Quando o volume travar seu tempo</td></tr><tr><td>Redação de artigos</td><td>R$ 50-150 por artigo</td><td>🟡 Só depois de validar o nicho</td></tr><tr><td>Gestão de conta completa</td><td>R$ 800-2.500/mês</td><td>❌ Só quando a conta já faturar 5x isso</td></tr><tr><td>Edição de vídeo curto</td><td>R$ 20-60 por vídeo</td><td>✅ Se vídeo for prioridade e você odeia editar</td></tr></tbody></table></div>\n<p><strong>Regra de ouro da terceirização:</strong> só terceirize o que você <strong>já sabe fazer e já validou</strong>. Terceirizar antes de entender o processo é contratar para você mesmo a ineficiência.</p>\n<hr>\n<h2>12.7 A equação da escala</h2>\n<pre class=\"prompt curto\">Resultado = (Qualidade média do pin)\n          × (Número de pins publicados)\n          × (Tempo que cada pin continua ativo)\n\nOnde:\n  Qualidade média → vem da validação (caps. 04 e 05)\n  Número de pins  → vem do lote (este capítulo)\n  Tempo ativo     → vem da escolha de nicho evergreen + frescor</pre>\n<p>Multiplique <strong>qualquer um</strong> dos três e o resultado cresce linearmente. Multiplique <strong>os três</strong> e você sai de R$ 100 para R$ 3.000 por mês sem trabalhar mais horas — só melhorando o sistema.</p>\n<p><strong>A pergunta que você deve fazer toda semana:</strong></p>\n<blockquote>\"Qual dos três fatores está mais fraco agora?\"</blockquote>\n<ul>\n<li>Pouca qualidade → os pins não convertem (rode o diagnóstico, cap. 11)</li>\n<li>Pouca quantidade → o acervo é pequeno (aumente sessões de lote)</li>\n<li>Pouco tempo ativo → nicho errado ou pins morrendo rápido (mude para evergreen)</li>\n</ul>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"13-erros-e-contraexemplos.md\">13 · Erros e Contra-Exemplos</a></p>"},{"arquivo":"13-erros-e-contraexemplos.md","titulo":"Erros e Contra-Exemplos — o que mata projetos","html":"<h1>13 · Erros e Contra-Exemplos — o que mata projetos</h1>\n<blockquote>24 erros, 9 mitos e os padrões de fracasso que se repetem sempre.</blockquote>\n<hr>\n<h2>13.1 Os 24 erros que matam projetos</h2>\n<h3>🧭 Erros de estratégia (os que custam meses)</h3>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Erro</th><th>Por que mata</th><th>Correção</th></tr></thead><tbody><tr><td>1</td><td>Escolher nicho por paixão, sem validar oferta</td><td>Meses de trabalho sem nada para vender</td><td>Valide primeiro no capítulo 04</td></tr><tr><td>2</td><td>Fazer pins bonitos antes de escolher a oferta</td><td>80% do trabalho vira desperdício</td><td>Ordem correta: oferta → ângulo → visual</td></tr><tr><td>3</td><td>Escolher produto de R$ 27 com 20% de comissão</td><td>R$ 5,40/venda exige volume absurdo</td><td>Ticket ≥ R$ 47 e comissão ≥ 40%</td></tr><tr><td>4</td><td>Depender de um único produtor de afiliado</td><td>Se ele desativar o programa, sua renda zera</td><td>Sempre 1 principal + 2 secundárias</td></tr><tr><td>5</td><td>Tentar 4 vias de monetização na semana 1</td><td>Diluição total, nenhuma funciona</td><td>Empilhe uma via por fase (cap. 09)</td></tr><tr><td>6</td><td>Mirar nicho que <strong>não compra</strong> (humor, citações, wallpaper)</td><td>Impressiona, não converte</td><td>Oferta tem que existir</td></tr><tr><td>7</td><td>Só conteúdo sazonal</td><td>Picos e vales brutais</td><td>70% evergreen + 30% sazonal</td></tr><tr><td>8</td><td>Escolher keyword ampla (\"decoração\")</td><td>Concorrência impossível</td><td>Sub-nicho long-tail (cap. 03)</td></tr></tbody></table></div>\n<h3>🎨 Erros de produção</h3>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Erro</th><th>Por que mata</th><th>Correção</th></tr></thead><tbody><tr><td>9</td><td>Pin quadrado ou horizontal</td><td>Perde 30% a 45% de distribuição</td><td>Sempre 2:3 (1000×1500)</td></tr><tr><td>10</td><td>Sem texto no overlay</td><td>Perde +110% de cliques</td><td>5-8 palavras em bold</td></tr><tr><td>11</td><td>Overlay com 15 palavras</td><td>Ilegível no feed</td><td>Máximo 8 palavras</td></tr><tr><td>12</td><td>Baixo contraste</td><td>Não lê no celular</td><td>Teste do brilho a 30%</td></tr><tr><td>13</td><td>Borda grossa</td><td>-9% de impressões</td><td>Remova a borda</td></tr><tr><td>14</td><td>Texto dentro da imagem gerada por IA</td><td>Texto torto = cara de amador</td><td>Texto sempre no Canva</td></tr><tr><td>15</td><td>Imagem com mão/dente deformados</td><td>Público rejeita, algoritmo sinaliza</td><td>Gere 5, escolha a mais natural</td></tr><tr><td>16</td><td>Repinar o próprio pin e chamar de novo</td><td>Não é pin fresco, não distribui</td><td>Novo design, mesmo link</td></tr><tr><td>17</td><td>Publicar 10 pins do mesmo link no mesmo dia</td><td>Filtro de spam</td><td>72h entre pins do mesmo link</td></tr><tr><td>18</td><td>Marca d'água do TikTok no vídeo</td><td>Penalização de alcance</td><td>Reexporte limpo no CapCut</td></tr></tbody></table></div>\n<h3>📊 Erros de dados</h3>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Erro</th><th>Por que mata</th><th>Correção</th></tr></thead><tbody><tr><td>19</td><td>Julgar um pin na primeira semana</td><td>Pinterest tem atraso e cauda longa</td><td>Espere 30 dias</td></tr><tr><td>20</td><td>Olhar curtidas em vez de cliques</td><td>Métrica que não paga nada</td><td>Meça CTR, conversão e RPM</td></tr><tr><td>21</td><td>Não usar UTM no link</td><td>Você não sabe qual pin vendeu</td><td><code>?utm_campaign=nome-do-pin</code></td></tr><tr><td>22</td><td>Continuar no que não funciona por orgulho</td><td>Custo de oportunidade</td><td>Corte em 30 dias com dados</td></tr></tbody></table></div>\n<h3>⚖️ Erros que derrubam a conta</h3>\n<div class=\"rolagem\"><table><thead><tr><th>#</th><th>Erro</th><th>Por que mata</th><th>Correção</th></tr></thead><tbody><tr><td>23</td><td>Encurtador de link (bit.ly)</td><td>Bloqueado/marcado como spam</td><td>URL completa sempre</td></tr><tr><td>24</td><td>Afiliado sem aviso de transparência</td><td>Viola regras e lei</td><td>Aviso no pin <strong>e</strong> na página</td></tr></tbody></table></div>\n<hr>\n<h2>13.2 Os 9 mitos (e a verdade)</h2>\n<p><strong>Mito 1 — \"Preciso de muitos seguidores no Pinterest.\"</strong></p>\n<p>❌ Falso. 97% das buscas são não-marcadas. Contas com 50 seguidores superam contas com 50 mil quando a keyword é melhor.</p>\n<p><strong>Mito 2 — \"Hashtags são essenciais.\"</strong></p>\n<p>❌ Desatualizado. Hashtags hoje pesam cerca de 1% do ranking. Keyword no título, descrição, board e <strong>nome do arquivo</strong> pesam muito mais.</p>\n<p><strong>Mito 3 — \"Preciso postar todo dia no mesmo horário.\"</strong></p>\n<p>🟡 Parcialmente. Constância importa mais que horário exato. O Pinterest é buscador, não feed cronológico — o horário exato tem impacto marginal.</p>\n<p><strong>Mito 4 — \"Vídeo é melhor que imagem estática.\"</strong></p>\n<p>❌ Depende do objetivo. Vídeo dá +185% impressões, mas o estático gera <strong>3x mais cliques de saída</strong> (4,8 contra 1,6 por 1.000). Para vender, estático.</p>\n<p><strong>Mito 5 — \"IA vai gerar conteúdo genérico e o Pinterest penaliza.\"</strong></p>\n<p>🟡 Meia verdade. O que o público rejeita é conteúdo <strong>genérico</strong>, venha de IA ou não. IA com bom prompt + edição humana + decisões estratégicas certas performa igual. O sinal de \"cara de IA\" (texto torto, mãos deformadas, rostos plásticos) é que é penalizado.</p>\n<p><strong>Mito 6 — \"Preciso de site para começar.\"</strong></p>\n<p>❌ Não. Você pode linkar direto para a oferta (se o programa permitir) ou usar uma página gratuita (Gumroad, Notion, Payhip). Mas o site acelera e facilita o compliance.</p>\n<p><strong>Mito 7 — \"Pinterest é só para público feminino.\"</strong></p>\n<p>🟡 Desatualizado. Cerca de um terço dos usuários nos EUA é masculino, e a plataforma reportou mais de 630 milhões de usuários ativos mensais em 2026. Nichos de ferramentas, finanças, tecnologia e negócios funcionam bem.</p>\n<p><strong>Mito 8 — \"Existe um horário mágico de postagem.\"</strong></p>\n<p>❌ Não existe. O que existe é <strong>volume consistente</strong> e <strong>pin fresco</strong>.</p>\n<p><strong>Mito 9 — \"Posso automatizar tudo e ficar rico dormindo.\"</strong></p>\n<p>❌ E é aqui que as contas morrem. As diretrizes do Pinterest proíbem apps que executam ações sem consideração individual. Automação em massa = suspensão. O que existe é <strong>escala de produção com revisão humana</strong>.</p>\n<hr>\n<h2>13.3 Cinco contra-exemplos (o que parece bom e não é)</h2>\n<h3>Contra-exemplo 1 — O pin lindo que não vende</h3>\n<p>Você faz um pin artisticamente impecável com uma ilustração de IA impressionante. Ele ganha 300 saves e 4 cliques.</p>\n<p><strong>O erro:</strong> a imagem não deixa claro o que a pessoa ganha ao clicar. Save ≠ clique. O pin bonito é \"colecionável\", não \"acionável\".</p>\n<p><strong>A correção:</strong> adicione um overlay com verbo de ação e a promessa do que há no link.</p>\n<h3>Contra-exemplo 2 — Os 500 pins de um dia</h3>\n<p>Você descobre a produção em lote e publica 60 pins na terça-feira. Depois, nada por uma semana.</p>\n<p><strong>O erro:</strong> volume concentrado seguido de silêncio é padrão clássico de bot — o que o Pinterest pune.</p>\n<p><strong>A correção:</strong> produza em lote, <strong>publique em ritmo constante</strong> (3-5/dia). Estoque é a solução, não publicação em massa.</p>\n<h3>Contra-exemplo 3 — O nicho que \"todo mundo ama\"</h3>\n<p>Você escolhe nicho de frases motivacionais. Milhares de saves. Zero cliques, zero vendas.</p>\n<p><strong>O erro:</strong> o público salva porque gosta, mas não havia nada para comprar — não existia oferta nem intenção comercial.</p>\n<p><strong>A correção:</strong> sempre valide com a pergunta \"existem 5 ofertas que pagam neste nicho?\"</p>\n<h3>Contra-exemplo 4 — A comissão alta que nunca chega</h3>\n<p>Você promove um produto de R$ 997 com 80% de comissão (R$ 797!). Em 3 meses: 1 venda.</p>\n<p><strong>O erro:</strong> tráfego frio de Pinterest raramente converte em ticket alto sem funil. Compra por impulso acontece entre R$ 27 e R$ 197.</p>\n<p><strong>A correção:</strong> use produto de entrada barato → capture e-mail → venda o caro depois.</p>\n<h3>Contra-exemplo 5 — O sucesso que desaparece</h3>\n<p>Sua conta cresce 300% em 3 semanas. Você aumenta o volume para 30 pins/dia e 10 links de afiliado por pin. Duas semanas depois, impressões caem 80%.</p>\n<p><strong>O erro:</strong> excesso de afiliado + volume anormal + repetição. Você treinou o algoritmo a te ver como conta promocional.</p>\n<p><strong>A correção:</strong> voltar para 80/20, reduzir volume, esperar 2-3 semanas. Prevenção: nunca passe de 5 pins/dia por reflexo de euforia.</p>\n<hr>\n<h2>13.4 Os 7 anti-padrões de mentalidade</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Anti-padrão</th><th>Como aparece</th><th>Antídoto</th></tr></thead><tbody><tr><td><strong>Perfeccionismo</strong></td><td>\"Vou lançar quando o template estiver perfeito\"</td><td>Publique imperfeito hoje. Pin ruim publicado ensina; pin perfeito não publicado, não</td></tr><tr><td><strong>Comparação com o topo</strong></td><td>\"Ele tem 1 milhão de pins\"</td><td>Ele publicou 2.000 pins. Olhe o processo, não o resultado</td></tr><tr><td><strong>Desistência no vale</strong></td><td>Dias 10-25, quando nada aconteceu ainda</td><td>O cronograma do cap. 10 mostra que é esperado</td></tr><tr><td><strong>Troca de nicho a cada 2 semanas</strong></td><td>Reinicia o relógio sempre</td><td>Comprometa-se por 90 dias e 300 pins</td></tr><tr><td><strong>Buscar o truque secreto</strong></td><td>Consome 5 horas de vídeo por dia</td><td>Não existe. Existe volume + iteração + leitura de dados</td></tr><tr><td><strong>Confundir atividade com progresso</strong></td><td>4 horas \"pesquisando\"</td><td>Métrica: pins publicados, não horas estudadas</td></tr><tr><td><strong>Otimizar antes de testar</strong></td><td>Ajusta template 20 vezes antes de publicar 5 pins</td><td>Publique 20 variações, deixe os dados decidirem</td></tr></tbody></table></div>\n<hr>\n<h2>13.5 Sinais precoces de que você está no caminho certo</h2>\n<p>Marque quantos você reconhece:</p>\n<ul class=\"lista-check\">\n<li>☐ Você publica mesmo quando não está inspirado</li>\n<li>☐ Você sabe de cor o CTR do seu melhor pin</li>\n<li>☐ Você cortou um ângulo que gostava porque os dados disseram para cortar</li>\n<li>☐ Você tem mais de 30 pins de estoque</li>\n<li>☐ Você tem uma planilha que só você entende</li>\n<li>☐ Você já rodou o Prompt 14 (compliance) sem precisar de aviso</li>\n<li>☐ Você parou de olhar curtidas</li>\n<li>☐ Você já tem uma segunda oferta mapeada</li>\n<li>☐ Você consegue produzir 15 pins em 1 hora sem pensar</li>\n<li>☐ Você tem um registro de experimentos com data e conclusão</li>\n</ul>\n<p><strong>6 ou mais marcados:</strong> você é operador, não iniciante. O resultado é questão de tempo e volume.</p>\n<p><strong>Menos de 3:</strong> releia os capítulos 10, 11 e 12 e implemente o sistema.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"14-perguntas-frequentes.md\">14 · Perguntas Frequentes</a></p>"},{"arquivo":"14-perguntas-frequentes.md","titulo":"Perguntas Frequentes — 40 respostas diretas","html":"<h1>14 · Perguntas Frequentes — 40 respostas diretas</h1>\n<hr>\n<h2>Sobre começar</h2>\n<p><strong>1. Quanto dinheiro preciso para começar?</strong></p>\n<p>R$ 0. Todo o stack do capítulo 07 é gratuito. O primeiro gasto opcional só se justifica depois de ter receita (domínio ~R$ 40/ano).</p>\n<p><strong>2. Quanto tempo até ver resultado?</strong></p>\n<p>Impressões começam a subir entre o dia 8 e 30. Primeiras vendas geralmente entre o dia 20 e 60. Receita relevante entre o mês 3 e 6. Depende de volume e oferta.</p>\n<p><strong>3. Quantos pins preciso publicar?</strong></p>\n<p>3 a 5 por dia, por 90 dias. Ao final desse período você tem 300-450 pins no acervo — e é o acervo, não o dia, que gera receita.</p>\n<p><strong>4. Posso usar minha conta pessoal do Pinterest?</strong></p>\n<p>Sim, convertendo em conta business (grátis). Mas se a conta tem conteúdo fora do nicho, o algoritmo demora a recategorizar. Uma conta nova limpa é mais rápida.</p>\n<p><strong>5. Preciso de site/blog?</strong></p>\n<p>Não para começar. Você pode linkar direto para a oferta (se o programa permitir) ou usar página gratuita. Mas o site acelera o compliance e permite dupla monetização (anúncio + afiliado).</p>\n<p><strong>6. Preciso aparecer em vídeo?</strong></p>\n<p>Não. Video pin funciona com texto na tela, b-roll, demonstração de mãos, processo (sem rosto). Você pode usar imagens com movimento no CapCut.</p>\n<p><strong>7. Dá para fazer só com o celular?</strong></p>\n<p>Dá para <em>publicar</em>, mas produção (Canva, CapCut, imagens) é muito mais eficiente no computador. Recomendo: produzir no desktop 1x/semana, publicar/agendar do celular.</p>\n<p><strong>8. Funciona no Brasil ou é coisa de gringo?</strong></p>\n<p>Funciona nos dois. O Pinterest tem base forte no Brasil (moda, decoração, receitas, finanças). O mercado anglófono tem CPM e comissões maiores — vale testar em paralelo depois do primeiro mês.</p>\n<hr>\n<h2>Sobre dinheiro</h2>\n<p><strong>9. Qual a forma mais rápida de faturar?</strong></p>\n<p>Serviço (via 7): gestão de Pinterest para pequenos negócios. Você usa seus próprios pins como portfólio. R$ 800-2.500/mês por cliente, receita imediata sem depender de algoritmo.</p>\n<p><strong>10. Qual a mais rentável no longo prazo?</strong></p>\n<p>Produto digital próprio (margem 80-100%) e afiliado SaaS recorrente (você recebe todo mês pelo mesmo cliente).</p>\n<p><strong>11. Quanto ganha quem faz isso bem?</strong></p>\n<p>Faixas de mercado variam de R$ 300 (iniciante, mês 2-3) a mais de R$ 20.000/mês (operação madura com múltiplas vias). <strong>Não existe garantia</strong> — o resultado depende de volume, oferta e constância.</p>\n<p><strong>12. Posso viver disso?</strong></p>\n<p>Com 1 cliente de serviço + 1 via de afiliado rodando + um produto próprio, é possível chegar a R$ 3.000-5.000/mês em 4-6 meses de execução consistente. Mais que isso exige escala e tempo.</p>\n<p><strong>13. Fatura VIP ou tem época melhor?</strong></p>\n<p>Q4 (outubro-dezembro) é o trimestre mais forte para decoração, presentes, receitas e casamento. Janeiro é forte para fitness, finanças e produtividade.</p>\n<p><strong>14. Vale mais afiliado ou produto próprio?</strong></p>\n<p>Os dois. Use afiliado para <strong>validar</strong> o nicho rápido (você não precisa criar nada) e produto próprio para <strong>capturar margem</strong> depois que o nicho provou que compra.</p>\n<p><strong>15. Como sei se a oferta está pagando?</strong></p>\n<p>Use UTMs. Sem <code>utm_campaign</code> por pin, você só sabe \"vendeu pelo Pinterest\" — não sabe <strong>qual pin</strong> vendeu. Isso é a diferença entre escalar e adivinhar.</p>\n<hr>\n<h2>Sobre IA</h2>\n<p><strong>16. Preciso pagar ChatGPT Plus?</strong></p>\n<p>Não. O plano gratuito do ChatGPT, do Gemini ou do Claude dá conta dos 15 prompts deste material. A versão paga melhora a velocidade e a consistência, não o método.</p>\n<p><strong>17. As imagens de IA podem ser usadas comercialmente?</strong></p>\n<p>Depende da ferramenta. Adobe Firefly (mais seguro — treinado em conteúdo licenciado), Ideogram e Leonardo permitem. <strong>O Designer/Bing de consumidor restringe uso comercial</strong> — confira os termos. Geradores de vídeo grátis (Kling, Hailuo) geralmente <strong>não permitem</strong> uso comercial.</p>\n<p><strong>18. O Pinterest penaliza conteúdo de IA?</strong></p>\n<p>O que é penalizado é conteúdo <strong>genérico</strong>. IA bem usada (bons prompts + edição + estratégia) não tem marcação especial. O que o público rejeita é a \"cara de IA\": texto torto, mãos deformadas, pele plástica. Sempre gere 5 e escolha a mais natural.</p>\n<p><strong>19. Posso gerar o pin inteiro com IA (inclusive o texto na imagem)?</strong></p>\n<p>Pode, mas não deve. Modelos frequentemente erram a tipografia — e texto torto é o sinal nº 1 de amadorismo. Gere só a imagem e coloque o texto no Canva.</p>\n<p><strong>20. Qual o melhor gerador de imagem grátis?</strong></p>\n<p>Depende: <strong>volume</strong> → Bing/Designer; <strong>variedade de estilos</strong> → Leonardo; <strong>texto dentro da imagem</strong> → Ideogram; <strong>segurança jurídica</strong> → Firefly; <strong>montar o pin</strong> → Canva.</p>\n<p><strong>21. IA escreve o artigo do blog inteiro?</strong></p>\n<p>Escreve o rascunho completo (Prompt 7). Você revisa, adiciona exemplos reais e ajusta o tom. Publicar 100% cru é identificável e prejudica a confiança.</p>\n<p><strong>22. Quanto tempo economizo com IA?</strong></p>\n<p>Cerca de 70-80% do tempo de produção textual e visual. O que sobra é o que importa: escolher oferta, julgar visual, ler métricas.</p>\n<hr>\n<h2>Sobre o Pinterest funcionando</h2>\n<p><strong>23. Por que meus pins não têm nenhuma impressão?</strong></p>\n<p>Causas prováveis, em ordem: (1) menos de 3 pins/dia; (2) falta de keyword no título/descrição/nome do arquivo; (3) conta nova (o Pinterest leva 1-3 semanas para confiar); (4) pins repetidos (não frescos).</p>\n<p><strong>24. Por que tenho muitos saves e poucos cliques?</strong></p>\n<p>Seu pin é \"colecionável\" mas não \"acionável\". Falta um verbo de ação no overlay e uma promessa que só se completa no link.</p>\n<p><strong>25. Por que tenho cliques mas não vendo?</strong></p>\n<p>Três suspeitos: (1) quebra de promessa entre pin e página; (2) oferta fraca/sem prova social; (3) volume insuficiente de dados para julgar (menos de 500 cliques). Veja a árvore do capítulo 11.</p>\n<p><strong>26. Devo apagar pins que não performam?</strong></p>\n<p>Não apague — reescreva. Título e descrição podem ser editados. Se após 60 dias o pin tem zero clique com impressões razoáveis, deixe lá (não custa nada) e foque energia nos vencedores.</p>\n<p><strong>27. Posso postar o mesmo link várias vezes?</strong></p>\n<p>Sim, com <strong>imagem nova</strong> (pin fresco) e <strong>mínimo 72h de intervalo</strong>. É o método descrito no capítulo 02.</p>\n<p><strong>28. Quantos boards devo ter?</strong></p>\n<p>5 a 10 para começar. Cada board é um assunto declarado. Mais que isso dilui; menos que isso limita.</p>\n<p><strong>29. Grupo de boards ainda vale a pena?</strong></p>\n<p>Marginalmente. Muitos grupos proíbem link de afiliado direto e têm regras rígidas. Priorize seus próprios boards.</p>\n<p><strong>30. Preciso de Pinterest Ads?</strong></p>\n<p>Não para começar. Anúncios aceleram, mas o orgânico é gratuito e composto. Se for anunciar depois, comece com R$ 10-20/dia testando o pin que já performou organicamente.</p>\n<p><strong>31. Meu pin viralizou. E agora?</strong></p>\n<p>① Crie 5 variações do vencedor imediatamente. ② Anote o que ele tem (cor, verbo, formato). ③ Replique em outros ângulos. ④ Aproveite a onda: o Pinterest distribui mais conteúdo de contas em alta.</p>\n<p><strong>32. Quanto tempo um pin fica ativo?</strong></p>\n<p>Pins fortes surfam por 3 a 6 meses; conteúdos de casamento, decoração e receitas podem render por anos. Meça cliques no mês 3 — é o sinal de que o pin tem vida longa.</p>\n<hr>\n<h2>Sobre compliance e risco</h2>\n<p><strong>33. Link de afiliado é permitido no Pinterest?</strong></p>\n<p>Sim, com transparência e valor original. O que não é permitido: encurtador, spam repetitivo e conteúdo sem revelar a relação comercial.</p>\n<p><strong>34. Posso usar encurtador para ficar bonito?</strong></p>\n<p>Não. Encurtadores (bit.ly, tinyurl) são bloqueados ou marcados como spam. Use a URL completa.</p>\n<p><strong>35. E se meu programa de afiliado proibir link direto?</strong></p>\n<p>Use uma página intermediária (blog, Notion, Gumroad, landing page) e linke a página. É o método recomendado de qualquer forma, porque blinda você das mudanças de regra.</p>\n<p><strong>36. O que fazer se receber um aviso?</strong></p>\n<p>Não recorra no impulso. Identifique a regra, corrija <strong>todos</strong> os pins afetados, pause publicação 72h, reduza volume, volte gradualmente. O plano completo está no capítulo 08.</p>\n<p><strong>37. Vale a pena criar conta nova depois de uma punição?</strong></p>\n<p>Nunca. Isso é evasão de banimento e resulta em banimento permanente de dispositivo/rede.</p>\n<hr>\n<h2>Sobre o app e a Bíblia</h2>\n<p><strong>38. O app precisa de internet?</strong></p>\n<p>Não. Ele roda 100% offline no navegador. Só precisa de internet para copiar prompts no ChatGPT ou gerar imagens.</p>\n<p><strong>39. Meus dados ficam onde?</strong></p>\n<p>No seu navegador (<code>localStorage</code>). Nada é enviado a servidor nenhum. Se limpar os dados do navegador, os projetos somem — por isso o botão <strong>Exportar</strong> (JSON) existe. Exporte, no mínimo, uma vez por semana.</p>\n<p><strong>40. Preciso configurar as integrações de API?</strong></p>\n<p>Não. Elas são opcionais e existem para quem quer gerar texto direto pelo app ou testar a API do Pinterest. O modo recomendado é copiar-e-colar com IA grátis.</p>\n<hr>\n<p><strong>Próximo:</strong> <a href=\"15-fontes.md\">15 · Fontes e Links</a></p>"},{"arquivo":"15-fontes.md","titulo":"Fontes e Links — de onde vieram os números","html":"<h1>15 · Fontes e Links — de onde vieram os números</h1>\n<blockquote>Todos os números usados nesta Bíblia vêm de benchmarks e documentação públicos de 2025-2026. <strong>Plataformas mudam de regra</strong> — os links oficiais no final são os que você deve conferir antes de escalar.</blockquote>\n<hr>\n<h2>15.1 Benchmarks de design e performance (Pinterest)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado na Bíblia</th><th>Fonte</th></tr></thead><tbody><tr><td>2:3 vertical rende +45% impressões e +22% cliques vs quadrado; texto de 5-8 palavras soma +110% cliques; fundo claro/quente +38% saves; pessoa em contexto +14% impressões; borda grossa -9%; título de 40-60 caracteres +67% impressões; 3-5 pins/dia por 90 dias = +22% impressões/pin; top 1% dos pins = 51% das impressões</td><td><strong>GenSumo — Pinterest Marketing Benchmarks Report 2026</strong> (148.000+ pins analisados, 2025-2026) — gensumo.com/research/pinterest-marketing-benchmarks-report</td></tr><tr><td>Vídeo +185% impressões mas 3x menos cliques que estático (1,6 vs 4,8 por 1k); carrossel 112 de índice de impressões; 97% das buscas não-marcadas; 16 semanas de vida média do pin; 85% dos Pinners planejam compras</td><td><strong>GenSumo — Pinterest Marketing Benchmarks Report 2026</strong></td></tr><tr><td>631 milhões de usuários ativos mensais (Q1 2026); +11% ano a ano</td><td><strong>Ignite Social Media — Pinterest Content Strategy 2026</strong> (citando dados reportados pelo Pinterest)</td></tr><tr><td>Idea Pins 4x saves e 3,2x cliques de saída; Shopping Pin 3,2x conversão; CPM médio</td><td><strong>Digital Applied — Pinterest Statistics 2026: 130+ Marketing Data Points</strong></td></tr><tr><td>Tamanhos (1000×1500 estático, 1080×1920 vídeo); pin \"fresh\" é o maior alavancador em 2026</td><td><strong>PinBoostr — Complete Pinterest Guide 2026</strong> e <strong>Genviral — Pinterest Tips and Tricks 2026</strong></td></tr><tr><td>Hashtags caíram para ~1% do peso de ranking; 72h de espaçamento entre pins do mesmo link</td><td><strong>Genviral — Pinterest Tips and Tricks 2026</strong></td></tr><tr><td>Formatos, durações e especificações de vídeo (6-15s ótimo, até 15 min)</td><td><strong>Cropink — Pinterest Ads Formats 2026</strong></td></tr><tr><td>Tendências de 2026 (cottage-glam, dark academia 2.0, cluttercore curado, sono)</td><td><strong>PostEverywhere — Pinterest Trends 2026: Top 12 Predictions</strong></td></tr><tr><td>Formatos e características por tipo de pin (Idea, Carousel, Collection, Showcase, Quiz)</td><td><strong>Ignite Social Media — Pinterest Content Strategy 2026</strong></td></tr></tbody></table></div>\n<hr>\n<h2>15.2 Política de afiliados e compliance</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado</th><th>Fonte</th></tr></thead><tbody><tr><td>Pinterest permite conteúdo de afiliado com transparência e valor original; encurtadores não suportados</td><td><strong>Pinterest Community Guidelines / Business Guidelines</strong> (via Commission Academy e Effinity)</td></tr><tr><td>Regra do 80/20 (80% conteúdo útil, 20% promocional)</td><td><strong>SocialRails — Pinterest Affiliate Marketing Guide 2026</strong> e <strong>MeetEdgar</strong></td></tr><tr><td>Etsy não permite link direto de afiliado no Pinterest (exige blog intermediário)</td><td><strong>MeetEdgar — How to Use Pinterest for Affiliate Marketing</strong></td></tr><tr><td>Limite de segurança: evitar mais de 150 links de afiliado/dia</td><td><strong>Effinity — Monetize your content with affiliates on Pinterest</strong></td></tr><tr><td>Exigência de aviso de afiliado (FTC / transparência publicitária)</td><td><strong>SocialRails</strong> e <strong>Pingenerator (How to Add Affiliate Links on Pinterest)</strong></td></tr></tbody></table></div>\n<hr>\n<h2>15.3 API e desenvolvimento</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado</th><th>Fonte</th></tr></thead><tbody><tr><td>Pinterest API v5 tem Trial (1.000 req/dia por app, pins em sandbox) e Standard (100 req/s, pins públicos, exige revisão com vídeo)</td><td><strong>Upload-Post — Pinterest API Guide 2026</strong> e <strong>Vorplabs — Pinterest API access tiers</strong></td></tr><tr><td>Escopos necessários: <code>boards:read</code>, <code>boards:write</code>, <code>pins:read</code>, <code>pins:write</code></td><td><strong>Upload-Post</strong></td></tr><tr><td>Token de 30 dias com refresh de 60 dias; OAuth 2.0</td><td><strong>Upload-Post</strong></td></tr><tr><td>Regra de autenticidade: aplicações não podem permitir ações automáticas sem consideração individual</td><td><strong>Vorplabs — Pinterest agent access</strong> (diretrizes do desenvolvedor)</td></tr><tr><td>Exemplo de <code>POST /v5/pins</code> com <code>board_id</code>, <code>title</code>, <code>description</code>, <code>link</code>, <code>media_source</code></td><td><strong>PostEverywhere — How to Schedule Pinterest Pins with an API</strong></td></tr><tr><td>Sandbox em <code>api-sandbox.pinterest.com/v5</code>; não cria video pins</td><td><strong>Upload-Post</strong></td></tr></tbody></table></div>\n<hr>\n<h2>15.4 Ferramentas grátis de imagem</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado</th><th>Fonte</th></tr></thead><tbody><tr><td>Bing Image Creator: gerações lentas praticamente ilimitadas, sem marca d'água, <strong>uso comercial restrito no plano de consumidor</strong></td><td><strong>Pexo.ai — Best Free Online AI Image Generators 2026</strong> e <strong>Revoyant — Best Free AI Image Generators 2026</strong></td></tr><tr><td>Leonardo AI: ~150 tokens/dia (≈30-50 imagens), licença de uso comercial não exclusiva, saída pública no grátis</td><td><strong>RenderFlowAI</strong> e <strong>AIDigitalSpace — Free AI Image Generators 2026</strong></td></tr><tr><td>Ideogram: ~10 a 25 gerações/dia em fila lenta, melhor para texto dentro da imagem</td><td><strong>BrightSEOTools</strong> e <strong>Revoyant</strong></td></tr><tr><td>Adobe Firefly: ~25 créditos/mês, treinado em conteúdo licenciado, o mais seguro para uso comercial</td><td><strong>BasedLabs</strong>, <strong>Pexo.ai</strong> e <strong>Revoyant</strong></td></tr><tr><td>Canva grátis: designs ilimitados</td><td>Uso comum documentado</td></tr></tbody></table></div>\n<hr>\n<h2>15.5 Ferramentas grátis de vídeo</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado</th><th>Fonte</th></tr></thead><tbody><tr><td>CapCut desktop: exporta em 1080p/4K <strong>sem marca d'água</strong> no plano grátis, uso comercial OK para conteúdo próprio</td><td><strong>Heygen — 10 Best Free AI Video Generators 2026</strong> e <strong>AIVideoPicks</strong></td></tr><tr><td>Kling AI: ~66 créditos/dia (~3-6 clipes de 5s), <strong>com marca d'água e sem direito comercial</strong> no grátis</td><td><strong>ToolChase</strong> e <strong>Rescroll — Best Free AI Video Generators 2026</strong></td></tr><tr><td>Hailuo/MiniMax: ~3-5 gerações/dia, marca d'água, sem uso comercial no grátis</td><td><strong>Heygen</strong> e <strong>AIVideoPicks</strong></td></tr><tr><td>A maioria dos planos grátis de vídeo com IA proíbe uso comercial (Pika é exceção citada)</td><td><strong>Rescroll</strong> e <strong>ToolChase</strong></td></tr></tbody></table></div>\n<hr>\n<h2>15.6 Programas de afiliados (Brasil e global)</h2>\n<div class=\"rolagem\"><table><thead><tr><th>Dado usado</th><th>Fonte</th></tr></thead><tbody><tr><td>Hotmart até 80%, cookie 60-180 dias, Pix em ~2 dias, sem mensa   function copiar(texto, btn) {
    const fim = () => {
      if (!btn) return;
      const t = btn.textContent; btn.textContent = '✓ copiado';
      setTimeout(() => { btn.textContent = t; }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(fim).catch(() => copiarFallback(texto, fim));
    } else copiarFallback(texto, fim);
  }
  function copiarFallback(texto, fim) {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); fim();
  }

  function caixaPrompt(idPrompt, ctx, lang, { titulo, altura } = {}) {

    return `

  function passoValidacao() {

      const res = M.calcularScoreProjeto(proj, qual);
      const cor = res.cor === 'verde' ? 'ok' : res.cor === 'vermelho' ? 'erro' : res.cor === 'cinza' ? '' : 'aviso';
      return card(titulo, `<p class="mini">${desc}</p>` + checklistHTML(qual), `<span class="pill ${cor}">${res.score}/100</span>`);
    };
    const geral = ['produto', 'visual', 'seo', 'compliance'].map(q => M.calcularScoreProjeto(proj, q));
    const media = Math.round(geral.reduce((s, r) => s + r.score, 0) / 4);
    const bloqueios = geral.reduce((s, r) => s + r.bloqueios.length, 0);
    return `
      ${card('Placar geral', scoreHTML({ score: media, veredito: bloqueios ? 'Existem ' + bloqueios + ' bloqueio(s) de peso 3 — resolva antes de escalar' : media >= 85 ? 'Aprovado para escalar' : media >= 65 ? 'Viável com ajustes' : 'Fraco — revise as etapas anteriores', cor: bloqueios ? 'vermelho' : media >= 85 ? 'verde' : media >= 65 ? 'amarelo' : 'vermelho', pesoOk: 0, pesoTotal: 0, falhas: [], bloqueios: [], pendentes: [] }) + '<div class="mini">Média dos 4 checklists: produto, visual, SEO e compliance.</div>')}
      ${bloco('produto', '1 · Produto e oferta', 'Os itens de peso 3 bloqueiam: sem oferta aprovada, sem dor concreta ou com link proibido, não há projeto.')}
